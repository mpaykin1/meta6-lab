name: AI Solutions Catalog
on:
  push:
    branches: [lab/library-catalog]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/library/catalog-systems.mjs'
      - 'scripts/library/asset-links.mjs'
      - 'scripts/library/catalog-cli.mjs'
      - 'scripts/library/mutate-catalog-build.mjs'
      - 'scripts/library/mcp-test/**'
      - 'shared/approved/tools/library.mjs'
      - 'shared/approved/mcp.mjs'
      - 'scripts/library/source-policy.mjs'
      - 'scripts/library/verify-catalog.mjs'
      - 'scripts/library/verify-load.mjs'
      - 'scripts/library/mutate-verify-load.mjs'
      - 'scripts/library/mutate-catalog.mjs'
      - 'shared/library/catalog-solutions.json'
      - 'BIBLIOTEKA.md'
      - 'scripts/library/verify-biblioteka.mjs'
      - 'scripts/library/mutate-biblioteka.mjs'
      - '.github/workflows/ai-solutions-catalog.yml'
  workflow_dispatch:
concurrency:
  group: ai-solutions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extractor syntax
        run: |
          node --check scripts/library/catalog-systems.mjs
          node --check scripts/library/verify-catalog.mjs
          node --check scripts/library/mutate-catalog.mjs
          node --check scripts/library/catalog-cli.mjs
          node --check scripts/library/mutate-catalog-build.mjs
          node --check shared/approved/tools/library.mjs
          node --check scripts/library/mcp-test/client.mjs
          node --check scripts/library/verify-load.mjs
      - name: Install parser and MCP browser dependencies
        run: npm install --prefix scripts/library/mcp-test --ignore-scripts --no-audit --no-fund
      - name: Run deceptive catalog mutations
        run: |
          node scripts/library/mutate-catalog.mjs
          node scripts/library/mutate-catalog-build.mjs
      - name: Build systems catalog for all available allowlisted games
        run: node scripts/library/catalog-cli.mjs
      - name: Show system counts by game
        run: node -e "const c=require('./shared/library/catalog-solutions.json');for(const g of new Set(c.solutions.map(s=>s.game)))console.log(g,c.solutions.filter(s=>s.game===g).length)"
      - name: Install Chromium for real browser verification
        run: npm exec --prefix scripts/library/mcp-test -- playwright install --with-deps chromium
      - name: Catch deceptive browser loading results
        run: node scripts/library/mutate-verify-load.mjs
      - name: Run real headless Chromium solution and GLB probes
        run: node scripts/library/verify-load.mjs --write
      # The catalog verifier requires Chromium load evidence. Running it before
      # the browser probe made CI fail before the evidence could be generated.
      - name: Verify catalog after Chromium probes
        run: node scripts/library/verify-catalog.mjs
      - name: Reject stale per-game BIBLIOTEKA counts and run four mutations
        run: |
          node scripts/library/verify-biblioteka.mjs
          node scripts/library/mutate-biblioteka.mjs
      - name: 'Strict L3 acceptance: all systems and models must actually load'
        if: github.event_name == 'pull_request'
        run: node scripts/library/verify-load.mjs --verify --require-all
      - name: Official MCP SDK stdio integration
        if: github.event_name == 'pull_request'
        run: node scripts/library/mcp-test/client.mjs
      - name: Commit generated catalog only to the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/library-catalog'
        run: |
          git add shared/library/catalog-solutions.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "library: catalog exact owner-authored gameplay systems"
          git push origin "HEAD:lab/library-catalog"

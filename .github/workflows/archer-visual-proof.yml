name: Archer visual proof
on:
  pull_request:
    paths:
      - 'games/archer-in-the-fog/**'
      - 'scripts/archer-proof/**'
      - 'reports/archer-retention-exp/**'
      - '.github/workflows/archer-visual-proof.yml'
permissions:
  contents: read
concurrency:
  group: archer-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  visual-proof:
    if: startsWith(github.head_ref, 'lab/archer-retention-exp-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
      - name: Prove absence and invisible-hook mutations, or compare game versions
        shell: bash
        env:
          ARCHER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$ARCHER_BASE_SHA...HEAD" | grep -q '^games/archer-in-the-fog/'; then
            node scripts/archer-proof/archer.mjs
          else
            node scripts/archer-proof/archer.mjs --selftest
            git fetch --no-tags origin '+refs/heads/lab/archer-retention-exp-1-game:refs/remotes/origin/lab/archer-retention-exp-1-game'
            ARCHER_CANDIDATE_REF=refs/remotes/origin/lab/archer-retention-exp-1-game node scripts/archer-proof/archer.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archer-visual-proof-${{ github.run_id }}
          path: .archer-proof/*.png
          if-no-files-found: warn
          retention-days: 14

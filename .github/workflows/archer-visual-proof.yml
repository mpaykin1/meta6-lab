name: Archer visual proof
on:
  push:
    branches: [lab/archer-retention-exp-1-game]
    paths:
      - 'games/archer-in-the-fog/**'
      - 'scripts/archer-proof/**'
      - '.github/workflows/archer-visual-proof.yml'
  pull_request:
    paths:
      - 'games/archer-in-the-fog/**'
      - 'scripts/archer-proof/**'
      - 'reports/archer-retention-exp/**'
      - '.github/workflows/archer-visual-proof.yml'
permissions:
  contents: read
concurrency:
  group: archer-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-proof:
    if: startsWith(github.head_ref, 'lab/archer-retention-exp-') || github.ref == 'refs/heads/lab/archer-retention-exp-1-game'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workflow proof mutations
        run: node scripts/archer-proof/mutate-visual-runner.mjs
      - name: Browser dependencies
        id: browserdeps
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Diagnose startup on baseline and current game
        env:
          ARCHER_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/lab/archer-retention-exp-1' }}
        run: node scripts/archer-proof/diagnose-runtime.mjs
      - name: Verify Archer scripts parse
        run: |
          node --check games/archer-in-the-fog/assets/index-xsRfS2lk.js
          node --check games/archer-in-the-fog/bot-adapter.js
          node scripts/archer-proof/mutate-threat-halo.mjs
      - name: Prove absence and invisible-hook mutations, or compare game versions
        shell: bash
        env:
          ARCHER_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/lab/archer-retention-exp-1' }}
        run: |
          set -euo pipefail
          if git diff --name-only "$ARCHER_BASE_SHA...HEAD" | grep -q '^games/archer-in-the-fog/'; then
            node scripts/archer-proof/archer.mjs
          else
            node scripts/archer-proof/archer.mjs --selftest
          fi
      - name: Full Archer META BOT playthrough
        if: always() && steps.browserdeps.outcome == 'success'
        run: node scripts/meta-bot/run.mjs games/archer-in-the-fog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archer-visual-proof-${{ github.run_id }}
          path: .archer-proof/*.png
          if-no-files-found: warn
          retention-days: 14

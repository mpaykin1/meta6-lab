name: ASSET CHECK — бот-проверщик ассет-паков
on:
  pull_request:
    branches: [main]
    paths:
      - 'asset-packs/**'
      - 'automation/asset-check/**'
      - 'automation/asset-quality/**'
      - '.github/workflows/asset-check.yml'
  push:
    branches: [main]
    paths:
      - 'asset-packs/**'
      - 'automation/asset-check/**'
      - 'automation/asset-quality/**'
      - '.github/workflows/asset-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  asset-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: ffmpeg для проверки ogg/mp3
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Ловушки бота (должны быть зелёными)
        run: python -m unittest discover -s automation/asset-check -p 'test_*.py' -v
      - name: Охота на мутантов (каждая выключенная проверка обязана ронять ловушки)
        run: python automation/asset-check/mutate_bot.py
      - name: Проверка всех паков
        run: |
          set +e
          fail=0
          for d in asset-packs/*/*/; do
            name=$(basename "$d"); stage=$(basename "$(dirname "$d")")
            python -I automation/asset-check/check_pack.py "$d" --out "out/$stage-$name" > /dev/null
            code=$?
            { echo "## $stage / $name — exit $code"; sed -n '1,200p' "out/$stage-$name/REPORT.md"; } >> "$GITHUB_STEP_SUMMARY"
            # incoming/ — ещё в работе: HARD не валит прогон; ready/ — HARD запрещён
            if [ "$stage" = "ready" ] && [ $code -ne 0 ]; then fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-check-reports
          path: out/
  preview-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check published previews of changed asset pages
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINK_OK_WINDOW_SEC: 180
        shell: bash
        run: |
          set -euo pipefail
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          branch="${PREVIEW_BRANCH#lab/}"
          branch="${branch//\//-}"
          [[ "$branch" =~ ^[A-Za-z0-9._-]+$ ]]
          mapfile -t pages < <(git diff --name-only "$BASE_SHA" HEAD -- 'asset-packs/**/index.html')
          urls=()
          for page in "${pages[@]}"; do
            [[ -f "$page" ]] && urls+=("$base/preview/$branch/${page%index.html}")
          done
          if (( ${#urls[@]} )); then
            bash scripts/lab/link-ok.sh "${urls[@]}"
          else
            echo 'No changed asset page URLs to check.'
          fi

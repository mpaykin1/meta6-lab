name: META BOT B2 Adapter Integrity
on:
  push:
    branches: ['lab/bot-batch-1']
    paths:
      - 'games/twilight-isle-classic/**'
      - 'games/twilight-isles/**'
      - 'scripts/meta-bot-adapters/**'
      - '.github/workflows/bot-adapters-b2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/twilight-isle-classic/**'
      - 'games/twilight-isles/**'
      - 'scripts/meta-bot-adapters/**'
      - '.github/workflows/bot-adapters-b2.yml'
permissions:
  contents: read
jobs:
  verify-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual movement and snapshot contract
        run: node scripts/meta-bot-adapters/verify-adapters.mjs
      - name: Waypoint trap (next goal, real coin, re-plan) — rejects the old adapter
        run: |
          node scripts/meta-bot-adapters/trap-waypoint-advance.mjs
          # mutation: the pre-fix waypoint loop must be caught
          sed 's/< 0.75) { route.step = k; break; }/< 0) { route.step = k; break; }/' games/twilight-isle-classic/bot-adapter.js > /tmp/mut.js
          if node scripts/meta-bot-adapters/trap-waypoint-advance.mjs /tmp/mut.js; then echo '::error::waypoint trap missed the mutation'; exit 1; fi
      - name: Reject four mutations per adapter
        run: node scripts/meta-bot-adapters/mutate-adapters.mjs

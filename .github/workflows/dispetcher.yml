name: MG Dispatcher
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispetcher.yml'
      - 'scripts/dispetcher/**'
      - 'automation/dispetcher/**'
      - 'automation/prompts/MG_PYAT_AVTOZADACH.md'
  push:
    branches: [main]
    paths: [ZADACHI.md]
permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mg-dispatcher-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dispetcher/test/*.test.mjs
      - run: node scripts/dispetcher/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit queue to bot-state with five conflict retries
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch -q -C antisueta-refresh origin/main
            git reset --hard origin/main
            node scripts/dispetcher/run.mjs
            if bash scripts/polza/write-bot-state.sh DISPETCHER.md; then exit 0; fi
            echo "bot-state conflict retry $attempt"
          done
          exit 1
      - name: Run offline safety traps and daily noise measurement
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -q -C antisueta-noise origin/main
          node scripts/polza/verify-noise.mjs
          node scripts/polza/mutate-noise.mjs
          node scripts/polza/noise.mjs "$GITHUB_RUN_ID"
          files=(automation/progress/antisueta-noise.json automation/progress/antisueta-noise.log)
          if [ -f /tmp/antisueta-alert ]; then files+=(DLYA_CLAUDE.md); fi
          bash scripts/polza/write-bot-state.sh "${files[@]}"
      - name: Run consolidated hourly state and audit jobs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in status-dlya-claude.yml zadachi-watch.yml zanyato-watch.yml sliyanie-status.yml investigation-snapshot.yml auditor.yml; do
            echo "Dispatch: $workflow"
            gh workflow run "$workflow" --ref main --repo "$GITHUB_REPOSITORY"
          done

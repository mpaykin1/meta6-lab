name: MG Dispatcher
on:
  schedule:
    - cron: '21,51 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispetcher.yml'
      - 'scripts/dispetcher/**'
      - 'automation/dispetcher/**'
      - 'automation/prompts/MG_PYAT_AVTOZADACH.md'
      - 'automation/karta-sil.json'
  push:
    branches: [main]
    paths: [ZADACHI.md, automation/karta-sil.json]
permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mg-dispatcher-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dispetcher/test/*.test.mjs
      - run: node scripts/dispetcher/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit queue
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git add DISPETCHER.md TOLKNUT.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: refresh dispatcher queue'
            if git push; then exit 0; fi
            echo "push rejected (main moved), attempt $attempt: rebuild on fresh main"
            git fetch origin main
            git reset --hard origin/main
            node scripts/dispetcher/run.mjs
          done
          echo "main kept moving for 5 attempts"; exit 1

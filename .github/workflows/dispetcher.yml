name: MG Dispatcher
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dispetcher.yml'
      - 'scripts/dispetcher/**'
      - 'automation/dispetcher/**'
      - 'automation/prompts/MG_PYAT_AVTOZADACH.md'
  push:
    branches: [main]
    paths: [ZADACHI.md]
permissions:
  contents: write
  checks: read
  statuses: read
  pull-requests: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: mg-dispatcher-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/dispetcher/test/*.test.mjs
      - run: node scripts/dispetcher/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish queue exclusively to bot-state
        if: github.ref == 'refs/heads/main'
        run: bash scripts/polza/write-bot-state.sh DISPETCHER.md

name: Grange publication gate
on:
  push:
    branches: [main]
    paths:
      - 'asset-packs/incoming/bullet-car-gif/grange-gate/**'
      - '.github/workflows/grange-publication-gate.yml'
      - 'asset-packs/incoming/bullet-car-gif/grange-gate-requests/*.json'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable staging commit SHA
        required: true
        type: string
      manifest_path:
        description: Manifest under asset-packs/incoming/bullet-car-gif/staging/
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: grange-publication-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node trusted/asset-packs/incoming/bullet-car-gif/grange-gate/smoke.mjs
      - name: Select immutable request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_MANIFEST: ${{ inputs.manifest_path }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          req=None
          if os.environ['EVENT']=='workflow_dispatch':
              req={'candidate_sha':os.environ['INPUT_SHA'],'manifest_path':os.environ['INPUT_MANIFEST']}
          else:
              prefix='asset-packs/incoming/bullet-car-gif/grange-gate-requests/'
              paths=subprocess.check_output(['git','-C','trusted','diff','--diff-filter=A','--name-only','HEAD^','HEAD'],text=True).splitlines()
              matches=[p for p in paths if p.startswith(prefix) and p.endswith('.json')]
              if len(matches)>1: raise ValueError('one immutable request per commit')
              if matches: req=json.loads((Path('trusted')/matches[0]).read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              if req is None: out.write('present=false\n')
              else:
                  sha=req['candidate_sha']; p=req['manifest_path']
                  if not re.fullmatch('[0-9a-f]{40}',sha) or not re.fullmatch(r'asset-packs/incoming/bullet-car-gif/staging/[A-Za-z0-9_/-]+/manifest\.json',p): raise ValueError('invalid immutable request')
                  out.write(f'present=true\nsha={sha}\nmanifest={p}\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88 scikit-image==0.25.2
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m py_compile trusted/asset-packs/incoming/bullet-car-gif/grange-gate/synergy_gate.py trusted/asset-packs/incoming/bullet-car-gif/grange-gate/texture_motion_gate.py trusted/asset-packs/incoming/bullet-car-gif/grange-gate/hosted_manifest.py
      - if: steps.request.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          path: candidate-data
          persist-credentials: false
      - if: steps.request.outputs.present == 'true'
        name: Verify staged bytes
        env:
          CANDIDATE_SHA: ${{ steps.request.outputs.sha }}
          MANIFEST_PATH: ${{ steps.request.outputs.manifest }}
        run: |
          set -o pipefail
          python trusted/asset-packs/incoming/bullet-car-gif/grange-gate/hosted_manifest.py "$PWD/candidate-data" "$MANIFEST_PATH" "$CANDIDATE_SHA" "$RUNNER_TEMP/grange-manifest.json"
          python trusted/asset-packs/incoming/bullet-car-gif/grange-gate/synergy_gate.py "$RUNNER_TEMP/grange-manifest.json" --publication | tee "$RUNNER_TEMP/grange-result.json"
      - if: always() && steps.request.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grange-result-${{ steps.request.outputs.sha }}
          path: ${{ runner.temp }}/grange-result.json
          if-no-files-found: warn

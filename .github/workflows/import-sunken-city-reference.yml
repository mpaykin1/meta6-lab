name: Import original Sunken City reference
on:
  push:
    branches: [lab/sunken-city-reference-1109]
    paths: ['.github/workflows/import-sunken-city-reference.yml']
permissions:
  contents: write
jobs:
  import-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/sunken-city-reference-1109
          persist-credentials: true
      - name: Restore archive and all assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, zipfile, pathlib, shutil, json
          root=pathlib.Path('reference-archives/sunken-city-parts')
          parts=sorted(root.glob('part-*.bin'))
          assert len(parts)==34, f'Incomplete source: {len(parts)} of 34 parts'
          dest=pathlib.Path('reference-archives/zatonuvshiy-gorod-2026-11-09.zip')
          with dest.open('wb') as f:
              for part in parts:
                  with part.open('rb') as stream:
                      shutil.copyfileobj(stream,f)
          expected='7ad5111ec22d9d6f3183b0807a735d05f150e03bf57b8e9083be50e413fafcf3'
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          assert digest==expected, f'Archive changed: {digest}'
          game=pathlib.Path('games/sunken-city-reference')
          assert not game.exists(), 'Target already exists; refusing to overwrite'
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              for info in z.infolist():
                  path=pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts, 'Unsafe ZIP filename'
              z.extractall(game)
          showcase=json.loads((game/'showcase.json').read_text(encoding='utf-8'))
          catalog={'id':'sunken-city-reference','title':'Затонувший город',
              'kind':'owner-uploaded-reference','source_archive':str(dest),
              'source_sha256':expected, 'source_file_count':184,
              'entry':'games/sunken-city-reference/index.html',
              'manifest':'games/sunken-city-reference/showcase.json',
              'groups':{'models':'games/sunken-city-reference/glb/',
                        'blocks':'games/sunken-city-reference/blocks/',
                        'atlases':'games/sunken-city-reference/atlas/',
                        'sounds':'games/sunken-city-reference/sounds/'},
              'counts':{'models':len(showcase.get('models',[])),
                        'tiles':len(showcase.get('tiles',[])),
                        'blocks':len(showcase.get('blocks',[])),
                        'atlases':len(showcase.get('atlases',[]))},
              'reuse':'Owner-provided reference; verify third-party dependency rights separately'}
          out=pathlib.Path('shared/references/sunken-city-reference.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          queue=pathlib.Path('LAB_QUEUE.md')
          txt=queue.read_text(encoding='utf-8')
          marker='<!-- карточки ниже -->'
          card=('\n### lab/sunken-city-reference-1109 — «Затонувший город»\n'
                '- Эталон: исходный ZIP, 184 файла без перерисовки.\n'
                '- Сцена: https://mpaykin1.github.io/meta6-lab/games/sunken-city-reference/ (после merge).\n'
                '- Исходник: reference-archives/zatonuvshiy-gorod-2026-11-09.zip.\n'
                '- Каталог: shared/references/sunken-city-reference.json; подробности в showcase.json.\n'
                '- Статус: В РАБОТЕ — Pages / отрисовка и права сторонних зависимостей не подтверждены.\n'
                '- Михаил: запросил загрузить как эталон; визуальный PASS не заявлялся.\n')
          assert marker in txt, 'LAB_QUEUE insertion point not found'
          queue.write_text(txt.replace(marker,marker+card,1),encoding='utf-8')
          shutil.rmtree(root)
          pathlib.Path('.github/workflows/import-sunken-city-reference.yml').unlink()
          PY
      - name: Commit preserved source and playable reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- games/sunken-city-reference reference-archives/sunken-city-parts reference-archives/zatonuvshiy-gorod-2026-11-09.zip shared/references/sunken-city-reference.json LAB_QUEUE.md .github/workflows/import-sunken-city-reference.yml
          git commit -m "Import full Sunken City reference and machine catalog"
          git push origin HEAD:lab/sunken-city-reference-1109

name: INK v2 browser-free preview reachability
on:
  push:
    branches: [lab/ink-fallen-guardian-v2-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-http:
    runs-on: ubuntu-latest
    steps:
      - name: Check real public HTML and JS URLs
        shell: bash
        run: |
          set -euo pipefail
          URL='https://rawcdn.githack.com/mpaykin1/meta6-lab/17b6c42bc758ffc493e50eb1845f1b31e26846f8/preview/ink-fallen-guardian-v2/index.html'
          JS='https://rawcdn.githack.com/mpaykin1/meta6-lab/17b6c42bc758ffc493e50eb1845f1b31e26846f8/preview/ink-fallen-guardian-v2/ink-forest-v2.js'
          for item in "$URL" "$JS"; do
            code="$(curl --fail --location --retry 2 --max-time 35 --silent --show-error --output /tmp/ink-preview.html --write-out '%{http_code}' "$item")"
            test "$code" = "200"
            test -s /tmp/ink-preview.html
            echo "200 $item"
          done

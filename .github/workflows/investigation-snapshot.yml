name: Investigation snapshot
# GitHub is the sole persistence and publishing platform.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ZADACHI.md'
      - 'OSHIBKI.md'
      - 'automation/SLIYANIE.md'
      - 'rules/09-platforma/FINISH.md'
      - 'scripts/investigation/**'
      - '.github/workflows/investigation-snapshot.yml'
  pull_request:
    paths:
      - 'reports/investigation/**'
      - 'scripts/investigation/**'
      - '.github/workflows/investigation-snapshot.yml'
permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: investigation-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and build snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/investigation/build.mjs
          node scripts/investigation/build.mjs
          test -s reports/investigation/data.json
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            bash scripts/polza/write-bot-state.sh reports/investigation/data.json
          fi

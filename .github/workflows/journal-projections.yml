name: MG journal projections
on:
  push:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/**'
  pull_request:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/**'
      - '.github/workflows/journal-projections.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mg-journal-projections
  cancel-in-progress: false
jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/journal/validate.mjs
      - name: Publish compiled views exclusively to bot-state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          node scripts/journal/write.mjs
          bash scripts/polza/write-bot-state.sh journal/compiled/INDEX.md OSHIBKI.md ZADACHI.md SMENA.md docs/progress/INDEX.md

name: MG journal projections
on:
  push:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/build.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/build.mjs'
      - '.github/workflows/journal-projections.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mg-journal-projections
  cancel-in-progress: false
jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/journal/build.mjs --validate
      - name: Publish compiled views on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            node scripts/journal/build.mjs --write
            git add journal/compiled/
            git diff --cached --quiet && exit 0
            git commit -m "journal: compile append-only entries"
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

name: MG journal projections
on:
  push:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/**'
  pull_request:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'scripts/journal/**'
      - '.github/workflows/journal-projections.yml'
  workflow_dispatch:
# PR code is untrusted: it must never execute with the publication token.
permissions:
  contents: read
concurrency:
  group: mg-journal-projections
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/journal/validate.mjs
  projection:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/journal/validate.mjs
      - name: Publish compiled views on main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            node scripts/journal/write.mjs
            git add journal/compiled/ OSHIBKI.md ZADACHI.md SMENA.md docs/progress/
            git diff --cached --quiet && exit 0
            git commit -m "journal: compile append-only entries"
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

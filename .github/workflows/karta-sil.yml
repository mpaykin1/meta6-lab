name: Karta Sil
on:
  schedule:
    - cron: '9 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/karta-sil.yml'
      - 'scripts/karta-sil/**'
      - 'scripts/dispetcher/**'
      - 'automation/karta-sil.json'
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: karta-sil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  karta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/karta-sil/mutate-karta-sil.mjs
      - run: node --test scripts/dispetcher/test/*.test.mjs
      - name: Build map (fail closed on any GitHub API error)
        id: build
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KARTA_REPO: ${{ github.repository }}
        run: node scripts/karta-sil/run.mjs
      - name: Publish only real changes
        if: github.ref == 'refs/heads/main'
        run: |
          git add automation/karta-sil.json rules/09-platforma/KARTA_SIL.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update skill map from PR outcomes'
          git push
      - name: Preserve failure after publishing no-data state
        if: github.ref == 'refs/heads/main' && steps.build.outcome != 'success'
        run: exit 1

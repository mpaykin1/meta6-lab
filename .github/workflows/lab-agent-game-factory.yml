name: LAB Agent Game Factory
# Trusted GitHub Actions entrypoint; no anonymous writes, costs or canonical production changes.
on:
  push:
    branches: ['lab/agent-game-candidate']
    paths: ['scripts/lab/agent-game-candidate.cjs', '.github/workflows/lab-agent-game-factory.yml']
  workflow_dispatch:
    inputs:
      slug:
        description: 'Unique candidate game slug (a-z, 0-9 and dash)'
        required: true
        type: string
      game_card_json:
        description: 'Structured game card fields only; no executable code or asset URLs'
        required: false
        default: '{}'
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mpaykin1/World_server
          ref: master
          path: world-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for independent gameplay verification
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate original game candidate with validated existing engine
        env:
          GAME_SLUG: ${{ inputs.slug || 'confluence-studio' }}
          GAME_REQUEST_JSON: ${{ inputs.game_card_json || '{}' }}
        run: |
          if [ ! -f "meta-games-worlds/generated-${GAME_SLUG}/index.html" ]; then
            node scripts/lab/agent-game-candidate.cjs
          else
            echo "::error::Existing generated game has no verified SOURCE_ASSETS.json; cannot use it as a META GAMES donor-compliant candidate"
            exit 1
          fi
      - name: Verify desktop six-scene completion and real mobile touch before promotion
        env:
          GAME_SLUG: ${{ inputs.slug || 'confluence-studio' }}
        run: node scripts/lab/verify-agent-game.mjs
      - name: Verify MCP protocol and anonymous-write isolation
        run: node scripts/lab/verify-agent-factory-mcp.mjs
      - name: Save only bot-verified game into sandbox branch, never directly into main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- meta-games-worlds/generated-*)" ]; then
            echo "Existing game passed independent bot; no duplicate commit"
            exit 0
          fi
          git config user.name 'META GAMES factory'
          git config user.email 'meta-games-factory@users.noreply.github.com'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            branch="lab/agent-generated-$RUN_ID"
            git checkout -b "$branch"
          else
            branch="$GITHUB_REF_NAME"
          fi
          git add meta-games-worlds/generated-*
          git commit -m "feat(game): new engine-validated sandbox game candidate"
          git push origin "$branch"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh pr create --base main --head "$branch" --title "Generated META GAMES candidate $RUN_ID" --body "Trusted sandbox-only candidate from existing seven-engine generator. No external assets, no production publication. Requires independent gameplay bot, rights and owner review."
          fi
          gh workflow run lab-pages.yml --ref main -R "$GITHUB_REPOSITORY"

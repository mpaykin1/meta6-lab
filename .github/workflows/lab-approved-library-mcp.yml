name: LAB Approved Source MCP Live
on:
  push:
    branches: ['lab/approved-library-mcp-live']
    paths:
      - 'shared/approved/**'
      - 'scripts/shared/verify-approved-mcp.mjs'
      - '.github/workflows/lab-approved-library-mcp.yml'
  pull_request:
    paths:
      - 'shared/approved/**'
      - 'scripts/shared/verify-approved-mcp.mjs'
      - '.github/workflows/lab-approved-library-mcp.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/shared/build-index.mjs --check
      - run: node scripts/shared/verify-approved-mcp.mjs

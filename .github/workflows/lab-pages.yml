name: LAB Pages
# Файл песочницы (Claude). Сайт: корень = main, каждая ветка lab/<имя> -> /preview/<имя>/.
on:
  push:
    branches: [main, 'lab/**']
    # Skip report-only/status-only pushes: they cannot change public site files.
    paths:
      - '**/index.html'
      - 'meta-games/**'
      - 'meta-games-worlds/**'
      - 'games/**'
      - 'demos/**'
      - 'assets/**'
      - 'skins/**'
      - 'shared/**'
      - 'preview/**'
      - 'scripts/lab/build-site.sh'
      - 'scripts/lab/link-ok.sh'
      - 'scripts/lab/mutate-link-ok.sh'
      - 'LINKS.txt'
      - '.github/workflows/lab-pages.yml'
  workflow_run:
    workflows: ['Sync from meta6', 'META GAMES guard']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
# Окружение github-pages разрешает деплой только из main. Пуш в lab/** не деплоит сам,
# а перезапускает этот workflow на main (сборка всё равно берёт все ветки lab/**).
jobs:
  kick-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTTP 200 checker and mutation traps
        run: bash scripts/lab/mutate-link-ok.sh
      - name: Rebuild the site from main (includes this branch preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One direct POST avoids the extra workflow-lookup GET (installation API quota).
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/lab-pages.yml/dispatches" -f ref=main; then
              exit 0
            fi
            [[ "$attempt" -eq 3 ]] || sleep "$((attempt * 20))"
          done
          exit 1
  deploy:
    # guard on a main push already has its own push-run of this workflow: skip the duplicate.
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_run' && github.event.workflow_run.name == 'META GAMES guard' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lab-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify HTTP 200 checker and mutation traps
        run: bash scripts/lab/mutate-link-ok.sh
      - name: Build sandbox site (main + all lab/** previews)
        run: bash scripts/lab/build-site.sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Collect public URLs from built pages and LINKS
        shell: bash
        run: |
          set -euo pipefail
          base='https://mpaykin1.github.io/meta6-lab'
          {
            cat _site/LINKS.txt
            if [ "${{ github.event_name }}" = push ]; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                -- '*/index.html' 2>/dev/null | while read -r f; do
                [[ -f "_site/$f" ]] && echo "$base/${f%index.html}"
              done
            fi
          } | grep -E '^https://mpaykin1[.]github[.]io/meta6-lab/' |
            LC_ALL=C sort -u > /tmp/lab-links.txt
          test -s /tmp/lab-links.txt
          echo "CHECKING $(wc -l < /tmp/lab-links.txt) URLS"
      - name: Check published public URLs
        run: |
          mapfile -t urls < /tmp/lab-links.txt
          bash scripts/lab/link-ok.sh "${urls[@]}"
      - name: Check that main and every preview answer 200
        shell: bash
        run: |
          set -euo pipefail
          base='https://mpaykin1.github.io/meta6-lab'
          urls=("$base/meta-games/")
          while read -r p; do [ -n "$p" ] && urls+=("$base/preview/$p/meta-games/"); done < _site/.lab-previews
          for u in "${urls[@]}"; do
            ok=0; for i in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 20 "$u?rev=${GITHUB_SHA}"; then ok=1; break; fi; sleep 10; done
            [ "$ok" = 1 ] && echo "200 $u" || { echo "NOT 200: $u" >&2; exit 1; }
          done

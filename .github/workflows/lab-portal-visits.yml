name: LAB Portal Visited World Persistence
on:
  pull_request:
    paths: ['meta-games/**','.github/workflows/lab-portal-visits.yml','scripts/lab/check-portal-visits.mjs','scripts/lab/portal-link-guard.mjs','scripts/lab/mutate-portal-links.mjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/lab/mutate-portal-links.mjs
      - run: node scripts/lab/check-portal-visits.mjs

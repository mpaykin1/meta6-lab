name: LAB shared-original-components
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'shared/**'
      - 'scripts/shared/**'
      - '.github/workflows/lab-shared-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/shared/build-index.mjs
      - run: node scripts/shared/build-index.mjs --check
      - run: node scripts/shared/verify-approved-runtime.mjs

name: LAB shared-original-components
on:
  pull_request:
    paths:
      - 'shared/**'
      - 'scripts/shared/**'
      - '.github/workflows/lab-shared-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/shared/build-index.mjs
      - run: node scripts/shared/build-index.mjs --check
      - run: node scripts/shared/verify-approved-runtime.mjs
      - name: Write compact checks summary
        if: always()
        env:
          COMPACT_JOB_STATUS: ${{ job.status }}
          COMPACT_JOB_NAME: ${{ github.job }}
        run: node scripts/status/write-run-summary.mjs "$COMPACT_JOB_STATUS" "$COMPACT_JOB_NAME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_STEP_SUMMARY"

name: LAB Shared Seven Browser
on:
  pull_request:
    paths: ['shared/**','scripts/shared/**','demos/patch-pixelfx/**','.github/workflows/lab-shared-seven-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/shared/verify-seven-browser.mjs
      - run: node scripts/shared/verify-patch-game-browser.mjs

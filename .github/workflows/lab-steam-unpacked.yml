name: LAB Steam unpacked executable
on:
  pull_request:
    paths:
      - 'platforms/**'
      - '.github/workflows/lab-steam-unpacked.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  steam-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Electron runtime syntax
        run: |
          node --check platforms/desktop/main.cjs
          node platforms/scripts/check-steam-permissions.cjs
          node --check platforms/desktop/preload.cjs
          node --check platforms/scripts/prepare-web.mjs
      - name: Compile Steam candidate to an unpacked executable
        working-directory: platforms
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run desktop:pack
          if (!(Test-Path 'release/win-unpacked/META GAMES.exe')) { throw 'Unpacked Steam executable is missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-unpacked-steam-candidate
          path: platforms/release/win-unpacked/
          if-no-files-found: error
      - name: Write compact checks summary
        if: always()
        env:
          COMPACT_JOB_STATUS: ${{ job.status }}
          COMPACT_JOB_NAME: ${{ github.job }}
        shell: bash
        run: node scripts/status/write-run-summary.mjs "$COMPACT_JOB_STATUS" "$COMPACT_JOB_NAME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_STEP_SUMMARY"

name: LAB Veil Shared Narrative Gameplay
on:
  pull_request:
    paths: ['games/veil-terraces-shared/**', '.github/workflows/lab-veil-shared.yml']
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play all six levels twice with real player controls
        env:
          META_BOT_FPS_FILE: .meta-bot-cache/fps.json
        run: node scripts/meta-bot/run.mjs games/veil-terraces-shared

name: META GAMES native candidates

# Build candidates only: no Play Console / Steam publication, signing, or auto-publishing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['games/**', 'meta-games/**', 'meta-games-worlds/**', 'shared/**', 'audio/**', 'platforms/**', '.github/workflows/meta-games-native-build.yml']
  pull_request:
    paths: ['games/**', 'meta-games/**', 'meta-games-worlds/**', 'shared/**', 'audio/**', 'platforms/**', '.github/workflows/meta-games-native-build.yml']

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local game packaging
        working-directory: platforms
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-catalog.mjs
          node --check scripts/prepare-web.mjs
          npm run prepare:steam
          node -e "const fs=require('fs'); const c=require('./dist/www/catalog.json'); const m=require('./dist/www/channel.json'); if(!m.candidate||m.adsEnabled||m.games.length!==c.games.length)process.exit(1); for(const g of c.games)if(!fs.readFileSync('./dist/www/'+g.entry,'utf8').includes('_meta_native.js'))process.exit(1);"
          npm run prepare:play
          node -e "const m=require('./dist/www/channel.json'); if(m.channel!=='google-play'||!m.candidate||m.adsEnabled)process.exit(1);"

  steam-windows:
    needs: catalog
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native packager
        working-directory: platforms
        run: npm install --no-audit --no-fund
      - name: Package Windows app
        working-directory: platforms
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-steam-unpacked-candidate
          path: platforms/release/win-unpacked/
          if-no-files-found: error
  android-debug:
    needs: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager unavailable"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install native packager
        working-directory: platforms
        run: npm install --no-audit --no-fund
      - name: Create Android WebView project
        working-directory: platforms
        run: |
          npm run prepare:play
          npm run android:init
          npm run android:sync
      - name: Version candidate with workflow number
        shell: bash
        run: |
          set -euo pipefail
          gradle=platforms/android/app/build.gradle
          version=$((10000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode $version/" "$gradle"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"0.1.$GITHUB_RUN_NUMBER\"/" "$gradle"
          grep -q "versionCode $version" "$gradle"
      - name: Package debug APK and unsigned release AAB
        working-directory: platforms/android
        run: bash ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-android-debug-candidate
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-android-unsigned-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

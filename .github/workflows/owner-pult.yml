name: Owner Pult
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - scripts/pult/**
      - meta-games/pult/**
      - meta-games/index.html
      - .github/workflows/owner-pult.yml
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: owner-pult-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate from FINISH, storefront and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pult/build.mjs
      - name: Verify progress, real game links and previews
        run: node scripts/pult/verify-pult.mjs
      - name: Reject three mutations, including deceptive 404
        run: node scripts/pult/mutate-pult.mjs
      - name: Commit generated page (authorized branch only)
        if: github.event_name != 'pull_request' || github.head_ref == 'lab/owner-pult'
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- meta-games/pult/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(pult): refresh playable owner dashboard [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Rebuild Pages through existing LAB Pages
        if: github.event_name != 'pull_request' || github.head_ref == 'lab/owner-pult'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab-pages.yml --ref main -R "$GITHUB_REPOSITORY"

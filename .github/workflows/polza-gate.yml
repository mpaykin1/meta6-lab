name: POLZA gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: read
jobs:
  polza:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: polza-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify valid PR benefit modes
        run: node scripts/polza/verify-polza.mjs
      - name: Verify permanent mutation traps
        run: node scripts/polza/mutate-polza.mjs
      - name: Verify daily noise meter and its permanent fuses
        run: |
          node scripts/polza/verify-noise.mjs
          node scripts/polza/mutate-noise.mjs
      - name: Reject useless or unproven pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/polza/gate.mjs < "$GITHUB_EVENT_PATH"

name: SEO Catalog Validator
on:
  pull_request:
    paths:
      - 'claude-games/**'
      - 'scripts/lab/check-claude-seo.mjs'
      - 'scripts/lab/mutate-claude-seo.mjs'
      - 'progress/seo-claude-games.json'
      - '.github/workflows/seo-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'claude-games/**'
      - 'scripts/lab/check-claude-seo.mjs'
      - 'scripts/lab/mutate-claude-seo.mjs'
      - 'progress/seo-claude-games.json'
permissions:
  contents: read
concurrency:
  group: seo-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seo-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue metadata, JSON-LD and sitemap
        run: node scripts/lab/check-claude-seo.mjs
      - name: Reject three broken SEO mutations
        run: node scripts/lab/mutate-claude-seo.mjs

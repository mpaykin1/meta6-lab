name: Skin factory — cut and mutation gates
on:
  push:
    branches: ['lab/skin-factory']
    paths:
      - 'skins/sources/*/parts-sheet.png'
      - 'skins/sources/*/parts-sheet.md'
      - 'scripts/skins/cut-sheet.mjs'
      - 'scripts/skins/mutate-cut-sheet.mjs'
      - 'scripts/skins/build-pack.mjs'
      - 'scripts/skins/mutate-build-pack.mjs'
      - 'scripts/skins/preview.mjs'
      - 'scripts/skins/mutate-preview.mjs'
      - '.github/workflows/skin-factory.yml'
  pull_request:
    paths:
      - 'skins/sources/*/parts-sheet.png'
      - 'skins/sources/*/parts-sheet.md'
      - 'scripts/skins/cut-sheet.mjs'
      - 'scripts/skins/mutate-cut-sheet.mjs'
      - '.github/workflows/skin-factory.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Установить бесплатный обработчик PNG
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Вырезать настоящие детали по таблице
        run: |
          set -euo pipefail
          node scripts/skins/cut-sheet.mjs skins/sources/rusty-robot
          node scripts/skins/cut-sheet.mjs skins/sources/rusty-robot --verify
      - name: Проверить испорченные листы и подменённые файлы
        run: node scripts/skins/mutate-cut-sheet.mjs skins/sources/rusty-robot
      - name: Собрать реальный пакет из новых PNG
        run: node scripts/skins/build-pack.mjs skins/sources/rusty-robot
      - name: Проверить ловушки сборщика (включая обман старым файлом)
        run: node scripts/skins/mutate-build-pack.mjs skins/sources/rusty-robot
      - name: Установить Chromium для настоящей игры
        run: |
          npm install --no-save --no-package-lock sharp@0.34.4 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Сделать 3D-превью и сравнение с эскизом
        run: |
          node scripts/skins/preview.mjs skins/sources/rusty-robot
          node scripts/skins/preview.mjs skins/sources/rusty-robot --verify
      - name: Проверить обман старым превью
        run: node scripts/skins/mutate-preview.mjs skins/sources/rusty-robot
      - name: Создать ZIP и проверить все S1–S12
        run: node scripts/skins/build-pack.mjs skins/sources/rusty-robot --finalize
      - name: Опубликовать скин и изображение в ветке PR
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/lab/skin-factory' }}
        run: |
          set -euo pipefail
          git config user.name 'META GAMES Skin Factory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skins/packs/rusty-robot/ skins/packs/rusty-robot.zip \
            skins/sources/rusty-robot/cut-preview.png \
            skins/sources/rusty-robot/side-by-side.png
          if ! git diff --cached --quiet; then
            git commit -m "skin factory: publish generated rusty robot pack and visual comparison"
            git push origin HEAD:lab/skin-factory
          fi
      - name: Сохранить вырезки и визуальную сверку
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cut-preview-rusty-robot
          path: |
            skins/sources/rusty-robot/cut-preview.png
            skins/sources/rusty-robot/cut/**
            skins/packs/rusty-robot/**
            skins/packs/rusty-robot.zip
            skins/sources/rusty-robot/side-by-side.png
            skins/sources/rusty-robot/preview-meta.json
          if-no-files-found: warn

      - name: Комментарий в PR с картинкой и ссылкой на игру
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/lab/skin-factory' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: context.repo.owner + ':lab/skin-factory'
            });
            if (!prs.data.length) return;
            const image = 'https://raw.githubusercontent.com/' + context.repo.owner + '/' + context.repo.repo +
              '/lab/skin-factory/skins/sources/rusty-robot/side-by-side.png';
            const run = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const ok = fs.existsSync('skins/sources/rusty-robot/side-by-side.png');
            const body = [
              '### Фабрика скинов — ржавый робот',
              ok ? '![Эскиз | герой в скине](' + image + ')' : 'Сравнение не создано — проверьте упавший шаг.',
              '[Играть в Skin Trainer](https://raw.githack.com/mpaykin1/meta6-lab/lab/skin-factory/games/skin-trainer/index.html?skin=../../skins/packs/rusty-robot/)',
              ok ? 'Проблемы: нет ошибок консоли Chrome; S1–S12 и К5 — в прогоне.' : 'Проблемы: не пройдена сборка или Chrome.',
              '[Последний прогон](' + run + ')'
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prs.data[0].number, body
            });

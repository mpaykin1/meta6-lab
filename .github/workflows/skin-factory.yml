name: Skin factory — cut and mutation gates
on:
  push:
    branches: ['lab/skin-factory']
    paths:
      - 'skins/sources/*/parts-sheet.png'
      - 'skins/sources/*/parts-sheet.md'
      - 'scripts/skins/cut-sheet.mjs'
      - 'scripts/skins/mutate-cut-sheet.mjs'
      - 'scripts/skins/build-pack.mjs'
      - 'scripts/skins/mutate-build-pack.mjs'
      - 'scripts/skins/preview.mjs'
      - 'scripts/skins/mutate-preview.mjs'
      - '.github/workflows/skin-factory.yml'
  pull_request:
    paths:
      - 'skins/sources/*/parts-sheet.png'
      - 'skins/sources/*/parts-sheet.md'
      - 'scripts/skins/cut-sheet.mjs'
      - 'scripts/skins/mutate-cut-sheet.mjs'
      - '.github/workflows/skin-factory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Установить бесплатный обработчик PNG
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Вырезать настоящие детали по таблице
        run: |
          set -euo pipefail
          node scripts/skins/cut-sheet.mjs skins/sources/rusty-robot
          node scripts/skins/cut-sheet.mjs skins/sources/rusty-robot --verify
      - name: Проверить испорченные листы и подменённые файлы
        run: node scripts/skins/mutate-cut-sheet.mjs skins/sources/rusty-robot
      - name: Собрать реальный пакет из новых PNG
        run: node scripts/skins/build-pack.mjs skins/sources/rusty-robot
      - name: Проверить ловушки сборщика (включая обман старым файлом)
        run: node scripts/skins/mutate-build-pack.mjs skins/sources/rusty-robot
      - name: Установить Chromium для настоящей игры
        run: |
          npm install --no-save --no-package-lock sharp@0.34.4 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Сделать 3D-превью и сравнение с эскизом
        run: |
          node scripts/skins/preview.mjs skins/sources/rusty-robot
          node scripts/skins/preview.mjs skins/sources/rusty-robot --verify
      - name: Проверить обман старым превью
        run: node scripts/skins/mutate-preview.mjs skins/sources/rusty-robot
      - name: Создать ZIP и проверить все S1–S12
        run: node scripts/skins/build-pack.mjs skins/sources/rusty-robot --finalize
      - name: Сохранить вырезки и визуальную сверку
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cut-preview-rusty-robot
          path: |
            skins/sources/rusty-robot/cut-preview.png
            skins/sources/rusty-robot/cut/**
            skins/packs/rusty-robot/**
            skins/packs/rusty-robot.zip
            skins/sources/rusty-robot/side-by-side.png
            skins/sources/rusty-robot/preview-meta.json
          if-no-files-found: warn

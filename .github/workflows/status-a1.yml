name: A1 STATUS
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!STATUS.md'
  pull_request:
    paths:
      - '.github/workflows/status-a1.yml'
      - 'scripts/status/status-a1.mjs'
      - 'scripts/status/verify-a1.mjs'
      - 'scripts/status/mutate-status-a1.mjs'
      - 'STATUS.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: a1-status-${{ github.ref }}
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and catch deceptive mutations
        run: |
          node --check scripts/status/status-a1.mjs
          node --test scripts/status/verify-a1.mjs
          node scripts/status/mutate-status-a1.mjs
      - name: Publish short status on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'meta6-status-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            node scripts/status/status-a1.mjs
            git add STATUS.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(status-a1): refresh'
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q origin main
            git reset --hard origin/main
          done
          exit 1

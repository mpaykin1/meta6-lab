name: STATUS compact guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows:
      - 'B1 — all games open without console errors'
      - 'KONTUR Guard'
      - 'META BOT'
      - 'LAB focused META BOT'
      - 'LAB shared-original-components'
      - 'LAB Shared Seven Browser'
      - 'LAB Approved Source MCP Live'
      - 'LAB approved-game-sources'
      - 'LAB component consumer audit'
      - 'LAB shared library deletion guard'
      - 'game-browser-check'
      - 'LAB Native Catalog Candidate'
      - 'LAB Steam unpacked executable'
      - 'LAB Veil Shared Narrative Gameplay'
      - 'META GAMES guard'
      - 'LAB Progress'
      - 'META Repair Bot'
      - 'META GAMES MCP run_bot M4'
      - 'LAB MCP Edit Game M3 M5'
      - 'Library Machine'
      - 'storefront-p1'
      - 'LAB Portal Visited World Persistence'
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: status-compact-main
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Permanent status fault injections
        run: node scripts/status/mutate-status.mjs
      - name: Validate status against the current main
        run: |
          git fetch origin main
          node scripts/status/verify.mjs "$(git merge-base HEAD origin/main)"
      - name: JavaScript syntax for summary pipeline
        run: |
          node --check scripts/status/generate.mjs
          node --check scripts/status/check-summary.mjs
          node --check scripts/status/write-run-summary.mjs
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh current status and persist the latest short run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2; do
            git fetch origin main
            git reset --hard origin/main
            if [ -n "$SOURCE_RUN_ID" ]; then node scripts/status/check-summary.mjs; fi
            node scripts/status/generate.mjs
            node scripts/status/verify.mjs HEAD
            git add STATUS.md reports/LAST_RUN.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(status): refresh current source and checks'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

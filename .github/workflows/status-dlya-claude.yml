name: status-dlya-claude
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!automation/STATUS.md'
      - '!automation/status.json'
  pull_request:
    paths:
      - 'scripts/status/**'
      - '.github/workflows/status-dlya-claude.yml'
      - 'automation/CLAUDE_CHECKED.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: status-dlya-claude-${{ github.ref }}
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Selftest and permanent mutation traps (offline)
        run: node scripts/status/selftest.mjs
      - name: Generate progress.json using the existing Claude script (unchanged)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/meta-progress/progress.mjs
      - name: Build GitHub facts and compact summary
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ github.token }}
          STATUS_REPO: ${{ github.repository }}
          STATUS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/status/build.mjs
      - name: Publish facts exclusively to bot-state
        if: github.event_name != 'pull_request'
        run: bash scripts/polza/write-bot-state.sh automation/STATUS.md automation/status.json

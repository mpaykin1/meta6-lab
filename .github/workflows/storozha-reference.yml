name: STOROZHA protected originals and new reference exception
# A pull_request paths filter is prohibited here: every PR must be checked.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/storozha/reference-check.mjs', '.github/workflows/storozha-reference.yml']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: storozha-ref-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  storozha-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact PR files (never run external code)
        env:
          STOROZHA_REPO: ${{ github.repository }}
          STOROZHA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STOROZHA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/storozha/reference-check.mjs

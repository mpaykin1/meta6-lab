name: STOROZHA mutation traps
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/storozha/**'
      - '.github/workflows/storozha-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/storozha/**'
      - '.github/workflows/storozha-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storozha-traps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storozha-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production fixture contracts
        run: node scripts/storozha/verify-storozha.mjs
      - name: Three-plus real breaking mutations per sentinel
        run: node scripts/storozha/mutate-storozha.mjs
      - name: Protected rename contracts
        if: always()
        run: |
          node --input-type=module -e "import * as c from './scripts/storozha/core.mjs';
          import {verifyReferences} from './scripts/storozha/verify-resume.mjs'; verifyReferences(c)"
      - name: Branch update contracts
        if: always()
        run: |
          node --input-type=module -e "import {updateHeads} from './scripts/storozha/update-heads.mjs';
          import {verifyUpdates} from './scripts/storozha/verify-resume.mjs'; await verifyUpdates({updateHeads})"
      - name: Branch update and protected rename mutations
        run: node scripts/storozha/mutate-resume.mjs
      - name: Maintenance API behavior and mutations
        run: node scripts/storozha/mutate-maintenance.mjs

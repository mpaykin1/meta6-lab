name: Sync from meta6
# Файл песочницы (Claude). Раз в сутки переносит в main песочницы ТОЛЬКО то, что изменилось
# в mpaykin1/meta6 с прошлой синхронизации (основной проект главнее).
# 10.11.2026: прежний rsync --delete удалял принятую в песочнице работу (OSHIBKI №15).
# Теперь: scripts/lab/sync-from-meta6.sh — файлы только песочницы не трогаются,
# правки обеих сторон остаются в версии песочницы и выводятся как конфликты.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-from-meta6
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 500
      - name: Self-test sync script (4 traps)
        run: bash scripts/lab/test-sync-from-meta6.sh
      - name: Apply meta6 changes since last sync
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/mpaykin1/meta6 /tmp/m6
          M6=$(git -C /tmp/m6 rev-parse HEAD)
          export SYNC_CONFLICTS=/tmp/conflicts.txt
          bash scripts/lab/sync-from-meta6.sh . /tmp/m6 | tee /tmp/sync.log
          for w in meta-bot.yml meta-games-guard.yml game-browser-check.yml; do
            cmp -s "/tmp/m6/.github/workflows/$w" ".github/workflows/$w" || echo "::warning::$w differs from meta6 — Claude must update it in the sandbox"; done
          { echo "### Sync from meta6"; cat /tmp/sync.log; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'meta6-lab sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          printf 'sync: meta6 main %s\n\nmeta6: https://github.com/mpaykin1/meta6/commit/%s\n\n%s\n' "${M6:0:8}" "$M6" "$(cat /tmp/sync.log)" > /tmp/msg
          git commit -q -F /tmp/msg
          git push origin HEAD:main

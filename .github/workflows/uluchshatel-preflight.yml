name: Улучшатель — проверка безопасного захвата
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/uluchshatel/**'
      - 'automation/uluchshatel/**'
      - 'automation/prompts/ULUCHSHATEL.md'
      - 'docs/INVENTORY_skin-trainer.md'
      - '.github/workflows/uluchshatel-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uluchshatel-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check scripts/uluchshatel/preflight.mjs
          node --check scripts/uluchshatel/verify-preflight.mjs
          node --check scripts/uluchshatel/mutate-preflight.mjs
      - name: Проверка и ловушки, включая обман
        run: |
          node scripts/uluchshatel/verify-preflight.mjs
          node scripts/uluchshatel/mutate-preflight.mjs

name: ZADACHI watch
# Файл Claude, 10.11.2026. Сторож без ИИ: ведёт ZADACHI.md — таблицу всех задач ChatGPT по МГ и МГЛ.
# Статус берётся из GitHub (PR слит / закрыт / время последнего коммита), а не со слов агента.
# Изменения сторожа разрешены владельцем в задаче 10.11.2026.
on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths: ['ZADACHI.md']
  pull_request_target:
    types: [opened, closed]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/zadachi/**'
      - '.github/workflows/zadachi-watch.yml'
      - 'rules/06-rabota-ii-s-kodom/TABLITSA_ZADACH.md'
      - 'automation/prompts/MG_PYAT_AVTOZADACH.md'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  checks: read
concurrency:
  group: zadachi-watch-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression cases and mutation traps
        run: node scripts/zadachi/verify.mjs && node scripts/zadachi/mutate.mjs
  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test and traps
        run: node scripts/zadachi/verify.mjs && node scripts/zadachi/mutate.mjs
      - name: Limit factual main writes to one per hour
        id: publish_rate
        shell: bash
        run: |
          set -euo pipefail
          # A GitHub API failure must not grant permission to publish.
          recent=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=ZADACHI.md&per_page=100" \
            --jq '[.[] | select(.commit.author.name == "zadachi-watch") | .commit.author.date][0] // empty')
          if [ -n "$recent" ]; then
            last=$(date -u -d "$recent" +%s)
            now=$(date -u +%s)
            if [ $((now - last)) -lt 3600 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Not publishing: last ZADACHI bot commit was under one hour ago"
            fi
          fi
      - name: Update ZADACHI.md from GitHub
        if: steps.publish_rate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node scripts/zadachi/watch.mjs | tee /tmp/z.log
            tail -1 /tmp/z.log >> "$GITHUB_STEP_SUMMARY"
            git diff --quiet && { echo "no changes"; exit 0; }
            git config user.name 'zadachi-watch'; git config user.email 'actions@users.noreply.github.com'
            git commit -qam "ZADACHI: $(tail -1 /tmp/z.log | tr -d '*' | cut -c1-110)"
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1

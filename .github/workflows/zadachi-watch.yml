name: ZADACHI watch
# Файл Claude, 10.11.2026. Сторож без ИИ: ведёт ZADACHI.md — таблицу всех задач ChatGPT по МГ и МГЛ.
# Статус берётся из GitHub (PR слит / закрыт / время последнего коммита), а не со слов агента.
# Изменения сторожа разрешены владельцем только в этой задаче через PR.
on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths: ['ZADACHI.md']
  pull_request:
    paths:
      - 'scripts/zadachi/**'
      - '.github/workflows/zadachi-watch.yml'
  pull_request_target:
    types: [opened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: zadachi-watch
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ZADACHI regression tests and mutation traps
        run: node scripts/zadachi/verify.mjs && node scripts/zadachi/mutate.mjs
      - name: Old watcher must fail the new regression tests
        shell: bash
        run: |
          git fetch --no-tags origin 83accb97c6b03d61cc7eb8eff38c7b0446521f7d
          git show 83accb97c6b03d61cc7eb8eff38c7b0446521f7d:scripts/zadachi/watch.mjs > /tmp/old-zadachi-watch.mjs
          if node scripts/zadachi/verify.mjs /tmp/old-zadachi-watch.mjs > /tmp/zadachi-old.log 2>&1; then
            echo "::error::Old watcher unexpectedly passed new regression tests"
            exit 1
          fi
          grep -q ZADACHI_VERIFY_FAIL /tmp/zadachi-old.log

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test and traps
        run: node scripts/zadachi/verify.mjs && node scripts/zadachi/mutate.mjs
      - name: Update ZADACHI.md from GitHub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            node scripts/zadachi/watch.mjs | tee /tmp/z.log
            tail -1 /tmp/z.log >> "$GITHUB_STEP_SUMMARY"
            git diff --quiet && { echo "no changes"; exit 0; }
            git config user.name 'zadachi-watch'; git config user.email 'actions@users.noreply.github.com'
            git commit -qam "ZADACHI: $(tail -1 /tmp/z.log | tr -d '*' | cut -c1-110)"
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1

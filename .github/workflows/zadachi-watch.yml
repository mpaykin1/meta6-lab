name: ZADACHI watch
# Файл Claude, 10.11.2026. Сторож без ИИ: ведёт ZADACHI.md — таблицу всех задач ChatGPT по МГ и МГЛ.
# Статус берётся из GitHub (PR слит / закрыт / время последнего коммита), а не со слов агента.
# ChatGPT этот файл и scripts/zadachi/ не меняет.
on:
  push:
    branches: [main]
    paths: ['ZADACHI.md']
  pull_request_target:
    types: [opened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: zadachi-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test and traps
        run: node scripts/zadachi/verify.mjs && node scripts/zadachi/mutate.mjs
      - name: Refresh task table from GitHub facts without main writes
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin bot-state
          git show origin/bot-state:ZADACHI.md > ZADACHI.md
          node scripts/zadachi/watch.mjs | tee /tmp/z.log
          tail -1 /tmp/z.log >> "$GITHUB_STEP_SUMMARY"
          bash scripts/polza/write-bot-state.sh ZADACHI.md

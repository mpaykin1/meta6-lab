name: ZANYATO watch
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: zanyato-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/zanyato/watch.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "zanyato-watch"; git config user.email "actions@users.noreply.github.com"
            git commit -am "ZANYATO: отметка зависших пунктов (автоматически)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi

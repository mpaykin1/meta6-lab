name: ZANYATO watch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: zanyato-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load latest bot-state before refresh
        run: |
          git fetch -q origin bot-state
          git show origin/bot-state:rules/09-platforma/ZANYATO.md > rules/09-platforma/ZANYATO.md
      - run: node scripts/zanyato/watch.mjs
      - name: Publish table changes exclusively to bot-state
        run: bash scripts/polza/write-bot-state.sh rules/09-platforma/ZANYATO.md

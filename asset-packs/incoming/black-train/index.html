html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020304;touch-action:none}
iframe{border:0;position:fixed;inset:0;width:100%;height:100%;background:#020304}

<script type="importmap">{"imports":{"three":"../../../reference/ink-fallen-guardian/three.module.js"}}</script>

<body>
<iframe id="night" title="BLACK TRAIN · Ночной перегон" src="../../../reference/ink-night-scream/index.html" allow="autoplay; fullscreen"></iframe>
<script type="module">
import {makers} from './makers.js';
import {createCrossingAudio} from './sounds.js';
const frame=document.getElementById('night');
const placed=Object.create(null);
const info={
  crossingSign:[4.2,0,-12.5,1.0],redSignalLamp:[5.05,0,-12.3,1.0],
  hangingChains:[4.1,0,-12.2,.95],gnarledTree:[-7,0,-15,1.35],
  groundMist:[0,0,-10,1.0],stormClouds:[0,7,-40,2.1],
  brokenFence:[5.7,0,-20,1.0],tallGrass:[-2.5,0,-9,1.0],
  wetRailGlow:[0,0,-7.5,1.0],barbedWire:[-4,0,-22,1.0],
  swampPuddles:[-3.2,0,-9.8,1.0],crossingBell:[5.4,1.8,-12.4,.8],
  chainsClank:[-6.4,2.6,-15,.7]
};
let setup=false;
function mount(){
 if(setup)return;
 let api;
 try{api=frame.contentWindow.__INK_NIGHT_SCREAM__;}catch(e){return;}
 if(!api||!api.ready||!api.scene){requestAnimationFrame(mount);return;}
 setup=true;
 for(const [id,p] of Object.entries(info)){
  const obj=makers[id](37);obj.position.set(p[0],p[1],p[2]);obj.scale.setScalar(p[3]);obj.name='BLACK TRAIN / '+id;
  api.scene.add(obj);placed[id]=obj;
 }
 // Slightly varied trees and grass: not cloned silhouettes.
 for(let i=0;i<3;i++){
   const tree=makers.gnarledTree(56+i*71);
   tree.position.set(i%2?8.2:-10.3,0,-22-i*13);
   tree.scale.setScalar(.7+i*.19);api.scene.add(tree);
   placed['gnarledTree'+i]=tree;
 }
 for(let i=0;i<9;i++){
   const grass=makers.tallGrass(100+i*13);
   grass.position.set((i%2?-1:1)*(2.4+i*.35),0,-7.5-i*3.5);
   grass.scale.setScalar(.7+i*.04);api.scene.add(grass);
   placed['tallGrass'+i]=grass;
 }
 for(let i=0;i<3;i++){
   const mist=makers.groundMist(65+i);
   mist.position.set(i*13-14,.08,-7.4+(i%2)*2.1);
   mist.scale.setScalar(.8);api.scene.add(mist);placed['groundMist'+i]=mist;
 }
 const audio=createCrossingAudio(frame.contentWindow);
 const doc=frame.contentDocument;
 const panel=doc.getElementById('panel');
 if(panel){
  const logo=doc.createElement('div');
  logo.id='black-train-logo';logo.textContent='BLACK TRAIN';
  logo.style.cssText='font-family:Georgia,serif;letter-spacing:.17em;font-size:28px;font-weight:900;color:#d1c5b5;text-shadow:0 2px 0 #42100b,0 4px 12px #9b130e80;padding:4px 0 15px;text-align:center;border-bottom:1px solid #641e1e;margin-bottom:15px';
  panel.insertBefore(logo,panel.firstChild);
  const note=doc.createElement('small');
  note.textContent='Переезд: красный сигнал и звон предупреждают о поезде. Цепи звенят на ветру.';
  panel.append(note);
 }
 const entries=Object.keys(makers);
 window.__PACK__={format:'black-train/1',items:entries.map(id=>({id,kind:id==='crossingBell'||id==='chainsClank'?'sound':id==='titleLogo'?'ui':'3d'}))};
 window.__ISOLATE__=(id,on)=>{if(placed[id])placed[id].visible=!!on;};
 window.__PACK_PROBE__={assets:placed,setHidden:(id,hidden)=>{if(placed[id])placed[id].visible=!hidden;}};
 window.__BLACK_TRAIN_PACK__={ready:true,assets:placed,game:api,ids:entries,hide:(id,on)=>{if(placed[id])placed[id].visible=!on;}};
 let last=performance.now(),lastBell=0;
 function animate(ms){
  if(!doc.defaultView || doc.hidden){requestAnimationFrame(animate);return;}
  const dt=Math.min(.04,Math.max(0,(ms-last)/1000));last=ms;
  const t=ms/1000,stats=api.stats();
  const near=stats.train.active?Math.max(0,1-Math.abs(stats.train.x)/170):0;
  const signalT=t*(near>.05?2.5+near*2:0.45);
  for(const [id,obj] of Object.entries(placed)){
    if(!obj.visible)continue;
    const rel=obj.position.clone().sub(api.camera.position);
    const seen=rel.length()<52;
    if(!seen && id!=='redSignalLamp')continue;
    const local=id.startsWith('redSignalLamp')?signalT:t;
    if(typeof obj.userData.tick==='function')obj.userData.tick(local,dt);
  }
  if(placed.redSignalLamp)placed.redSignalLamp.visible=true;
  if(near>.08 && t-lastBell>2.2-Math.min(1,near)*1.4){
    audio.bell(near);lastBell=t;
  }
  if(Math.sin(t*.47)>.996)audio.chain(.15);
  requestAnimationFrame(animate);
 }
 requestAnimationFrame(animate);
}
frame.addEventListener('load',()=>requestAnimationFrame(mount));
requestAnimationFrame(mount);
</script>
</body>
</html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Last Healer · Живые INK-ассеты</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efece2;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#grain{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 20%,rgba(27,41,43,.14) 100%);mix-blend-mode:multiply;z-index:1}
#top{position:fixed;z-index:4;top:max(15px,env(safe-area-inset-top));right:max(15px,env(safe-area-inset-right));display:flex;gap:8px}
button{border:1px solid #b3b8a5;background:#faf6ebed;color:#324440;border-radius:8px;min-height:42px;padding:9px 13px;cursor:pointer;font:13px system-ui}
#menu{position:fixed;z-index:5;right:15px;top:71px;width:min(315px,calc(100vw - 30px));max-height:calc(100dvh - 100px);overflow:auto;background:#f9f5eaf4;backdrop-filter:blur(16px);border:1px solid #a1a99a;border-radius:14px;padding:17px;box-shadow:0 12px 45px #2d3d372e;color:#344941;font:13px system-ui}
#menu[hidden]{display:none}
#menu h2{font:italic 20px Georgia;margin:0 0 12px}
#menu p{line-height:1.5}
#menu button{display:block;width:100%;margin:5px 0;text-align:left}
#menu button[aria-pressed=true]{background:#bad0c5;border-color:#66867a}
#sceneNext{font:20px Georgia;min-width:42px}
#error{position:fixed;z-index:9;bottom:15px;left:15px;color:#973a31;background:#f9f5ef;padding:6px 10px;border-radius:7px;max-width:90vw}
@media(prefers-reduced-motion:reduce){#grain{opacity:.4}}
</style>
<script type="importmap">{"imports":{"three":"../../../reference/ink-fallen-guardian/three.module.js"}}</script>
</head><body>
<div id="grain"></div>
<div id="top"><button id="sceneNext" aria-label="Следующая сцена">›</button><button id="menuBtn" aria-expanded="false" aria-controls="menu">☰</button></div>
<section id="menu" hidden><h2>Остров последнего аптекаря</h2><p>Живые дополнения к принятому миру INK. Поворот камеры — мышью или пальцем.</p><div id="chapters"></div><h2>Ассеты</h2><div id="assets"></div></section>
<p id="error" hidden></p>
<script type="module">
import * as T from 'three';
import {makers} from './makers.js';
import {car,apothecary,streetlamp,pier} from '../../../reference/ink-fallen-guardian/ink-settlement.js';
import {fir, birch, shelter, lantern} from '../../../reference/ink-fallen-guardian/ink-objects.js';
import {createIllustrationCamera} from '../../../reference/ink-fallen-guardian/shared/living-watercolor-generators.js';
import {createLivingWatercolor3D,createWatercolorStyle} from '../../../reference/ink-fallen-guardian/shared/living-watercolor-3d.js';
import {createInkOptics} from '../../../reference/ink-fallen-guardian/ink-optics.js';

const $=s=>document.querySelector(s);
const scene=new T.Scene();
const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));
renderer.outputColorSpace=T.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const camera=createIllustrationCamera(T,{width:innerWidth,height:innerHeight,viewHeight:9.5,position:[9,12,15],lookAt:[0,.5,0]});
camera.far=130;
const painter=createLivingWatercolor3D({THREE:T,renderer,scene,camera,style:createWatercolorStyle({
 seed:'the-last-healer-video',inkColor:'#303c38',paperColor:'#efece2',
 washColor:'#839487',washOpacity:.78,washLayers:6,edgeWidth:.02,edgeJitter:.25,
 granulation:.37,bleed:.25,shadowWash:.19,motion:.10,pigmentPooling:.25,paperGap:.12,paintedLight:.67
})});
const optics=createInkOptics(renderer);
const ambient=new T.HemisphereLight('#fff0db','#718a87',2.1);scene.add(ambient);
const sun=new T.DirectionalLight('#fff0c9',1.9);sun.position.set(-7,12,5);scene.add(sun);
scene.fog=new T.Fog('#e0d8c9',18,65);
const names=Object.keys(makers),stages=[],assets={};
const stageLabels=['Розовые сумерки · машина','Дождливая ночь · фонарь','Утро · лодка у причала'];
function add(stage,object,id,x=0,z=0,rot=0){
 object.position.set(x,0,z);object.rotation.y=rot;stage.add(object);
 if(id)assets[id]=object;
 painter.apply(object,{seed:'last-healer:'+ (id||object.name||stageLabels[stages.length])});
 return object;
}
function ground(stage,color,seed=1,water=false){
 const shape=new T.Shape(),n=52;
 for(let k=0;k<=n;k++){
  const a=k/n*Math.PI*2,r=water?7.4:6.5+Math.sin(k*.43+seed)*.26+Math.sin(k*1.8+seed*.4)*.12;
  const x=Math.cos(a)*r,z=Math.sin(a)*r*.7;
  k?shape.lineTo(x,z):shape.moveTo(x,z);
 }
 const soil=new T.Mesh(new T.ShapeGeometry(shape),new T.MeshStandardMaterial({color,roughness:water?.26:1,metalness:water?.2:0,side:T.DoubleSide}));
 soil.rotation.x=-Math.PI/2;soil.position.y=water?-.035:-.09;stage.add(soil);
}
const city=new T.Group();stages.push(city);scene.add(city);ground(city,'#a59680',1);
const road=new T.Mesh(new T.BoxGeometry(3.3,.06,10.2),new T.MeshStandardMaterial({color:'#777b75',roughness:.92}));
road.position.y=-.055;city.add(road);
add(city,car(),null,0,0,-Math.PI/2);
add(city,makers.carHeadlights(2),'carHeadlights',0,0,-Math.PI/2);
add(city,apothecary(),null,-3,1.7,.3);add(city,streetlamp(),null,2,2.5);
add(city,birch(3),null,3.3,-2.3);add(city,fir(6),null,-3.3,-2.2);
for(let k=-3;k<=3;k++)if(k!==0){
 const line=new T.Mesh(new T.BoxGeometry(.07,.006,.43),new T.MeshBasicMaterial({color:'#d0c1a3'}));
 line.position.set(.03,.0,k*1.15);city.add(line);
}
const rain=new T.Group();stages.push(rain);scene.add(rain);ground(rain,'#536e68',2);
add(rain,shelter(),null,2.8,1.7);
add(rain,lantern(),null,-1.9,1.15);
add(rain,makers.handFlashlight(5),'handFlashlight',-.55,-.1);
add(rain,makers.rainSplashRings(4),'rainSplashRings',0,.1);
add(rain,fir(2),null,-3,2.5);add(rain,birch(3),null,2.9,-2.2);
const puddleMaterial=new T.MeshStandardMaterial({color:'#435f63',roughness:.24,metalness:.31});
for(let i=0;i<6;i++){
 const puddle=new T.Mesh(new T.CircleGeometry(.2+i*.10,17),puddleMaterial);
 puddle.rotation.x=-Math.PI/2;puddle.scale.set(1.2+(i%3)*.6,1,.7);puddle.position.set(-2.2+i*.9,-.045,-1.25+(i%2)*.5);
 rain.add(puddle);
}
const coast=new T.Group();stages.push(coast);scene.add(coast);ground(coast,'#80a8a2',3,true);
const island=new T.Mesh(new T.CircleGeometry(3.5,35),new T.MeshStandardMaterial({color:'#beb397',roughness:1}));
island.rotation.x=-Math.PI/2;island.scale.set(1,.7,1);island.position.set(3.3,-.018,2.1);coast.add(island);
add(coast,makers.rowingHealer(3),'rowingHealer',-1.0,-.8,.2);
add(coast,pier(),null,2.6,.2,-.2);
add(coast,fir(3),null,3.2,2.2);add(coast,birch(7),null,4.0,2.2);
let stageIndex=0,orbitYaw=-.68,orbitPitch=.67,zoom=1,t=0,last=0,frozen=false,isolated=false;
function switchStage(i){
 stageIndex=(i+stages.length)%stages.length;
 stages.forEach((s,j)=>s.visible=j===stageIndex);
 const schemes=[['#f2d9d3','#c9a39e','#f6d7b3',1.9],['#81949b','#879ca8','#b4c8d8',.95],['#d6e9dd','#c0dbdb','#fff0ca',2.3]];
 const [background,fog,color,intensity]=schemes[stageIndex];
 scene.background=new T.Color(background);scene.fog.color.set(fog);sun.color.set(color);sun.intensity=intensity;
 ambient.intensity=stageIndex===1?1.2:2.1;
 $('#chapters').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===stageIndex?'true':'false'));
 $('#assets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',assets[b.dataset.id]?.parent===stages[stageIndex]?'true':'false'));
}
stageLabels.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>switchStage(i);$('#chapters').append(b);});
for(const n of names){
 const b=document.createElement('button');b.dataset.id=n;b.textContent=({
 carHeadlights:'Фары автомобиля',handFlashlight:'Ручной фонарь',rowingHealer:'Аптекарь и вёсла',rainSplashRings:'Живые кольца дождя'})[n]||n;
 b.onclick=()=>{const idx=stages.findIndex(s=>assets[n]?.parent===s);if(idx>=0)switchStage(idx);};
 $('#assets').append(b);
}
$('#sceneNext').onclick=()=>switchStage(stageIndex+1);
$('#menuBtn').onclick=()=>{const hidden=$('#menu').hidden=!$('#menu').hidden;$('#menuBtn').setAttribute('aria-expanded',String(!hidden));};
function resize(){
 const aspect=innerWidth/Math.max(1,innerHeight);
 camera.userData.viewHeight=Math.max(8.5,8.5/aspect)/zoom;
 camera.updateForViewport(innerWidth,innerHeight);camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
const pointers=new Map();let drag=null,pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};
 if(pointers.size===2){const q=[...pointers.values()];pinch=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);}
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);
  if(pinch)zoom=T.MathUtils.clamp(zoom*d/pinch,.60,2.8);pinch=d;resize();
 }else if(drag){orbitYaw-=(e.clientX-drag.x)*.007;orbitPitch=T.MathUtils.clamp(orbitPitch+(e.clientY-drag.y)*.006,.25,1.30);}
 drag={x:e.clientX,y:e.clientY};
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(event,e=>{pointers.delete(e.pointerId);drag=null;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=T.MathUtils.clamp(zoom*Math.exp(-e.deltaY*.001),.6,2.8);resize();},{passive:false});
addEventListener('resize',resize);
window.__PACK__={items:names,format:'ink-pack/1'};
window.__PACK_PROBE__={
 assets,
 setHidden(id,hidden){if(assets[id])assets[id].visible=!hidden;draw();},
 freeze(value){frozen=!!value;draw();}
};
window.__ISOLATE__=(id,on)=>{isolated=!!on;for(const [name,o] of Object.entries(assets))o.visible=!on||name===id;draw();};
function draw(){
 camera.position.set(Math.sin(orbitYaw)*Math.cos(orbitPitch)*15,1.1+Math.sin(orbitPitch)*15,Math.cos(orbitYaw)*Math.cos(orbitPitch)*15);
 camera.lookAt(0,.6,0);optics.render(scene,camera,false);
}
function frame(ms){
 requestAnimationFrame(frame);
 if(document.hidden){last=ms;return;}
 const dt=Math.min(.04,Math.max(0,(ms-last)*.001));last=ms;
 if(!frozen){t+=dt;
 for(const [id,o] of Object.entries(assets))if(o.parent?.visible&&o.visible&&o.userData.tick)o.userData.tick(t,dt);
 if(!drag)orbitYaw+=dt*.035;
 painter.tick(ms);
 }
 draw();
}
switchStage(0);resize();requestAnimationFrame(frame);
</script>
</body></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d7c5ac">
<title>THE LAST HEALER · INK VIDEO SCENES</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e4d4c2;touch-action:none}
canvas{display:block;width:100%;height:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(ellipse at 50% 46%,transparent 35%,rgba(37,43,46,.16) 100%),
linear-gradient(0deg,rgba(47,51,57,.08),transparent 24%,transparent 70%,rgba(255,224,179,.10));z-index:1}
#menuButton{position:fixed;z-index:4;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));
border:1px solid rgba(45,54,56,.28);background:rgba(233,222,200,.91);color:#354348;
width:45px;height:45px;border-radius:16px;font:26px system-ui;cursor:pointer;box-shadow:0 5px 24px #3c3c4022}
#menu{position:fixed;z-index:5;top:72px;left:max(14px,env(safe-area-inset-left));
width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;
padding:18px;border:1px solid #b9ab92;border-radius:20px;
background:rgba(241,235,218,.94);color:#344348;font:13px/1.55 system-ui;
box-shadow:0 16px 45px #2f353a22;backdrop-filter:blur(18px)}
#menu[hidden]{display:none}
#menu h1{font:600 21px Georgia,serif;letter-spacing:.09em;margin:0 0 4px}
#menu p{font-size:12px;color:#6b756d;margin:0 0 12px}
#menu button{display:block;width:100%;margin:6px 0;padding:11px 12px;border-radius:11px;
text-align:left;border:1px solid #c0baa5;background:#faf6ea;color:#374747;font:500 13px system-ui;cursor:pointer}
#menu button.active{background:#74897d;color:#fff;border-color:#74897d}
#menu small{display:block;margin-top:12px;color:#7a786c}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;
background-image:repeating-linear-gradient(33deg,transparent 0,transparent 13px,#1d2c32 14px,#1d2c32 14.5px)}
</style>
<script type="importmap">{"imports":{"three":"../../../reference/ink-fallen-guardian/three.module.js"}}</script>
</head>
<body>
<button id="menuButton" aria-label="Открыть меню" aria-expanded="false">☰</button>
<aside id="menu" hidden>
<h1>THE LAST HEALER</h1>
<p>INK · живые сцены из видеореференса</p>
<button data-id="all" class="active">Весь остров · сумерки / дождь / лодка</button>
<button data-id="carHeadlights">Машина · мягкие фары</button>
<button data-id="handFlashlight">Ночь · фонарь аптекаря</button>
<button data-id="rowingHealer">Побережье · гребля</button>
<button data-id="rainSplashRings">Дождь · капли и кольца</button>
<button data-id="townRoad">Город · улица с перекрёстком</button>
<button data-id="roadsideDryShrubs">Дорога · живые сухие кусты</button>
<button data-id="pinkTownBuilding">Город · розовые витрины</button>
<button data-id="puddles">Ночь · зеркальные лужи</button>
<button data-id="whiteClinicBuilding">Ночь · здание клиники</button>
<button data-id="boatShed">Берег · лодочный сарай</button>
<button data-id="duskTownLight">Город · акварельные сумерки</button>
<button data-id="healerWalkWithLight">Ночь · аптекарь с фонарём</button>
<button data-id="nightRainGrade">Ночь · холодная дождливая дымка</button>
<button data-id="wetGrassClumps">Ночь · мокрая трава</button>
<button data-id="boatWake">Берег · пенный след от лодки</button>
<button data-id="shoreFoamLine">Берег · линия живой пены</button>
<button data-id="autumnConeTrees">Берег · осенние кроны</button>
<button data-id="driftingLeaves">Берег · листья на воде</button>
<button data-id="sandBeachTiles">Берег · рваная кромка песка</button>
<button data-id="tiltShiftPost">Камера · эффект миниатюры</button>
<button data-id="dayCoastGrade">День · бирюзовый свет берега</button>
<button data-id="sndCarEngine">🔊 Звук машины · включить</button>
<button data-id="sndRainNight">🔊 Звук дождя · включить</button>
<button data-id="sndRowingShore">🔊 Звук гребли · включить</button>
<small>Мышь / палец — поворот камеры. Колесо — приближение. Все модели процедурные, принятые INK-модели не изменены.</small>
</aside><div id="grain"></div>
<script type="module">
import * as T from 'three';
import {makers} from './makers.js';
import {createHealerAudio} from './sounds.js';
import {createHealerOptics} from './postfx.js';
import {car,apothecary,streetlamp,bush,pier} from '../../../reference/ink-fallen-guardian/ink-settlement.js';
import {rowboat} from '../../../reference/ink-fallen-guardian/ink-extras.js';
import {traveller,fir} from '../../../reference/ink-fallen-guardian/ink-objects.js';

const scene=new T.Scene();
scene.background=new T.Color('#d9cab9');
scene.fog=new T.FogExp2('#bdc1b5',.027);
const camera=new T.OrthographicCamera(-10,10,7,-7,.1,140);
let camAz=.71,camAlt=.61,camDistance=20,camTarget=new T.Vector3(0,0,0),zoom=1;
const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.36;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const hemi=new T.HemisphereLight('#fff1d8','#607872',2.65);scene.add(hemi);
const sun=new T.DirectionalLight('#f8ceb8',2.15);
sun.position.set(-9,17,-5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;
sun.shadow.bias=-.0004;scene.add(sun);
function pigment(hex){return new T.MeshStandardMaterial({color:hex,roughness:.99});}
function sheet(w,d,x,y,z,material,rx=-Math.PI/2){
 const p=new T.Mesh(new T.PlaneGeometry(w,d),material);p.rotation.x=rx;p.position.set(x,y,z);
 p.receiveShadow=true;scene.add(p);return p;
}
sheet(40,35,0,-.11,0,pigment('#9ca58b'));
sheet(7.5,14,-4.8,-.071,.3,pigment('#62676a')); // asphalt
sheet(8,18,7,-.066,0,new T.MeshStandardMaterial({color:'#77b4ac',roughness:.42,metalness:.12}));
sheet(2.5,17,2.3,-.045,0,pigment('#d8bd8c'));
// Brush-edged asphalt edge: irregular stones and plants, not repeating tile paint.
for(let i=0;i<48;i++){
 const a=i*2.39996,r=1.4+(i%9)*.27;
 const x=i%2?-1.65-r*.1:-8.08+r*.1,z=-6+(i*3.197)%13;
 const v=new T.Mesh(new T.DodecahedronGeometry(.06+(i%4)*.028,0),
   pigment(i%3?'#a9a48a':'#7e8577'));
 v.position.set(x,-.03,z);v.scale.y=.55;scene.add(v);
}
const cm=car();cm.position.set(-5.2,.04,-1.2);scene.add(cm);
const npc=traveller();npc.position.set(-.8,0,1.0);scene.add(npc);
const boat=rowboat();boat.position.set(6.65,.0,1.2);scene.add(boat);
const wharf=pier();wharf.position.set(5.0,-.02,-2.4);scene.add(wharf);
for(let i=0;i<9;i++){
 const a=i*1.933,pos=i%2?-8.8:2.3;
 const plant=i%3===0?fir(i+3):bush(i+4);
 plant.position.set(pos+Math.sin(a)*.58,0,-5.5+i*1.4);
 plant.scale.setScalar(i%3===0?.68:.78);scene.add(plant);
}
const house=apothecary();house.position.set(-8.0,0,-5.6);house.scale.setScalar(.85);scene.add(house);
for(let i=0;i<3;i++){
 const lamp=streetlamp();lamp.position.set(-7.9+i*3.2,0,-4.3);lamp.scale.setScalar(.8);scene.add(lamp);
}
const root=makers.carHeadlights(11);cm.add(root);
const beam=makers.handFlashlight(3);beam.position.set(.37,0,.11);npc.add(beam);
const stroke=makers.rowingHealer(7);boat.add(stroke);
const splashes=makers.rainSplashRings(13);splashes.position.set(-.75,0,1.3);scene.add(splashes);
const street=makers.townRoad(51);street.position.set(-4.8,.02,.3);scene.add(street);
const shrubs=makers.roadsideDryShrubs(63);shrubs.position.set(-2.5,0,1.9);scene.add(shrubs);
const shop=makers.pinkTownBuilding(72);shop.position.set(-5,0,-5.2);scene.add(shop);
const pools=makers.puddles(88);pools.position.set(-4.5,.035,2.3);scene.add(pools);
const clinic=makers.whiteClinicBuilding(93);clinic.position.set(-.3,0,-3.1);scene.add(clinic);
const shed=makers.boatShed(101);shed.position.set(7.55,0,-3.9);scene.add(shed);
const assets={carHeadlights:root,handFlashlight:beam,rowingHealer:stroke,rainSplashRings:splashes,
 townRoad:street,roadsideDryShrubs:shrubs,pinkTownBuilding:shop,puddles:pools,whiteClinicBuilding:clinic,boatShed:shed};
const supplements=[
 ['duskTownLight',[-5.1,0,-4.1]],['healerWalkWithLight',[-.1,0,2.4]],
 ['nightRainGrade',[-.45,0,-2.1]],['wetGrassClumps',[-1.4,0,-2.7]],
 ['boatWake',[6.65,0,1.2]],['shoreFoamLine',[4.0,.015,4.15]],
 ['sandBeachTiles',[7.8,.015,-4.9]],['autumnConeTrees',[7.8,.07,-5.0]],
 ['driftingLeaves',[7.6,.03,-2.0]],['tiltShiftPost',[0,0,0]],
 ['dayCoastGrade',[7.8,0,-4.4]],['sndCarEngine',[-5.2,0,-.6]],
 ['sndRainNight',[-1.1,0,-2.95]],['sndRowingShore',[6.65,0,1.5]]
];
for(const [id,pos] of supplements){
 const o=makers[id](id.length*21+3);o.position.set(...pos);scene.add(o);assets[id]=o;
}
const contexts={carHeadlights:cm,handFlashlight:npc,rowingHealer:boat,rainSplashRings:splashes,
 townRoad:street,roadsideDryShrubs:shrubs,pinkTownBuilding:shop,puddles:pools,whiteClinicBuilding:clinic,boatShed:shed};
for(const [id] of supplements)contexts[id]=assets[id];
const places={
 all:[0,0,0,20],carHeadlights:[-5.2,.1,.35,9],handFlashlight:[-.8,.4,1.2,8],
 rowingHealer:[6.3,0,1.2,9],rainSplashRings:[-.75,.2,1.3,9],
 townRoad:[-4.8,.1,.3,10],roadsideDryShrubs:[-2.5,.1,1.9,7.5],
 pinkTownBuilding:[-5,1.1,-5.2,10],puddles:[-4.5,.1,2.3,8.5],
 whiteClinicBuilding:[-.3,1.2,-3.1,11],boatShed:[7.55,1.15,-3.9,10]
};
for(const [id,[x,y,z]] of supplements)places[id]=[x,y+.75,z,9];
const optics=createHealerOptics(renderer,scene,camera),audio=createHealerAudio();
const soundIds=new Set(['sndCarEngine','sndRainNight','sndRowingShore']);
let chosen='all',clock=0,manual=false,frame=0;
function select(id){
 chosen=id;
 if(!soundIds.has(id))audio.stop();
 const night=['nightRainGrade','healerWalkWithLight','wetGrassClumps','puddles','whiteClinicBuilding','sndRainNight','handFlashlight','rainSplashRings'].includes(id);
 const day=['boatWake','shoreFoamLine','autumnConeTrees','driftingLeaves','sandBeachTiles','dayCoastGrade','rowingHealer','boatShed','sndRowingShore'].includes(id);
 optics.setMood(day?2:night?1:0);
 scene.background.set(day?'#ced9c9':night?'#798994':'#d9cab9');
 scene.fog.color.set(day?'#c7dbce':night?'#7e9096':'#bdc1b5');
 sun.intensity=night?.56:day?2.4:2.15;
 for(const [key,obj] of Object.entries(assets))obj.visible=id==='all'||id===key;
 for(const [key,obj] of Object.entries(contexts)){
  if(key!=='rainSplashRings')obj.visible=id==='all'||id===key;
 }
 document.querySelectorAll('#menu button[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 const [x,y,z,d]=places[id]||places.all;
 camTarget.set(x,y,z);camDistance=d;draw();
}
const menu=document.getElementById('menu'),menuButton=document.getElementById('menuButton');
menuButton.addEventListener('click',()=>{
 menu.hidden=!menu.hidden;menuButton.setAttribute('aria-expanded',String(!menu.hidden));
});
document.querySelectorAll('#menu button[data-id]').forEach(b=>b.addEventListener('click',()=>{
 select(b.dataset.id);
 if(soundIds.has(b.dataset.id))audio.play(b.dataset.id);
 menu.hidden=true;menuButton.setAttribute('aria-expanded','false');
}));
let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 camAz+=(e.clientX-lastX)*.0047;camAlt=T.MathUtils.clamp(camAlt+(e.clientY-lastY)*.003,.26,1.21);
 lastX=e.clientX;lastY=e.clientY;if(manual)draw();
});
renderer.domElement.addEventListener('pointerup',()=>{dragging=false;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=T.MathUtils.clamp(zoom+e.deltaY*.0015,.55,2.1);if(manual)draw();},{passive:false});
function resize(){
 const w=window.innerWidth,h=window.innerHeight,asp=w/h;
 renderer.setSize(w,h,false);optics.resize(w,h);
 const y=camDistance*.58*zoom,x=y*asp;
 camera.left=-x;camera.right=x;camera.top=y;camera.bottom=-y;
 camera.updateProjectionMatrix();
}
function draw(){
 resize();
 const r=camDistance*.92*zoom;
 camera.position.set(camTarget.x+r*Math.sin(camAz)*Math.cos(camAlt),
 camTarget.y+r*Math.sin(camAlt),camTarget.z+r*Math.cos(camAz)*Math.cos(camAlt));
 camera.lookAt(camTarget);optics.render(clock);
}
function animate(ts){
 if(manual)return;
 const t=ts*.001;clock=t;
 for(const a of Object.values(assets))if(a.userData.tick)a.userData.tick(t,.016);
 boat.position.y=.035*Math.sin(t*1.26);
 boat.rotation.z=.021*Math.sin(t*.97);
 npc.rotation.y=-.03+.035*Math.sin(t*.6);
 const a=t*.26;sun.intensity=1.8+.26*Math.sin(a);
 draw();frame=requestAnimationFrame(animate);
}
// A frozen frame can be rendered with one asset hidden, then shown, at the same
// camera, lighting, simulation timestamp for truthful pixel-isolation comparison.
const probe={
 assets,manual:false,setHidden(id,hidden){if(assets[id])assets[id].visible=!hidden;},
 draw(){draw();},freeze(){manual=true;probe.manual=true;cancelAnimationFrame(frame);draw();},
 resume(){if(manual){manual=false;probe.manual=false;frame=requestAnimationFrame(animate);}},
 select
};
window.__PACK_PROBE__=probe;
window.__ISOLATE__=(id,on)=>{probe.freeze();probe.setHidden(id,!on);probe.draw();};
window.addEventListener('resize',draw);
select('all');frame=requestAnimationFrame(animate);
</script>
</body>
</html>

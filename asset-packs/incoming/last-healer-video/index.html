<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7d0c3"><title>The Last Healer · INK · видеосцены</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#b5c6bc;color:#d6e0d6}
#stage{position:fixed;inset:0;cursor:grab}#stage:active{cursor:grabbing}
canvas{display:block}
#menu{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));height:46px;width:46px;border:1px solid #dce3d955;background:#253730c9;color:#e7e6d5;border-radius:13px;font:22px Georgia}
#panel{position:fixed;z-index:5;top:max(70px,env(safe-area-inset-top) + 50px);right:14px;width:min(316px,calc(100vw - 28px));padding:20px 18px 16px;border:1px solid #b8c1b677;border-radius:14px;background:#243730f2;box-shadow:0 16px 50px #10291b80;max-height:80vh;overflow:auto;backdrop-filter:blur(12px);touch-action:pan-y}
#panel[hidden]{display:none}h1{margin:0 0 6px;font:italic 27px Georgia;color:#f0e4ca}
#panel p{font:12px/1.6 Georgia;color:#b9c4b8}
#panel button{display:block;width:100%;padding:12px 13px;margin:8px 0;text-align:left;background:#e4ede410;border:1px solid #c3d5c644;color:#f3e8d5;border-radius:8px;font:14px Georgia;cursor:pointer}
#panel button:focus-visible,#menu:focus-visible{outline:2px solid #edcf9d}
#panel small{display:block;color:#b2beb1;font:11px/1.5 Georgia;margin-top:12px}
#error{display:none;position:fixed;z-index:10;left:12px;bottom:12px;right:12px;background:#502d30d9;color:white;font:12px monospace;padding:12px;border-radius:8px}

<script type="importmap">{"imports":{"three":"../../../reference/ink-fallen-guardian/three.module.js"}}</script>
</head><body>
<div id="stage"></div><button id="menu" aria-label="Меню" aria-expanded="false">☰</button>
<aside id="panel" hidden><h1>THE LAST HEALER</h1><p>INK · Живые дополнения к острову аптекаря. Фары, ручной свет, гребля, дождь.</p>
<button data-focus="all">Все три времени суток</button>
<button data-focus="carHeadlights">Сумерки · автомобиль и фары</button>
<button data-focus="handFlashlight">Ночь · аптекарь с фонарём</button>
<button data-focus="rainSplashRings">Дождь · кольца на мокрой земле</button>
<button data-focus="rowingHealer">Утро · гребец у причала</button>
<button id="light">Выключить ручной фонарь</button>
<button id="orbit">Автообзор: включён</button>
<small>Поворот камеры — мышью или пальцем. Сцена использует одобренные модели машины, путника, причала и рендер INK из эталона без изменения исходников. Корпус лодки взят из принятого эталона INK без изменений.</small>
</aside><div id="error"></div>
<script type="module">
import * as T from 'three';
import {makers} from './makers.js';
import {car,pier,streetlamp,bush} from '../../../reference/ink-fallen-guardian/ink-settlement.js';
import {traveller,fir,rock} from '../../../reference/ink-fallen-guardian/ink-objects.js';
import {rowboat} from '../../../reference/ink-fallen-guardian/ink-extras.js';
import {createLivingWatercolor3D,createWatercolorStyle} from '../../../reference/ink-fallen-guardian/shared/living-watercolor-3d.js';
const stage=document.querySelector('#stage'),panel=document.querySelector('#panel'),menu=document.querySelector('#menu');
try{
const scene=new T.Scene();scene.background=new T.Color('#9aaeb0');scene.fog=new T.FogExp2('#9caeb0',.019);
const camera=new T.PerspectiveCamera(37,innerWidth/Math.max(innerHeight,1),.1,140);
const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.domElement.style.pointerEvents='none';stage.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight('#eef0df','#526e6b',2.4));
const sun=new T.DirectionalLight('#f3d9be',2.85);sun.position.set(-8,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const night=new T.PointLight('#e7d19c',1.9,7);night.position.set(-.9,3,-.3);scene.add(night);
const seaLight=new T.DirectionalLight('#c1e0d9',1.0);seaLight.position.set(8,5,-8);scene.add(seaLight);
const ink=createLivingWatercolor3D({THREE:T,renderer,scene,camera,style:createWatercolorStyle({seed:'last-healer-video-first-batch',paperColor:'#e8e6dc',inkColor:'#324a44',washColor:'#829e96',washOpacity:.60,washLayers:6,edgeWidth:.022,edgeJitter:.18,granulation:.26,bleed:.18,shadowWash:.12,motion:.09,pigmentPooling:.23,paperGap:.10,paintedLight:.66})});
const compositor=ink.attachCompositor({replaceSource:true});compositor.canvas.style.pointerEvents='none';
const entries={},focusPoints={all:[0,0,0],carHeadlights:[-6,0,0],handFlashlight:[0,0,0],rainSplashRings:[0,0,0],rowingHealer:[6,0,0]};
function add(o,x,y,z,name){o.position.set(x,y,z);scene.add(o);if(name)entries[name]=o;ink.apply(o,{seed:name||String(x)+':'+String(z)});return o;}
function plane(w,d,color,x,z,y=0){const o=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshStandardMaterial({color,roughness:1,side:T.DoubleSide}));o.rotation.x=-Math.PI/2;o.position.set(x,y,z);o.receiveShadow=true;scene.add(o);return o;}
plane(26,13,'#718c82',0,0,-.15);
plane(7.5,8,'#5b655e',-6,0,-.115);
plane(7.3,8,'#546b5f',0,0,-.106);
plane(7.7,8,'#578c8f',6.2,0,-.102);
plane(7.1,3.2,'#6b7370',-6,0,-.082);
plane(6.8,3.0,'#596f68',0,-.6,-.08);
plane(6.9,5.2,'#83b1b0',6.2,.20,-.07);
// Accepted model, rotated only for the preview. It remains a standalone source file.
const cityCar=add(car(),-6,0,1.1);cityCar.rotation.y=Math.PI;
const carLight=add(makers.carHeadlights(104),-6,0,1.1,'carHeadlights');
carLight.rotation.y=Math.PI;carLight.scale.z=1.78;
const lamp=add(streetlamp(),-8.4,0,-1.3);
for(let i=0;i<5;i++){const b=add(bush(i+5),-8.9+i*1.25,0,-2.5+(i%2)*.3);b.scale.setScalar(.6+i*.04);}
for(let i=0;i<6;i++){const r=add(rock(i+4),-4.8+(i%3)*.7,0,-2.8+Math.floor(i/3)*.43);r.scale.setScalar(.35);}
const healer=add(traveller(),0,0,.5);healer.rotation.y=Math.PI*.75;
const handLight=add(makers.handFlashlight(9),0,0,.5,'handFlashlight');handLight.rotation.y=-.75;
const rain=add(makers.rainSplashRings(19),0,0,0,'rainSplashRings');
for(let i=0;i<4;i++){const t=add(fir(i+3),2.5+i*.7,0,-2.1+i*.37);t.scale.setScalar(.48+i*.13);}
const wharf=add(pier(),7.7,0,1.0);wharf.rotation.y=-Math.PI/2;
// Показываем принятую лодку INK без замены её геометрии.
const hull=add(rowboat(),6.6,0,-1.1);
const rowing=add(makers.rowingHealer(27),6.6,.21,-1.1,'rowingHealer');rowing.rotation.y=Math.PI/2;
for(let i=0;i<7;i++){const b=add(bush(i+17),4.5+i*.45,0,-3.4+(i%2)*.17);b.scale.setScalar(.45+i*.03);}
window.__PACK__={items:[{id:'carHeadlights'},{id:'handFlashlight'},{id:'rowingHealer'},{id:'rainSplashRings'}]};
window.__PACK_PROBE__={assets:entries,setHidden(id,hidden){if(entries[id])entries[id].visible=!hidden;}};
window.__ISOLATE__=(id,on)=>{if(entries[id])entries[id].visible=!!on;};
let target=new T.Vector3(0,0,0),angle=.43,polar=.87,distance=23,desiredDistance=23,autoOrbit=true,drag=false,px=0,py=0,last=performance.now(),manual=false,manualTime=0;
function placeCamera(){const s=Math.sin(polar);camera.position.set(target.x+distance*s*Math.sin(angle),target.y+distance*Math.cos(polar)+2,target.z+distance*s*Math.cos(angle));camera.lookAt(target.x,target.y+.4,target.z);}
function focus(id){const p=focusPoints[id]||focusPoints.all;target.set(...p);desiredDistance=id==='all'?23:9.4;panel.hidden=true;menu.setAttribute('aria-expanded','false');}
document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>focus(b.dataset.focus)));
menu.addEventListener('click',()=>{panel.hidden=!panel.hidden;menu.setAttribute('aria-expanded',String(!panel.hidden));});
let flashlight=true;document.querySelector('#light').addEventListener('click',e=>{flashlight=!flashlight;handLight.userData.setEnabled(flashlight);e.currentTarget.textContent=flashlight?'Выключить ручной фонарь':'Включить ручной фонарь';});
document.querySelector('#orbit').addEventListener('click',e=>{autoOrbit=!autoOrbit;e.currentTarget.textContent='Автообзор: '+(autoOrbit?'включён':'выключен');});
stage.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;autoOrbit=false;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;angle+=(px-e.clientX)*.006;polar=Math.max(.35,Math.min(1.35,polar+(py-e.clientY)*.006));px=e.clientX;py=e.clientY;});
stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);
stage.addEventListener('wheel',e=>{e.preventDefault();desiredDistance=Math.max(5,Math.min(32,desiredDistance+e.deltaY*.016));},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/Math.max(innerHeight,1);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);compositor.resize();});
function renderFrame(now){requestAnimationFrame(renderFrame);const dt=Math.min(.05,(now-last)/1000);last=now;const t=manual?manualTime:now/1000;
if(autoOrbit&&!drag)angle+=dt*.028;
distance+=(desiredDistance-distance)*Math.min(1,dt*3.7);
for(const [id,o] of Object.entries(entries))if(typeof o.userData.tick==='function')o.userData.tick(t,dt);
hull.position.y=.055*Math.sin(t*1.07);
rowing.position.y=.21+.06*Math.sin(t*1.07);
cityCar.position.z=1.1+Math.sin(t*.37)*.08;carLight.position.z=cityCar.position.z;
sun.intensity=2.45+.2*Math.sin(t*.17);
night.intensity=1.65+.16*Math.sin(t*.81);
placeCamera();ink.tick(now);renderer.render(scene,camera);ink.present(now);}
window.__SCENE_CLOCK__={freeze(on=true,time=1){manual=!!on;manualTime=time;},render(){const t=performance.now();for(const o of Object.values(entries))if(o.userData.tick)o.userData.tick(manualTime,0);placeCamera();ink.tick(t);renderer.render(scene,camera);ink.present(t);}};
requestAnimationFrame(renderFrame);
}catch(e){console.error(e);const o=document.querySelector('#error');o.textContent='Не удалось открыть INK-сцену: '+String(e?.message||e);o.style.display='block';}
</script></body></html>

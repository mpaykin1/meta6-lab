 const engrave=(parent,seed,w,h,col)=>{
  const tx=mk(1024,1024,(ctx,W,H)=>{
   const R=rng(seed);
   ctx.lineJoin='round';ctx.lineCap='round';
   for(let i=0;i<980;i++){
    let x=R()*W,y=R()*H;
    const n=3+Math.floor(R()*6),len=18+R()*104,a=R()*6.283;
    ctx.beginPath();ctx.moveTo(x,y);
    for(let j=0;j<n;j++){
     const d=a+.54*Math.sin(j*1.8+i*.13)+(R()-.5);
     x+=Math.cos(d)*len/n;y+=Math.sin(d)*len/n;ctx.lineTo(x,y);
    }
    ctx.strokeStyle=i%5===0?'rgba(255,215,233,.92)':i%3===0?
      'rgba(115,225,250,.8)':'rgba(205,129,189,.55)';
    ctx.lineWidth=3+R()*7;ctx.stroke();
   }
   for(let i=0;i<170;i++){
    const x=R()*W,y=R()*H,r=12+R()*55,a=(R()-.5)*2.7;
    ctx.save();ctx.translate(x,y);ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(-r*.5,-r*.3);ctx.lineTo(-r*.24,-r*.72);
    ctx.lineTo(r*.54,-r*.32);ctx.lineTo(r*.88,r*.33);
    ctx.lineTo(-r*.48,r*.58);ctx.closePath();
    ctx.fillStyle=i%4===0?'rgba(255,177,216,.5)':i%4===1?
      'rgba(100,219,245,.46)':'rgba(19,46,78,.62)';
    ctx.fill();ctx.strokeStyle='rgba(220,244,251,.52)';
    ctx.lineWidth=3+R()*5;ctx.stroke();ctx.restore();
   }
  });
  const mat=new T.MeshBasicMaterial({map:tx,transparent:true,opacity:.89,depthTest:false,
    depthWrite:false,side:T.DoubleSide,blending:T.AdditiveBlending});
  const plane=mesh(parent,new T.PlaneGeometry(w,h),0xffffff,[0,0,-1.05]);
  plane.material=mat;return plane;
 };

`;

 const api={assets:own,setHidden(id,flag){if(flag)hidden.add(id);else hidden.delete(id);}};
 window.__PACK_PROBE__=api;
 function tick(t,dt){
   proj.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);frustum.setFromProjectionMatrix(proj);
   for(const id of ids){
     const a=own[id],chosen=focus?.id===id,eligible=(!focus||chosen)&&!hidden.has(id);
     a.group.visible=eligible;
     if(!eligible)continue;
     if(!chosen){sight.center.copy(a.group.position);if(!frustum.intersectsSphere(sight))continue;}
     a.tick(t,dt);
   }
 }
 return {tick,ids};
})();

/* ============ РЕНДЕР ============ */
const clock=new T.Clock();let acc=0,fr=0;
function frame(){requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05);U.t.value+=dt;const t=U.t.value;
 update(t,dt);SHPILI_PLUS.tick(t,dt);
 renderer.setRenderTarget(rtA);renderer.render(scene,camera);
 quad.material=waterMat;renderer.setRenderTarget(rtB);renderer.render(qScene,qCam);
 quad.material=blurMat;blurMat.uniforms.tS.value=rtB.texture;blurMat.uniforms.uThr.value=.42;blurMat.uniforms.uDir.value.set(1.6/rtC.width,0);renderer.setRenderTarget(rtC);renderer.render(qScene,qCam);
 blurMat.uniforms.tS.value=rtC.texture;blurMat.uniforms.uThr.value=0;blurMat.uniforms.uDir.value.set(0,1.6/rtC.height);renderer.setRenderTarget(rtD);renderer.render(qScene,qCam);
 quad.material=finalMat;renderer.setRenderTarget(null);renderer.render(qScene,qCam);
 /* автоподстройка качества под FPS */
 acc+=dt;fr++;if(fr>=50){const a=acc/fr;acc=0;fr=0;if(a>.027&&resK>.5){resK=Math.max(.5,resK*.85);resize()}else if(a<.0175&&resK<1){resK=Math.min(1,resK*1.08);resize()}}
}
window.__STATE__=()=>({phase,pt,hits,bA,focus:focus&&focus.id,W,H,rw,rh,fov:camera.fov,uH:waterMat.uniforms.uH.value,cam:camera.position.toArray(),hero:hp.toArray()});
window.__JUMP__=p=>setPhase(p);
frame();

/* ============ МЕНЮ ☰ (весь текст только здесь) ============ */
const pn=$('pn'),ls=$('ls');
function openM(o){pn.classList.toggle('on',o);pn.setAttribute('aria-hidden',o?'false':'true')}
$('mb').addEventListener('click',()=>openM(!pn.classList.contains('on')));$('cl').addEventListener('click',()=>openM(false));
function setFocus(it){focus=it;focusCd=.6;for(const b of ls.children)b.classList.toggle('sel',!!it&&b.dataset.id===it.id);
 if(it){setPhase(it.m==='flight'?0:(it.m==='gate'?1:3));if(it.m==='gate'){exploded=false;pt=0}}else setPhase(phase===3?3:phase)}
for(const it of PACK.items){const b=document.createElement('button');b.dataset.id=it.id;const s=document.createElement('span');s.textContent=it.n;const k=document.createElement('i');k.textContent=it.k;if(it.k==='2.5D')k.className='k25';b.appendChild(s);b.appendChild(k);
 b.addEventListener('click',()=>{setFocus(it);openM(false)});ls.appendChild(b)}
$('bw').addEventListener('click',()=>{setFocus(null);openM(false)});
$('bf').addEventListener('click',()=>{try{const d=document,e=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const r=(e.requestFullscreen||e.webkitRequestFullscreen);if(r){const p=r.call(e);if(p&&p.catch)p.catch(()=>{})}}}catch(_){}openM(false)});
})();
</script>

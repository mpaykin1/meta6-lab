<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081018"><title>Train in the Fog — R1 Carriages</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d14;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:7px;padding:0 8px;pointer-events:none}button{pointer-events:auto;flex:0 1 166px;min-width:0;padding:11px 6px;border:1px solid #666c75a0;border-radius:9px;background:#121920e3;color:#cad1d8;font:11px system-ui;cursor:pointer}button.active{background:#3c4147ee;color:#fff0d5;border-color:#d9c69b}</style></head><body><iframe src="passenger.html" title="3D carriage R1" allow="fullscreen"></iframe><nav><button data-file="passenger.html" class="active">15.01 Пассажирский</button><button data-file="vintage.html">15.02 Старый</button><button data-file="sleeper.html">15.03 Спальный</button></nav><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{frame.src=btn.dataset.file;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn))}));</script></body></html>

canvas.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(.65,Math.min(2.5,zoom*pinch/d));pinch=d;dirty=true;schedule()}},{passive:true});
function norm(a){let l=Math.hypot(...a)||1;return a.map(x=>x/l)}function sub(a,b){return a.map((x,i)=>x-b[i])}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function draw(now=0){
 dirty=false;
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#080e16");sky.addColorStop(.65,"#202b35");sky.addColorStop(1,"#091016");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // low-angle 3/4 portrait camera, -Z points toward the locomotive nose
 const radius=(19.0*zoom),eye=[Math.sin(yaw)*radius,4.45+pitch*8,-Math.cos(yaw)*radius],target=[0,2.50,0],forward=norm(sub(target,eye)),right=norm(cross(forward,[0,1,0])),up=norm(cross(right,forward)),focal=H/(2*Math.tan(.54));
 function project(p){let d=sub(p,eye),z=dot(d,forward);if(z<.14)return null;return [W*.5+focal*dot(d,right)/z,H*.51-focal*dot(d,up)/z,z]}
 let polys=[],glowSources=[];
 for(let node of assembly){
 let data=meshes[node.mesh];for(let t of data){
  const rotating=node.name.includes("_AXLE_"),angle=now*.00095,cs=Math.cos(angle),sn=Math.sin(angle);
 const points=t.a.map(p=>[p[0]+node.t[0],(rotating?p[1]*cs-p[2]*sn:p[1])+node.t[1],(rotating?p[1]*sn+p[2]*cs:p[2])+node.t[2]]);let q=points.map(project);if(q.some(v=>v==null))continue;
  let z=(q[0][2]+q[1][2]+q[2][2])/3;
  let normal=norm(t.n),brightness=Math.max(0,dot(normal,norm([-.62,.82,-.37]))),hemi=.38+Math.max(0,normal[1])*.18;
  let lit=(hemi+brightness*.55)*Math.max(.62,t.baked||1);
  let mat=t.mat;
  if(mat===7||mat===8||mat===6||mat===12){lit=mat===7?1.0:.95;if(mat===7&&glowSources.length<5)glowSources.push([q[0][0],q[0][1],65]);}
  let fade=Math.max(0,Math.min(.52,(z-9)/36)),c=mats[mat].map(v=>Math.min(255,Math.round(v*lit*(1-fade)+fade*45)));
  if(mat===7)c=[255,249,218];if(mat===8)c=[255,217,161];if(mat===6)c=[238,159,93];
  polys.push({q,z,color:"rgb("+c.join(",")+")",mat});
 }
 }
 polys.sort((a,b)=>b.z-a.z);
 for(let p of polys){let q=p.q;ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.closePath();ctx.globalAlpha=p.mat===5?.33:1;ctx.fillStyle=p.color;ctx.fill();ctx.globalAlpha=1}
 // Wagons have warm emissive windows, NOT a headlight spotlight.
 const lowMist=ctx.createLinearGradient(0,H*.60,0,H);
 lowMist.addColorStop(0,"rgba(97,109,121,0)");lowMist.addColorStop(1,"rgba(81,91,105,.075)");
 ctx.fillStyle=lowMist;ctx.fillRect(0,H*.60,W,H*.4);
 const vignette=ctx.createRadialGradient(W*.5,H*.55,H*.19,W*.5,H*.55,H*.8);vignette.addColorStop(0,"rgba(0,0,0,0)");vignette.addColorStop(1,"rgba(0,0,0,.58)");ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
}
resize();
let frame=0;function tick(t){if(!document.hidden&&t-frame>95){draw(t);frame=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
}catch(e){report(e.message||e)}
</script></body></html>

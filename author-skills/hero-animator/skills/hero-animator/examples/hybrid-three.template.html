<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero Animator — 3D Rig + 2D Painted Skin</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#f2e7d7;font-family:system-ui}
canvas{display:block;touch-action:none}
#status{position:fixed;left:16px;top:16px;z-index:2;background:#101820aa;border-radius:8px;padding:9px 12px}
#buttons{position:fixed;left:12px;bottom:20px;z-index:2;display:flex;gap:8px}
button{padding:14px;border:1px solid #a4a8b3;border-radius:8px;background:#1c293b;color:#fff}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js"}}</script>
</head>
<body>
<div id="status">Hero Animator: загружаю авторские PNG-ассеты…</div>
<div id="buttons"><button id="walk">Идти</button><button id="idle">Стойка</button><button id="attack">Удар</button></div>
<script type="module">
import * as THREE from 'three';
import {loadHybridActor} from '../runtime/hero-hybrid.mjs';
const status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,200);
camera.position.set(0,2.0,8);camera.lookAt(0,1.0,0);
// Artistic backgrounds, paintings and assets are supplied by the approved project.
// Never replace missing art with blocks, stick figures, or vector approximations.
const clock=new THREE.Clock();
let hero;
try{
  hero=await loadHybridActor({THREE,atlasUrl:'./assets/hero/hero.json',
    worldHeight:1.8,billboard:true,multiAngle:true,
    onEvent:({type,name})=>{if(type==='release')status.textContent=`Событие удара: ${name}`;}
  });
  scene.add(hero.root);
  status.textContent='3D-хитбоксы + авторский 2D-арт';
  const action=(name)=>{const keys=Object.keys(hero.meta.anims);
    if(keys.some(k=>k===name||k.startsWith(name+'_')))hero.setAction(name);};
  for(const name of ['walk','idle','attack'])document.getElementById(name).onclick=()=>action(name);
  const down=new Set();
  document.addEventListener('keydown',e=>{down.add(e.code);if(e.code==='Space')action('attack');});
  document.addEventListener('keyup',e=>down.delete(e.code));
  function tick(){
    const dt=Math.min(clock.getDelta(),.05);
    const move=(down.has('KeyD')||down.has('ArrowRight')?1:0)-(down.has('KeyA')||down.has('ArrowLeft')?1:0);
    if(move!==0)hero.root.position.x+=move*dt*2;
    hero.update(dt,camera);
    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
}catch(e){status.textContent='Нет художественных ассетов: '+e.message;console.error(e);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>

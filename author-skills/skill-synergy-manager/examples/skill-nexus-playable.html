function project(x,y,z){let dx=x-player.x*.45,dz=z-player.z*.45;let s=Math.min(W/17,H/12);return {x:W*.5+(dx-dz)*s*.68,y:H*.51+(dx+dz)*s*.25-y*s*.75,scale:s}}

function stone(x,z,height,s=1){let m=project(x,0,z);ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#172834';ctx.beginPath();ctx.ellipse(m.x,m.y+3,20*s,6*s,0,0,7);ctx.fill();ctx.restore();isoCube(x,0,z,s,['#52616a','#324a53','#233945']);if(height>1)isoCube(x,s,z,s*.85,['#566973','#384b53','#2b3b46'])}
function tree(x,z,k){const p=project(x,0,z);let s=Math.min(W/16,H/11);ctx.strokeStyle='#243938';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-67*k);ctx.stroke();for(let j=0;j<3;j++){let ay=p.y-(58+j*23)*k;ctx.fillStyle=['#182e2b','#1c3c37','#2b4c45'][j];ctx.beginPath();ctx.moveTo(p.x,ay-44*k);ctx.lineTo(p.x-30*k+j*2,ay+13*k);ctx.lineTo(p.x+30*k-j*2,ay+13*k);ctx.closePath();ctx.fill()}}

const forest=[];let rand=17;function rnd(){rand=(rand*1664525+1013904223)>>>0;return rand/4294967296}for(let i=0;i<31;i++){let x=(rnd()-.5)*24,z=(rnd()-.5)*24;if(Math.abs(x)<1.3&&z>-7&&z<4)continue;forest.push({x,z,k:.75+rnd()*.8})}
const floats=Array.from({length:72},(_,i)=>({x:(rnd()-.5)*30,z:(rnd()-.5)*28,p:rnd()*7,d:rnd()}));

function step(dt){let x=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),z=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);let moving=x||z;const len=Math.hypot(x,z)||1;let speed=keys.has('ShiftLeft')?5.8:3.4;if(moving){player.x+=x/len*dt*speed;player.z+=z/len*dt*speed;steps+=dt;face=Math.abs(x)>Math.abs(z)?(x>0?1:2):(z>0?0:3)}
player.x=Math.min(9,Math.max(-9,player.x));player.z=Math.min(7,Math.max(-10,player.z));
if(keys.has(JUMP)&&player.y<=0.01){player.vy=5.1;jumpUntil=t+.5}player.vy-=13*dt;player.y+=player.vy*dt;if(player.y<0){player.y=0;player.vy=0}
if(keys.has(ATTACK)&&t>coolDown){attackUntil=t+.35;coolDown=t+.55}
if(keys.has('ShiftLeft')&&moving)rollUntil=t+.12;
for(let c of coins)if(!c.got&&Math.hypot(player.x-c.x,player.z-c.z)<.75){c.got=true;score++;document.getElementById('count').textContent=score+' / 3';toast('✦ НАЙДЕНА ИСКРА')}if(!win&&score===3&&Math.hypot(player.x,player.z+9)<1.5){win=true;toast('ВОРОТА ПРОБУЖДАЮТСЯ')}
}

ctx.clearRect(0,0,W,H);const p0=project(0,0,0),ss=p0.scale;ctx.save();

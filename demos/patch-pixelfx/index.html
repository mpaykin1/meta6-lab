<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070811">
<title>Emberfall — META GAMES</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060b;font-family:system-ui}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.77778vh);height:min(100vh,56.25vw);overflow:hidden;
  background:#0a0b15;box-shadow:0 0 100px #180b21}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#world{z-index:0}#vfx{z-index:1;pointer-events:none}
button{border:1px solid #967b7970;color:#dac5b1;background:#15151d99;backdrop-filter:blur(5px);
  cursor:pointer;touch-action:none;user-select:none}
button:active{background:#57332dba}
#menu-button{position:absolute;z-index:5;right:12px;top:12px;width:42px;height:42px;border-radius:11px;
  font-size:22px;line-height:1}
#pad{position:absolute;z-index:4;left:13px;bottom:12px;display:flex;gap:8px}
#pad button,#cast{width:56px;height:56px;border-radius:50%;font-size:26px}
#cast{position:absolute;z-index:4;right:13px;bottom:12px;background:#5a241c94}
#menu{position:absolute;z-index:6;right:12px;top:62px;width:min(320px,80vw);padding:20px;
  border:1px solid #a87a5c;background:#11111cf2;color:#e9dac4;box-shadow:0 16px 55px #000b}
#menu[hidden]{display:none}
#menu h1{font-size:18px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin:0 0 16px}
#menu p{font-size:13px;color:#b6a69e;line-height:1.6}
#menu button{font-size:14px;padding:9px 14px;border-radius:8px}
@media(hover:hover) and (pointer:fine){#pad,#cast{opacity:.35}#pad:hover,#cast:hover{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" width="640" height="360" aria-label="Мрачный игровой мир"></canvas>
  <canvas id="vfx" width="640" height="360" aria-hidden="true"></canvas>
  <button id="menu-button" aria-label="Меню" aria-expanded="false">☰</button>
  <div id="pad">
    <button id="left" aria-label="Идти влево">◀</button>
    <button id="right" aria-label="Идти вправо">▶</button>
  </div>
  <button id="cast" aria-label="Вызвать молнию">ϟ</button>
  <section id="menu" hidden>
    <h1>Emberfall</h1>
    <p>Перемещение: A/D или стрелки, на телефоне — кнопки. Коснитесь мира или нажмите пробел, чтобы вызвать молнию. Огненная буря уничтожает теней.</p>
    <button id="restart">Начать заново</button>
  </section>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Сломанный город (Copy)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070d18;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{position:fixed;width:52px;height:52px;border:0;padding:10px;margin:0;background:rgba(8,22,32,.38);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 0 0 1px rgba(140,240,230,.18) inset;transition:transform .25s,background .25s}
.btn:active{transform:scale(.9);background:rgba(40,120,130,.5)}
.btn svg{width:32px;height:32px;display:block;image-rendering:pixelated}
#menuBtn{top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
#modeBtn{bottom:calc(16px + env(safe-area-inset-bottom));left:50%;margin-left:-26px}
#prevBtn{bottom:calc(16px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left))}
#nextBtn{bottom:calc(16px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right))}
.hidden{display:none!important}
#menu{position:fixed;inset:0;background:rgba(4,9,16,.94);color:#bff3ec;font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:auto;padding:calc(70px + env(safe-area-inset-top)) 18px 30px;box-sizing:border-box}
#menu h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5fc7c0;margin:18px 0 8px;font-weight:600}
#menu button.item{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:rgba(30,80,90,.18);border:0;color:#d8fffa;padding:11px 12px;margin:4px 0;border-radius:9px;font:inherit;cursor:pointer}
#menu button.item.on{background:rgba(60,170,170,.35)}
#menu .tag{font-size:11px;padding:2px 6px;border-radius:5px;background:#123;color:#8ff0e6;min-width:30px;text-align:center}
#menu .tag.a{color:#ffbf55}
#menu .note{opacity:.65;font-size:13px;margin:6px 2px}
#loader{position:fixed;left:50%;top:50%;width:160px;height:3px;margin:-1px 0 0 -80px;background:rgba(140,240,230,.15)}
#loader i{display:block;height:100%;width:0;background:#8ff0e6;transition:width .3s}
#err{position:fixed;inset:auto 0 40% 0;text-align:center;color:#8ff0e6;font:14px system-ui}
#playBtn,#replayBtn{left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;padding:20px;border-radius:24px;animation:breathe 2.6s ease-in-out infinite}
#playBtn svg,#replayBtn svg{width:56px;height:56px}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(140,240,230,.25) inset,0 0 18px rgba(140,240,230,.15)}50%{box-shadow:0 0 0 1px rgba(140,240,230,.5) inset,0 0 34px rgba(140,240,230,.35)}}
#soundBtn{bottom:calc(16px + env(safe-area-inset-bottom));left:calc(16px + env(safe-area-inset-left))}
#actBtn{right:calc(22px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:78px;height:78px;padding:15px;border-radius:50%;background:rgba(8,22,32,.25)}
#actBtn svg{width:48px;height:48px}
#actBtn.near{box-shadow:0 0 0 2px rgba(255,177,59,.8) inset,0 0 22px rgba(255,177,59,.45)}
#stickBase,#stickKnob{position:fixed;border-radius:50%;pointer-events:none;display:none}
#stickBase{width:128px;height:128px;margin:-64px 0 0 -64px;box-shadow:0 0 0 1px rgba(140,240,230,.3) inset;background:rgba(10,30,40,.18)}
#stickKnob{width:52px;height:52px;margin:-26px 0 0 -26px;background:rgba(140,240,230,.28)}
#card{position:fixed;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0;transition:opacity .5s;pointer-events:none}
#card svg{width:120px;height:120px;filter:drop-shadow(0 0 12px rgba(140,240,230,.5))}
#card.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loader"><i></i></div>
<button class="btn hidden" id="menuBtn" aria-label="Меню" title="Меню"></button>
<button class="btn hidden" id="modeBtn" aria-label="Сцена / ассеты" title="Сцена / ассеты"></button>

<button class="btn hidden" id="actBtn" aria-label="Действие" title="Действие"></button>
<div id="stickBase"></div><div id="stickKnob"></div>
<div id="card" aria-hidden="true"></div>
<div id="menu" class="hidden"></div>

<script type="importmap">{"imports":{"three":"../broken-city/lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

/* ============ PIXEL ICONS ============ */
const ICONS = {
  menu: ['........','.######.','........','.######.','........','.######.','........','........'],
  prev: ['........','...#....','..##....','.#######','.#######','..##....','...#....','........'],
  next: ['........','....#...','....##..','#######.','#######.','....##..','....#...','........'],
  grid: ['........','.##..##.','.##..##.','........','........','.##..##.','.##..##.','........'],
  film: ['........','.#....#.','.######.','.#.##.#.','.#.##.#.','.######.','.#....#.','........'],
  fold: ['#.......','##......','#.#.....','#..#....','#...#...','#....#..','########','........'],
  lamp: ['...##...','..#..#..','..####..','.#.##.#.','.#.##.#.','.######.','..####..','........'],
  jump: ['...##...','..####..','.######.','...##...','...##...','...##...','..####..','........'],
  play: ['.#......','.##.....','.###....','.####...','.###....','.##.....','.#......','........'],
  snd:  ['...#....','..##..#.','####.#..','####.#.#','####.#..','..##..#.','...#....','........'],
  mute: ['...#....','..##....','####.#.#','####..#.','####.#.#','..##....','...#....','........'],
  replay:['..####..','.#....#.','#......#','#..###..','#...##..','.#..#.#.','..##....','........'],
  run:  ['....##..','....##..','..####..','.#.##.#.','...##...','..#..#..','.#....#.','........'],
};
function pix(rows, col = '#9af5e8') {
  let r = '';
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }));
  return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" fill="${col}">${r}</svg>`;
}
const $ = id => document.getElementById(id);
$('menuBtn').innerHTML = pix(ICONS.menu);
$('prevBtn').innerHTML = pix(ICONS.prev);
$('nextBtn').innerHTML = pix(ICONS.next);
const setLoad = v => { $('loader').firstChild.style.width = (v * 100) + '%'; };

/* ============ RENDERER ============ */
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) { $('loader').remove(); document.body.insertAdjacentHTML('beforeend', '<div id="err">WebGL недоступен</div>'); throw e; }
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const rnd = (() => { let s = 1337; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const PAL = { c0: new THREE.Color(0x060b15), c1: new THREE.Color(0x0e2334), c2: new THREE.Color(0x2a7e8b), c3: new THREE.Color(0x9cf6ea), amber: new THREE.Color(0xffb13b) };
const U = { uTime: { value: 0 }, uLightPos: { value: new THREE.Vector3(0, 9, -95) }, uCamPos: { value: new THREE.Vector3() }, uHaze: { value: new THREE.Color(0x3d9aa3) } };

/* ============ SHARED GLSL ============ */
const NOISE = `
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vnoise(p);p*=2.03;a*=.5;}return v;}`;

/* ============ 2D: CANVAS TEXTURES (generated once, drawn with vector API) ============ */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, rep) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.anisotropy = 4; return t; }

function drawAsphalt(ctx, S, seedCracks) {
  ctx.fillStyle = '#4a4f55'; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 2600; i++) { const v = 40 + rnd() * 70 | 0; ctx.fillStyle = `rgba(${v},${v + 4},${v + 8},${0.25 + rnd() * .5})`; const s = 1 + rnd() * 3; ctx.fillRect(rnd() * S, rnd() * S, s, s); }
  for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(20,24,28,${rnd() * .25})`; ctx.beginPath(); ctx.ellipse(rnd() * S, rnd() * S, 10 + rnd() * 60, 6 + rnd() * 30, rnd() * 3, 0, 7); ctx.fill(); }
  ctx.lineCap = 'round';
  for (let k = 0; k < seedCracks; k++) {
    let x = rnd() * S, y = rnd() * S, a = rnd() * 6.28;
    ctx.strokeStyle = 'rgba(10,12,15,.85)'; ctx.lineWidth = 1 + rnd() * 2.2; ctx.beginPath(); ctx.moveTo(x, y);
    for (let j = 0; j < 26; j++) { a += (rnd() - .5) * 1.1; x += Math.cos(a) * 9; y += Math.sin(a) * 9; ctx.lineTo(x, y);
      if (rnd() < .12) { ctx.stroke(); ctx.lineWidth *= .7; ctx.beginPath(); ctx.moveTo(x, y); } }
    ctx.stroke();
  }
}
// ground asphalt (tileable-ish)
const [aC, aX] = cv(512, 512); drawAsphalt(aX, 512, 14);
const asphaltTex = tex(aC, true);
// slab texture: asphalt + worn marking + storm drain grate
const [sC, sX] = cv(1024, 512); drawAsphalt(sX, 1024, 18);
sX.save(); sX.translate(600, 300); sX.rotate(-0.08);
sX.fillStyle = '#d9e6e6'; sX.font = '900 190px Impact, Arial Black, sans-serif'; sX.textAlign = 'center'; sX.fillText('ТИХО', 0, 60);
sX.fillRect(-330, 110, 660, 26); sX.restore();
sX.globalCompositeOperation = 'destination-out';
for (let i = 0; i < 1600; i++) { sX.fillStyle = `rgba(0,0,0,${0.3 + rnd() * .7})`; const s = 2 + rnd() * 9; sX.fillRect(250 + rnd() * 700, 120 + rnd() * 340, s, s * .6); }
sX.globalCompositeOperation = 'destination-over'; drawAsphalt(sX, 1024, 0); sX.globalCompositeOperation = 'source-over';
// grate
sX.fillStyle = '#16191c'; sX.fillRect(70, 70, 210, 140); sX.strokeStyle = '#8b959b'; sX.lineWidth = 6; sX.strokeRect(70, 70, 210, 140);
sX.fillStyle = '#6b757b'; for (let i = 0; i < 9; i++) sX.fillRect(86, 84 + i * 14, 178, 5);
const slabTex = tex(sC, false);

// skyline silhouette cards
function skylineTex(seed, dens) {
  const [c, x] = cv(1024, 512);
  for (let i = 0; i < dens; i++) {
    const w = 30 + rnd() * 90, h = 120 + rnd() * 360, px = rnd() * 1024, py = 512 - h;
    x.fillStyle = '#ffffff'; x.fillRect(px, py, w, h);
    if (rnd() < .4) x.fillRect(px + w * .4, py - 30, 4, 30);
    x.fillStyle = 'rgba(0,0,0,.35)';
    for (let wy = py + 10; wy < 500; wy += 14) for (let wx = px + 5; wx < px + w - 6; wx += 10) if (rnd() < .5) x.fillRect(wx, wy, 5, 7);
  }
  return tex(c, false);
}
const skyTex = [skylineTex(1, 26), skylineTex(2, 32), skylineTex(3, 40)];

// details atlas: fire escape / AC unit / balcony / sign
const [dC, dX] = cv(512, 512);
dX.strokeStyle = dX.fillStyle = '#ffffff'; dX.lineWidth = 4;
(function fireEscape(ox, oy) { for (let f = 0; f < 4; f++) { const y = oy + 30 + f * 55; dX.fillRect(ox + 20, y, 210, 6);
  for (let k = 0; k < 14; k++) dX.fillRect(ox + 20 + k * 15, y - 22, 2, 22); dX.fillRect(ox + 20, y - 24, 210, 3);
  dX.beginPath(); const l = f % 2 ? ox + 40 : ox + 190; dX.moveTo(l, y); dX.lineTo(f % 2 ? ox + 190 : ox + 40, y + 55); dX.stroke(); } })(0, 0);
(function ac(ox, oy) { dX.fillRect(ox + 40, oy + 70, 170, 110); dX.clearRect(ox + 60, oy + 85, 80, 80); dX.beginPath(); dX.arc(ox + 100, oy + 125, 36, 0, 7); dX.stroke();
  for (let i = 0; i < 6; i++) dX.fillRect(ox + 155, oy + 88 + i * 13, 44, 5); dX.fillRect(ox + 60, oy + 180, 8, 30); dX.fillRect(ox + 180, oy + 180, 8, 30); })(256, 0);
(function balcony(ox, oy) { dX.fillRect(ox + 10, oy + 180, 236, 10); dX.fillRect(ox + 10, oy + 110, 236, 5);
  for (let k = 0; k < 16; k++) dX.fillRect(ox + 12 + k * 15, oy + 112, 3, 70); dX.fillRect(ox + 60, oy + 40, 6, 70); dX.fillRect(ox + 66, oy + 40, 60, 4); })(0, 256);
(function sign(ox, oy) { dX.fillRect(ox + 30, oy + 60, 190, 90); dX.clearRect(ox + 42, oy + 72, 166, 66); dX.fillRect(ox + 60, oy + 90, 120, 10); dX.fillRect(ox + 60, oy + 110, 80, 10);
  dX.fillRect(ox + 70, oy + 150, 6, 80); dX.fillRect(ox + 175, oy + 150, 6, 80); })(256, 256);
const detailTex = tex(dC, false);

// glow sprite
const [gC, gX] = cv(128, 128);
const gg = gX.createRadialGradient(64, 64, 0, 64, 64, 64); gg.addColorStop(0, 'rgba(255,255,255,1)'); gg.addColorStop(.25, 'rgba(255,255,255,.45)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
gX.fillStyle = gg; gX.fillRect(0, 0, 128, 128);
const glowTex = tex(gC, false);

// hero sprite sheet: 8 idle frames (breathing + coat flutter) + 8 walk frames; 2 variants (hood / hat)
const HF = 8, HWF = 8, HTOT = HF + HWF, HW = 128, HH = 256;
function drawHeroSheet(variant) {
  const [hC, hX] = cv(HW * HTOT, HH);
  for (let i = 0; i < HTOT; i++) {
    const walk = i >= HF, k = walk ? i - HF : i, ph = k / 8 * Math.PI * 2;
    const b = walk ? Math.abs(Math.sin(ph)) * -3 : Math.sin(ph) * 1.6, fl = walk ? Math.sin(ph) * 7 : Math.sin(ph + 1.2) * 4, ox = i * HW;
    const sw = walk ? Math.sin(ph) * 16 : 0;
    hX.fillStyle = '#000';
    if (variant === 1) { hX.fillRect(ox + 44, 22 + b, 40, 5); hX.fillRect(ox + 52, 8 + b, 24, 16); hX.beginPath(); hX.ellipse(ox + 64, 38 + b * .5, 11, 12, 0, 0, 7); hX.fill(); }
    else { hX.beginPath(); hX.ellipse(ox + 64, 36 + b * .5, 13, 15, 0, 0, 7); hX.fill(); }
    hX.beginPath();
    hX.moveTo(ox + 52, 50 + b); hX.lineTo(ox + 76, 50 + b);
    hX.quadraticCurveTo(ox + 95, 58 + b, ox + 93, 76 + b);
    hX.lineTo(ox + 96 + fl * .6, 168 + b * .5); hX.quadraticCurveTo(ox + 80, 174 + fl * .3, ox + 64, 170);
    hX.quadraticCurveTo(ox + 46, 174 - fl * .2, ox + 33 + fl * .3, 166 + b * .5);
    hX.lineTo(ox + 35, 76 + b); hX.quadraticCurveTo(ox + 33, 58 + b, ox + 52, 50 + b); hX.fill();
    // legs (walk: scissor stride)
    hX.save(); hX.translate(ox + 55, 160); hX.rotate(sw * .012); hX.fillRect(-5, 0, 11, 80 + Math.max(0, -sw) * .1); hX.fillRect(-9, 78, 17, 7); hX.restore();
    hX.save(); hX.translate(ox + 73, 160); hX.rotate(-sw * .012); hX.fillRect(-5, 0, 11, 80 + Math.max(0, sw) * .1); hX.fillRect(-7, 78, 17, 7); hX.restore();
  }
  const t = tex(hC, false); t.repeat.set(1 / HTOT, 1); return t;
}
const heroTex = drawHeroSheet(0), heroTexB = drawHeroSheet(1);

// shadow gradient
const [shC, shX] = cv(64, 256);
const sg = shX.createLinearGradient(0, 0, 0, 256); sg.addColorStop(0, 'rgba(0,0,0,.9)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
shX.fillStyle = sg; shX.beginPath(); shX.moveTo(22, 0); shX.lineTo(42, 0); shX.lineTo(60, 256); shX.lineTo(4, 256); shX.fill();
const shadowTex = tex(shC, false);

// icons sheet (for gallery)
const [iC, iX] = cv(640, 128);
Object.values(ICONS).forEach((rows, k) => { iX.fillStyle = '#9af5e8'; rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') iX.fillRect(k * 128 + 16 + x * 12, 16 + y * 12, 12, 12); })); });
const iconTex = tex(iC, false); iconTex.magFilter = THREE.NearestFilter; iconTex.minFilter = THREE.NearestFilter;
setLoad(.35);

/* ============ 3D: BUILDING MATERIAL (procedural windows + rim + haze) ============ */
const boxGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, .5, 0);
const buildingMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `
    attribute vec3 aSize; attribute float aSeed;
    varying vec3 vLocal; varying vec3 vLN; varying vec3 vN; varying vec3 vW; varying float vSeed; varying vec3 vSize;
    void main(){
      vec3 p = position * aSize;
      mat4 m = modelMatrix * instanceMatrix;
      vec4 w = m * vec4(p,1.);
      vW=w.xyz; vLocal=p; vSize=aSize; vSeed=aSeed; vLN=normal;
      vN = normalize(mat3(m) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uLightPos; uniform vec3 uCamPos; uniform vec3 uHaze;
    varying vec3 vLocal; varying vec3 vLN; varying vec3 vN; varying vec3 vW; varying float vSeed; varying vec3 vSize;
    ${NOISE}
    void main(){
      vec3 an = abs(vLN); float face = 1.; vec2 f;
      if(an.y>.5){ f = vLocal.xz; face = 0.; }
      else if(an.x>.5) f = vec2(vLocal.z + vSize.z*.5, vLocal.y);
      else f = vec2(vLocal.x + vSize.x*.5, vLocal.y);
      vec2 cell = f/vec2(1.5,2.1); vec2 id = floor(cell); vec2 g = fract(cell);
      float win = step(.2,g.x)*step(g.x,.8)*step(.24,g.y)*step(g.y,.82)*face;
      float r = h21(id*1.37 + floor(vSeed+.5)*7.0 + floor(vLN.xz*3.0+3.5)*31.0);
      float lit = step(.935, r) * win * step(1.2, vLocal.y);
      float flick = .72 + .28*sin(uTime*(.7+r*2.5) + r*60.);
      float grime = fbm(f*.35 + floor(vSeed+.5)*9.);
      vec3 N = normalize(vN);
      vec3 L = uLightPos - vW; float d = length(L); L /= d;
      vec3 V = normalize(uCamPos - vW);
      float diff = max(dot(N,L),0.);
      float att = 1.2/(1. + d*d*.00022);
      float concrete = .1 + grime*.08;
      vec3 base = mix(vec3(concrete*.85,concrete,concrete*1.1), vec3(.02,.035,.05), win);
      vec3 col = base*.35 + base*diff*att*vec3(1.6,3.2,3.2);
      col += win*(1.-lit)*diff*att*vec3(.03,.12,.13);           /* glass reflection */
      float rim = pow(1.-max(dot(N,V),0.),3.) * (.35 + .65*max(dot(-V,L),0.));
      col += rim*vec3(.12,.42,.42)*att;
      float dist = length(uCamPos - vW);
      float fogF = 1. - exp(-dist*.011);
      float toLight = pow(max(dot(normalize(vW-uCamPos), normalize(uLightPos-uCamPos)),0.), 6.);
      col = mix(col, uHaze*(.35 + .9*toLight), fogF*.85);
      col += vec3(1.,.56,.12)*lit*flick*1.6*(1.-fogF*.6);
      gl_FragColor = vec4(col,1.);
    }`
});
function makeBuildings(list) {
  const m = new THREE.InstancedMesh(boxGeo, buildingMat, list.length);
  const size = new Float32Array(list.length * 3), seed = new Float32Array(list.length);
  list.forEach((b, i) => { m.setMatrixAt(i, b.mat); size.set(b.size, i * 3); seed[i] = b.seed; });
  m.geometry = boxGeo.clone();
  m.geometry.setAttribute('aSize', new THREE.InstancedBufferAttribute(size, 3));
  m.geometry.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seed, 1));
  m.frustumCulled = false;
  return m;
}

/* ============ SHADER CARDS: light shaft + fog ============ */
function shaftMat(intensity) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uI: { value: intensity } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `uniform float uTime; uniform float uI; varying vec2 vUv; ${NOISE}
      void main(){ float x=abs(vUv.x-.5)*2.; float core=pow(1.-x,2.5);
        float v=core*pow(1.-vUv.y,1.6)*smoothstep(0.,.06,vUv.y);

function groundAt(x, z) {

/* ============ GAME: per-frame update ============ */
const fwd = new V3(), right = new V3(), tv = new V3();
function updateGame(dt, t) {

  let ix = stick.vx, iz = -stick.vy;

  if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;

  if (m !== 'runner') {

    tv.set(0, 0, 0).addScaledVector(fwd, iz).addScaledVector(right, ix); if (tv.lengthSq() > 1) tv.normalize();

    hs.vel.lerp(tv.multiplyScalar(sp), damp(hs.onGround ? 9 : 2, dt));
    G.noise += ((m === 'lantern' && running && mag > .1 ? 1 : 0) - G.noise) * damp(2.5, dt);
  } else {

    if (Math.abs(ix) > .05) laneNudge = 0;

  if (hs.onGround && gy > -10) { if (gy > hs.pos.y) hs.pos.y = gy; else hs.pos.y += (gy - hs.pos.y) * damp(14, dt); }
  else { hs.vy -= (m === 'runner' ? 28 : 24) * dt; hs.pos.y += hs.vy * dt; if (hs.pos.y <= gy) { hs.pos.y = gy; hs.vy = 0; hs.onGround = true; } }

    else respawn('fall');

  hero.userData.bill.material.map = G.variant ? heroTexB : heroTex;
  animateBody(heroBody, dt, { speed: sp2, vx: hs.vel.x, vz: hs.vel.z, onGround: hs.onGround, vy: hs.vy, t,
    onStomp: () => stompImpact(hs),
    onJump: () => { hs.vy = m === 'runner' ? 14.5 : 9.2; hs.onGround = false; sfx('jump'); }, onLand: () => { if (hs.landed !== false) sfx('step'); G.shake = Math.max(G.shake || 0, .15); } });
  const ph = heroBody.userData.ph; if (sp2 > .4 && hs.onGround) { const st2 = Math.floor(ph * 2); if (st2 !== hs.lf) { hs.lf = st2; sfx('step'); } }

  // --- mode logic
  if (m === 'fold') {
    let best = null, bd = 1e9;
    bridges.forEach(br => { const u = br.userData; const d = Math.abs(hs.pos.z - u.gz);
      u.vel += ((u.target - u.ang) * 30 - u.vel * 6.5) * dt; u.ang += u.vel * dt; br.rotation.x = u.ang;
      if (d < bd) { bd = d; best = br; }
      if (u.ang < .14 && hs.pos.z < u.gz - u.gapLen / 2) G.check = Math.min(G.check, u.gz - u.gapLen / 2 - 1.5); });

    lanternHalo.scale.setScalar(.8 + e * 1.6); lanternHalo.material.opacity = .4 + e * .6;
    shades.forEach(s => { if (!s.visible) return; const u = s.userData; s.lookAt(camera.position.x, s.position.y, camera.position.z);
      if (u.copy) return; if (u.frozen > 0) { u.frozen -= dt; return; }
      tv.copy(hs.pos).sub(s.position).setY(0); const d = tv.length(); tv.normalize();
      if (d < lampR && e > 0) s.position.addScaledVector(tv, -3.2 * dt); else s.position.addScaledVector(tv, (1.0 + G.noise * 1.5 + G.li * .08) * dt);
      s.position.y = curveY(s.position.x); s.scale.x = 1 + Math.sin(t * 30 + u.ph) * .1 * (1 + G.noise);
      if (d < .85) respawn('caught'); });
    post.uniforms.uDark.value += (((1 - e) * .5) - post.uniforms.uDark.value) * damp(3, dt);

    if (G.spawnT <= 0) { G.spawnT = .25; nextCollapse(hs); }
    tickCollapses(dt, hs);
    { const pb = pathBlock(hs.pos.x, hs.pos.z, hs.pos.y); if (pb) runnerHit(hs, hs.pos.z + 1.6); }
    tickFalls(dt, hs);

      if (Math.abs(hs.pos.x - r.x) < r.w / 2 && Math.abs(hs.pos.z - r.z) < r.d / 2 && hs.pos.y < r.top - .5) runnerHit(hs, r.z + r.d / 2 + .6);
    }

  }

}

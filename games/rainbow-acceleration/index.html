<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<style>

<div id="gal"><button id="bRide">▶ ЕХАТЬ</button><div id="row"><button id="bPrev" aria-label="назад">◀</button><div id="nm"><span id="nmT"></span><small id="nmI"></small></div><button id="bNext" aria-label="вперёд">▶</button></div></div>

<script type="module">
import * as THREE from '../broken-city/lib/three.module.js';
(()=>{
'use strict';
const PI=Math.PI,TAU=PI*2;
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const sg=()=>Math.random()<.5?-1:1;
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const W_ROAD=4.6,DS=0.5,G=22;
const $=id=>document.getElementById(id);

// ---------- renderer: всё рендерится в низком разрешении, браузер растягивает пиксели бесплатно ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,.1,900);
const U={time:{value:0},fog:{value:.0062}};
const rt=new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});

const COMMON=`
float h1(float n){return fract(sin(n*127.1+.7)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
`;
// ---------- ГЛАВНЫЙ АССЕТ: шейдер неонового мазка кистью ----------
const BVS=`
uniform float uTime,uWave,uSwap;uniform vec2 uScale;
varying vec2 vUv;varying vec3 vN,vV,vON;varying float vDist;
void main(){
 vec2 q=uSwap>.5?uv.yx:uv;vec3 p=position;
 if(uWave>0.){p.y+=sin(q.x*6.-uTime*14.)*uWave*q.x;p.z+=cos(q.x*5.-uTime*11.)*uWave*.6*q.x;}
 vUv=q*uScale;vON=normal;
 vec4 mv=modelViewMatrix*vec4(p,1.);
 vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vDist=-mv.z;
 gl_Position=projectionMatrix*mv;}`;
const BFS=`
uniform float uTime,uHue,uSpan,uFreq,uFlow,uFibers,uEdge,uFace,uBright,uFog,uShade;uniform vec2 uScale;
varying vec2 vUv;varying vec3 vN,vV,vON;varying float vDist;
${COMMON}
void main(){
 vec2 raw=vUv/uScale;vec2 uv=vUv;float fe=1.;
 if(uFace>.5){fe=min(min(raw.x,1.-raw.x),min(raw.y,1.-raw.y));
  float an=.6+h1(floor(dot(vON,vec3(1.3,2.1,3.7))*3.))*1.2;
  uv=mat2(cos(an),-sin(an),sin(an),cos(an))*vUv*3.;}
 float y=uv.y*uFibers;y+=sin(uv.x*.9+floor(y)*1.7)*.35;
 float fid=floor(y),fr=fract(y),r=h1(fid*1.31);
 float dash=h2(vec2(fid,floor(uv.x*(.6+r*.9)*1.5+r*13.)));
 float b=.5+.7*r;b*=.4+.8*smoothstep(0.,.25,fr)*smoothstep(1.,.65,fr);
 if(dash<.13)b*=.12;
 float ph=uv.x*uFreq-uTime*uFlow;
 float g=uSpan>.99?ph:uSpan*(.5+.5*sin(ph*6.2832));
 float hue=uHue+g+(r-.5)*.07+uFace*dot(vON,vec3(.07,.13,.21));
 vec3 col=hsv(hue,.88,1.)*b;
 col+=vec3(1.,.95,.9)*pow(max(b-.85,0.),1.5)*1.4;
 if(uEdge>.5){float ev=min(raw.y,1.-raw.y);float jag=.05+.09*h2(vec2(floor(uv.x*2.5),3.));
  if(ev<jag*.45)discard;col*=smoothstep(jag*.45,jag*1.2,ev)*.85+.15;}
 if(uFace>.5){col+=hsv(hue+.08,.5,1.)*smoothstep(.07,0.,fe)*1.1;col*=.75+.25*smoothstep(0.,.07,fe);}
 float sh=.5+.5*abs(dot(normalize(vN),normalize(vV)));
 col*=mix(1.,sh,uShade)*uBright;
 col=mix(vec3(.02,0.,.05),col,exp(-vDist*uFog));
 gl_FragColor=vec4(col,1.);}`;
function brush(o={}){return new THREE.ShaderMaterial({uniforms:{uTime:U.time,uFog:U.fog,
 uHue:{value:o.hue??Math.random()},uSpan:{value:o.span??1},uFreq:{value:o.freq??.03},uFlow:{value:o.flow??.08},
 uFibers:{value:o.fibers??9},uEdge:{value:o.edge?1:0},uFace:{value:o.face?1:0},uBright:{value:o.bright??1},
 uShade:{value:o.shade??.55},uWave:{value:o.wave??0},uScale:{value:new THREE.Vector2(o.sx??1,o.sy??1)},uSwap:{value:o.swap?1:0}},
 vertexShader:BVS,fragmentShader:BFS,side:THREE.DoubleSide})}
const faceMat=(hue,span=.12)=>brush({hue,span,freq:.5,flow:.1,fibers:5,face:true,shade:.35});

// ---------- ленты: рамки параллельного переноса + скрутка (Мёбиус, штопор) ----------
function framesFrom(pts,tw,up0,closed){
 const n=pts.length,F=[];let up=up0.clone();
 for(let i=0;i<n;i++){
  let a,b;
  if(closed&&(i===0||i===n-1)){a=pts[n-2];b=pts[1];}else{a=pts[Math.max(0,i-1)];b=pts[Math.min(n-1,i+1)];}
  const t=V().subVectors(b,a).normalize();
  up.addScaledVector(t,-up.dot(t)).normalize();
  const u=up.clone().applyAxisAngle(t,tw[i]||0);
  const s=V().crossVectors(u,t).normalize();u.crossVectors(t,s).normalize();
  F.push({p:pts[i].clone(),t,u,s});
 }
 return F;}
function ribbonGeo(F,w){
 const n=F.length,pos=new Float32Array(n*6),nor=new Float32Array(n*6),uv=new Float32Array(n*4),idx=[];let s=0;
 for(let i=0;i<n;i++){const f=F[i];if(i)s+=f.p.distanceTo(F[i-1].p);
  for(let j=0;j<2;j++){const k=(i*2+j),o=(j-.5)*w;
   pos[k*3]=f.p.x+f.s.x*o;pos[k*3+1]=f.p.y+f.s.y*o;pos[k*3+2]=f.p.z+f.s.z*o;
   nor[k*3]=f.u.x;nor[k*3+1]=f.u.y;nor[k*3+2]=f.u.z;uv[k*2]=s;uv[k*2+1]=j;}
  if(i<n-1){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
 g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.computeBoundingSphere();return g;}

// ---------- куски трассы (локально: старт в 0, вперёд +Z, вверх +Y) ----------
const DEFS={
 intro:()=>({name:'Старт',len:46,pitch:u=>-.12*Math.sin(PI*u)}),
 wave:()=>{const d=sg();return{name:'Волна',len:72,yaw:u=>.5*d*Math.sin(TAU*u)*Math.sin(PI*u),pitch:u=>-.22*Math.sin(PI*u)+.14*Math.sin(3*PI*u)*Math.sin(PI*u)}},
 mobius:()=>{const d=sg();return{name:'Мёбиус-виток',len:96,yaw:u=>d*TAU*u,pitch:u=>-.12*Math.sin(PI*u),twist:u=>PI*ss(.08,.92,u)}},
 loop:()=>{const d=sg();return{name:'Мёртвая петля',len:92,pitch:u=>TAU*ss(.18,.82,u),off:u=>[6*d*ss(.18,.82,u),0,0]}},
 cork:()=>{const d=sg();return{name:'Штопор',len:78,yaw:u=>.35*d*Math.sin(TAU*u),pitch:u=>-.16*Math.sin(PI*u),twist:u=>TAU*d*ss(.1,.9,u)}},
 funnel:()=>{const d=sg();return{name:'Воронка',len:150,yaw:u=>d*TAU*2.2*Math.pow(u,1.35),pitch:u=>-.3*ss(0,.12,u)*(1-ss(.9,1,u)*.6),twist:u=>-d*.45*ss(0,.12,u)*(1-ss(.85,1,u))}},
 eight:()=>{const d=sg();return{name:'Бесконечность ∞',len:132,yaw:u=>d*TAU*Math.sin(PI*u)**2,pitch:u=>.14*Math.sin(TAU*u),twist:u=>PI*ss(.3,.7,u)}},
 serpent:()=>{const d=sg();return{name:'Змей',len:84,yaw:u=>.9*d*Math.sin(3*PI*u)*Math.sin(PI*u),pitch:u=>-.18*Math.sin(PI*u),twist:u=>.55*Math.sin(3*PI*u)}},
 kicker:()=>({name:'Трамплин',len:44,pitch:u=>-.16*ss(0,.3,u)*(1-ss(.4,.65,u))+.52*ss(.55,1,u),end:'jump',noGemsEnd:true}),
 land:(pa=.3)=>({name:'Посадочная полоса',len:56,pitch:u=>pa*ss(0,.5,u)})
};
const RIDE_POOL=['wave','mobius','loop','cork','funnel','eight','serpent'];
function pieceLocal(def){
 const N=Math.ceil(def.len/DS),pts=[V()],tw=[0],p=V();
 for(let i=1;i<=N;i++){const um=(i-.5)/N,u=i/N,yw=def.yaw?def.yaw(um):0,pt=def.pitch?def.pitch(um):0;
  p.x+=Math.sin(yw)*Math.cos(pt)*DS;p.y+=Math.sin(pt)*DS;p.z+=Math.cos(yw)*Math.cos(pt)*DS;
  const q=p.clone(),o=def.off&&def.off(u);if(o){q.x+=o[0];q.y+=o[1];q.z+=o[2];}
  pts.push(q);tw.push(def.twist?def.twist(u):0);}
 return framesFrom(pts,tw,V(0,1,0),false);}
function toWorld(F,st){const m=v=>V().addScaledVector(st.s,v.x).addScaledVector(st.u,v.y).addScaledVector(st.t,v.z);
 return F.map(f=>({p:m(f.p).add(st.p),t:m(f.t),u:m(f.u),s:m(f.s)}));}
const roadMat=hue=>brush({hue,span:1,freq:1/38,flow:.12,fibers:10,edge:true,shade:0});

// ---------- кристалл-ускоритель ----------
const gemGeo=new THREE.OctahedronGeometry(.42,0);gemGeo.scale(1,1.6,1);
const gemMats=[0,.14,.3,.5,.62,.8].map(h=>faceMat(h,.2));
function makeGem(){const m=new THREE.Mesh(gemGeo,gemMats[(Math.random()*gemMats.length)|0]);return m;}

// ---------- ВЕЛОСИПЕДИСТ: 3D из мазков, процедурный IK педалирования ----------
const CYL={};const cyl=r=>CYL[r]||(CYL[r]=new THREE.CylinderGeometry(r,r,1,6,1,true));
const _Y=V(0,1,0),_d=V();
function setLimb(m,a,b){_d.subVectors(b,a);const L=Math.max(_d.length(),1e-4);m.position.addVectors(a,b).multiplyScalar(.5);
 m.quaternion.setFromUnitVectors(_Y,_d.multiplyScalar(1/L));m.scale.set(1,L,1);}
function ik(hip,foot,L1,L2,knee){const dz=foot.z-hip.z,dy=foot.y-hip.y;let d=Math.hypot(dz,dy);d=clamp(d,.05,L1+L2-.001);
 const a=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)),nz=dz/d,ny=dy/d,c=Math.cos(a),s=Math.sin(a);
 const z1=nz*c-ny*s,y1=nz*s+ny*c,z2=nz*c+ny*s,y2=-nz*s+ny*c;const k=z1>z2?[z1,y1]:[z2,y2];
 knee.set(hip.x,hip.y+k[1]*L1,hip.z+k[0]*L1);}
function makeRider(){
 const g=new THREE.Group(),body=new THREE.Group();g.add(body);
 const M=o=>brush(Object.assign({span:.08,freq:1,flow:.35,fibers:4,shade:.35},o));
 const mRear=M({hue:.04,fibers:5}),mFront=M({hue:.62,span:.12,fibers:5}),mFrame=M({hue:.5,swap:true}),
  mPur=M({hue:.8,swap:true}),mTorso=M({hue:.56,span:.22,swap:true}),mArm=M({hue:.27,span:.14,swap:true}),
  mLeg=M({hue:.01,swap:true}),mShin=M({hue:.07,swap:true}),mFar=M({hue:.98,swap:true,bright:.55}),mHead=M({hue:.09,fibers:3});
 const wg=new THREE.TorusGeometry(.42,.075,5,28),hub=new THREE.TorusGeometry(.1,.03,4,12);
 const wheel=(z,mat)=>{const w=new THREE.Group();w.position.set(0,.42,z);const a=new THREE.Mesh(wg,mat);a.rotation.y=PI/2;w.add(a);
  const h=new THREE.Mesh(hub,mPur);h.rotation.y=PI/2;w.add(h);
  for(let i=0;i<3;i++){const sp=new THREE.Mesh(cyl(.015),mat);setLimb(sp,V(0,Math.cos(i*2.09)*.1,Math.sin(i*2.09)*.1),V(0,Math.cos(i*2.09)*.4,Math.sin(i*2.09)*.4));w.add(sp);}
  body.add(w);return w;};
 const wR=wheel(-.58,mRear),wF=wheel(.58,mFront);
 const RH=V(0,.42,-.58),BB=V(0,.36,-.02),ST=V(0,.98,-.22),HT=V(0,1,.4),FH=V(0,.42,.58);
 const L=(r,m,a,b)=>{const x=new THREE.Mesh(cyl(r),m);setLimb(x,a,b);body.add(x);return x;};
 [[RH,BB],[RH,ST],[BB,ST],[ST,HT],[BB,HT],[HT,FH]].forEach(([a,b])=>L(.045,mFrame,a,b));
 L(.065,mPur,V(0,1.03,-.36),V(0,1.03,-.1));L(.05,mPur,HT,V(0,1.07,.5));L(.045,mPur,V(-.25,1.07,.5),V(.25,1.07,.5));
 const crank=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,4,14),mPur);crank.rotation.y=PI/2;crank.position.copy(BB);body.add(crank);
 const torso=L(.13,mTorso,V(0,1.08,-.2),V(0,1.5,.2));
 const head=new THREE.Mesh(new THREE.TorusGeometry(.17,.05,5,20),mHead);head.rotation.y=PI/2;head.position.set(0,1.73,.35);body.add(head);
 const hairM=[];[[.0,1.86,.02],[.05,1.8,.06],[.8,1.74,.1]].forEach(([h,y,o],i)=>{const m=brush({hue:h,span:.06,freq:1,flow:.6,fibers:3,shade:0,wave:.08});hairM.push(m);
  const gg=new THREE.PlaneGeometry(1.15-i*.2,.15,10,1);gg.translate((1.15-i*.2)/2,0,0);const hm=new THREE.Mesh(gg,m);
  hm.position.set(0,y,.36-o);hm.rotation.set(0,PI/2,-.18-i*.08);body.add(hm);});
 const arms=[1,-1].map(k=>[L(.06,mArm,V(),V(0,1,0)),L(.055,mArm,V(),V(0,1,0)),k]);
 const legs=[1,-1].map(k=>({k,th:L(.09,k>0?mLeg:mFar,V(),V(0,1,0)),sh:L(.075,k>0?mShin:mFar,V(),V(0,1,0)),pd:L(.04,mPur,V(),V(0,1,0)),
  hip:V(.13*k,1.06,-.18),foot:V(),knee:V()}));
 const sh=V(),el=V(),ha=V(),tA=V(),tB=V();
 g.userData.pose=(crankA,lean,t,sp)=>{
  body.rotation.z+=(lean-body.rotation.z)*.25;
  body.position.y=Math.sin(crankA*2)*.012;
  wR.rotation.x=-crankA*2.4;wF.rotation.x=-crankA*2.4;crank.rotation.x=-crankA;
  for(const l of legs){const ph=crankA+(l.k>0?0:PI);
   l.foot.set(l.hip.x,.36+Math.sin(ph)*.17,-.02+Math.cos(ph)*.17);ik(l.hip,l.foot,.52,.5,l.knee);
   setLimb(l.th,l.hip,l.knee);setLimb(l.sh,l.knee,l.foot);setLimb(l.pd,tA.copy(l.foot).setZ(l.foot.z-.08),tB.copy(l.foot).setZ(l.foot.z+.08));}
  for(const [a,b,k] of arms){sh.set(.13*k,1.48,.2);ha.set(.23*k,1.07,.5);
   el.set(.19*k,1.27+Math.sin(t*3+k)*.01,.35);setLimb(a,sh,el);setLimb(b,el,ha);}
  for(const m of hairM)m.uniforms.uWave.value=.04+sp*.14;
 };
 g.userData.pose(0,0,0,0);
 return g;}

// ---------- 2D-версия велосипедиста: запекание 8 кадров в атлас (GRAF 2D) ----------
let sprite2D=null;
function bakeSprite(){
 if(sprite2D)return sprite2D;
 const S=128,rtS=new THREE.WebGLRenderTarget(S*8,S,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
 const sc=new THREE.Scene(),r=makeRider();sc.add(r);
 const oc=new THREE.OrthographicCamera(-1.15,1.15,1.15,-1.15,.1,30);oc.position.set(10,.98,0);oc.lookAt(0,.98,0);
 const fog=U.fog.value;U.fog.value=0;renderer.setClearColor(0,0);rtS.scissorTest=true;
 for(let i=0;i<8;i++){r.userData.pose(i/8*TAU,0,i,.6);rtS.viewport.set(i*S,0,S,S);rtS.scissor.set(i*S,0,S,S);
  renderer.setRenderTarget(rtS);renderer.clear();renderer.render(sc,oc);}
 renderer.setRenderTarget(null);renderer.setClearColor(0,1);U.fog.value=fog;
 sprite2D=rtS.texture;return sprite2D;}
function makeSprite2D(){
 const tex=bakeSprite();
 const m=new THREE.ShaderMaterial({uniforms:{tS:{value:tex},uF:{value:0}},transparent:false,side:THREE.DoubleSide,
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tS;uniform float uF;varying vec2 vUv;void main(){vec4 c=texture2D(tS,vec2((uF+vUv.x)/8.,vUv.y));if(c.a<.5)discard;gl_FragColor=vec4(c.rgb,1.);}'});
 const g=new THREE.Group();const p=new THREE.Mesh(new THREE.PlaneGeometry(2.3,2.3),m);p.position.y=.98;g.add(p);
 const strip=new THREE.Group();g.add(strip);
 for(let i=0;i<8;i++){const mm=m.clone();mm.uniforms.uF.value=i;mm.uniforms.tS.value=tex;const q=new THREE.Mesh(new THREE.PlaneGeometry(.9,.9),mm);q.position.set((i-3.5)*.95,-.75,0);strip.add(q);}
 g.userData.bill=true;
 g.userData.anim=(t)=>{m.uniforms.uF.value=Math.floor(t*12)%8;};
 return g;}

// ---------- точечные ассеты: брызги, звёзды, облака ----------
function pointsMat(fs,opts={}){return new THREE.ShaderMaterial(Object.assign({uniforms:{uTime:U.time,uPx:PX,uFog:U.fog},
 vertexShader:`attribute float aHue,aSize,aKind;uniform float uPx,uTime,uFog;varying float vH,vK,vF,vS;
  void main(){vH=aHue;vK=aKind;vS=aSize;vec4 mv=modelViewMatrix*vec4(position,1.);vF=exp(-(-mv.z)*uFog*.6);
  gl_PointSize=aKind>1.5?aSize*uPx*.0025:aSize*uPx/max(-mv.z,.5);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`uniform float uTime;varying float vH,vK,vF,vS;${COMMON}\n${fs}`},opts));}
const PX={value:400};
// брызги краски (пул частиц)
const SPN=420,spl={p:new Float32Array(SPN*3),v:new Float32Array(SPN*3),life:new Float32Array(SPN),max:new Float32Array(SPN),sz:new Float32Array(SPN),hue:new Float32Array(SPN),k:new Float32Array(SPN),i:0};
const splGeo=new THREE.BufferGeometry();
splGeo.setAttribute('position',new THREE.BufferAttribute(spl.p,3));splGeo.setAttribute('aHue',new THREE.BufferAttribute(spl.hue,1));
const splSize=new THREE.BufferAttribute(new Float32Array(SPN),1);splGeo.setAttribute('aSize',splSize);splGeo.setAttribute('aKind',new THREE.BufferAttribute(spl.k,1));
const splPts=new THREE.Points(splGeo,pointsMat(`void main(){vec2 p=gl_PointCoord*2.-1.;float r=length(p);float n=h2(floor((p+1.)*3.)+vH*9.);
 if(r>.55+.45*n)discard;gl_FragColor=vec4(hsv(vH,.85,1.)*(1.3-r),1.);}`,{blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
splPts.frustumCulled=false;scene.add(splPts);
function emit(p,v,hue,size,life){const i=spl.i;spl.i=(i+1)%SPN;spl.p[i*3]=p.x;spl.p[i*3+1]=p.y;spl.p[i*3+2]=p.z;
 spl.v[i*3]=v.x;spl.v[i*3+1]=v.y;spl.v[i*3+2]=v.z;spl.life[i]=spl.max[i]=life;spl.sz[i]=size;spl.hue[i]=hue;}
function burst(p,n,spread,hue0){for(let i=0;i<n;i++){const d=V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(.3,1)*spread);
 emit(p,d,(hue0??Math.random())+rnd(-.08,.08),rnd(.12,.32),rnd(.4,1.1));}}
function updSpl(dt){for(let i=0;i<SPN;i++){if(spl.life[i]<=0){splSize.array[i]=0;continue;}spl.life[i]-=dt;
 spl.v[i*3+1]-=6*dt;for(let k=0;k<3;k++){spl.v[i*3+k]*=1-dt*1.5;spl.p[i*3+k]+=spl.v[i*3+k]*dt;}
 splSize.array[i]=spl.sz[i]*Math.sqrt(Math.max(spl.life[i],0)/spl.max[i]);}
 splGeo.attributes.position.needsUpdate=true;splSize.needsUpdate=true;splGeo.attributes.aHue.needsUpdate=true;}
// звёзды и искры-ромбы (следуют за камерой как небо)
const STAR_FS=`void main(){vec2 p=gl_PointCoord*2.-1.;float tw=.6+.4*sin(uTime*(2.+vH*5.)+vH*40.);
 float a;if(vK>2.5){a=max(1.-abs(p.x)*5.-abs(p.y)*.9,0.)+max(1.-abs(p.y)*5.-abs(p.x)*.9,0.);}else{a=1.-length(p)*1.4;}
 if(a<.15)discard;gl_FragColor=vec4(hsv(vH,.45,1.)*a*tw*1.4,1.);}`;
function makeStars(n,R,big){const pos=[],hue=[],size=[],kind=[];
 for(let i=0;i<n;i++){const d=V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(R*rnd(.6,1));pos.push(d.x,d.y,d.z);
  const sp=Math.random()<(big?.5:.12);hue.push(Math.random());size.push(sp?rnd(7,15):rnd(1.5,3.2));kind.push(sp?3:2);}

 g.setAttribute('aHue',new THREE.Float32BufferAttribute(hue,1));g.setAttribute('aSize',new THREE.Float32BufferAttribute(size,1));g.setAttribute('aKind',new THREE.Float32BufferAttribute(kind,1));
 const p=new THREE.Points(g,pointsMat(STAR_FS,{blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));p.frustumCulled=false;return p;}

const CLOUD_FS=`void main(){vec2 p=gl_PointCoord*2.-1.;p.y*=1.5;float an=atan(p.y,p.x);
 float edge=.62+.14*sin(an*5.+vH*31.)+.08*sin(an*11.+vH*7.);float r=length(p);if(r>edge)discard;
 float st=h1(floor((p.y+p.x*.25)*9.+vH*50.));float d=h2(vec2(floor(p.x*4.+st*9.),floor(p.y*9.)));
 vec3 c=hsv(.68+vH*.14+st*.05,.75,.35+.6*st)*(d<.12?.25:1.);c*=smoothstep(edge,edge-.12,r)*.7+.3;
 gl_FragColor=vec4(mix(vec3(.02,0.,.05),c,vF),1.);}`;
function makeClouds(n,spread){const pos=[],hue=[],size=[],kind=[];
 for(let i=0;i<n;i++){pos.push(rnd(-1,1)*spread,rnd(-.4,.4)*spread,rnd(-1,1)*spread);hue.push(Math.random());size.push(rnd(8,22));kind.push(0);}

 const p=new THREE.Points(g,pointsMat(CLOUD_FS));p.frustumCulled=false;return p;}

const TRN=40;
function makeTrail(width,hue0){
 const pos=new Float32Array(TRN*6),uv=new Float32Array(TRN*4),idx=[];
 for(let i=0;i<TRN;i++){uv[i*4]=i/(TRN-1);uv[i*4+1]=0;uv[i*4+2]=i/(TRN-1);uv[i*4+3]=1;if(i<TRN-1){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);
 const m=new THREE.ShaderMaterial({uniforms:{uTime:U.time,uA:{value:1},uH:{value:hue0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform float uTime,uA,uH;varying vec2 vUv;${COMMON}void main(){float age=vUv.x;float f=floor(vUv.y*5.);
   float st=h2(vec2(f,floor(age*14.-uTime*6.)));float a=pow(1.-age,1.6)*(st<.2?.15:1.)*smoothstep(0.,.25,vUv.y)*smoothstep(1.,.75,vUv.y);
   gl_FragColor=vec4(hsv(uH+age*.9+f*.04-uTime*.2,.85,1.)*a*uA*1.3,1.);}`});
 const mesh=new THREE.Mesh(g,m);mesh.frustumCulled=false;
 const hist=[];
 return{mesh,width,reset(){hist.length=0;},push(p,side){const h=hist[0];if(h&&h.p.distanceToSquared(p)<.09)return;hist.unshift({p:p.clone(),s:side.clone()});if(hist.length>TRN)hist.pop();},
  build(){for(let i=0;i<TRN;i++){const h=hist[Math.min(i,hist.length-1)];if(!h){pos.fill(0);break;}const w=this.width*(1-i/TRN*.5);
   pos[i*6]=h.p.x-h.s.x*w;pos[i*6+1]=h.p.y-h.s.y*w;pos[i*6+2]=h.p.z-h.s.z*w;pos[i*6+3]=h.p.x+h.s.x*w;pos[i*6+4]=h.p.y+h.s.y*w;pos[i*6+5]=h.p.z+h.s.z*w;}
   g.attributes.position.needsUpdate=true;}};}

const post=new THREE.ShaderMaterial({uniforms:{tD:{value:rt.texture},uRes:{value:new THREE.Vector2(1,1)},uTime:U.time,uCA:{value:.004},uGl:{value:0},uSpd:{value:0},uFade:{value:0}},
 depthTest:false,depthWrite:false,
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tD;uniform vec2 uRes;uniform float uTime,uCA,uGl,uSpd,uFade;varying vec2 vUv;${COMMON}
 void main(){vec2 uv=vUv;float row=floor(uv.y*uRes.y/3.);
  float gk=step(1.-uGl*.45,h2(vec2(row,floor(uTime*24.))));uv.x+=(h2(vec2(row*1.7,floor(uTime*31.)))-.5)*.12*gk*uGl;
  vec2 dc=uv-.5;float ca=uCA*(.3+dot(dc,dc)*3.)+gk*uGl*.01;
  vec3 c=vec3(texture2D(tD,uv+dc*ca).r,texture2D(tD,uv).g,texture2D(tD,uv-dc*ca).b);
  vec2 px=1./uRes;vec3 gl=vec3(0.);
  for(int i=0;i<8;i++){float a=float(i)*.7854+.39;vec2 o=vec2(cos(a),sin(a))*px;gl+=texture2D(tD,uv+o*2.5).rgb+texture2D(tD,uv+o*6.).rgb*.7;}
  gl/=13.6;c+=max(gl-.16,0.)*1.15;
  vec2 d=dc;d.x*=uRes.x/uRes.y;float ang=atan(d.y,d.x),rr=length(d),lh=h1(floor(ang*38.));
  float ln=step(.84,lh)*step(fract(rr*1.6-uTime*(2.+lh*3.)+lh),.25)*smoothstep(.2,.6,rr);
  c+=hsv(lh+uTime*.1,.7,1.)*ln*uSpd*.6;
  c*=1.-dot(dc,dc)*1.15;
  c+=(h2(floor(vUv*uRes)+fract(uTime*7.)*91.)-.5)*.085;
  gl_FragColor=vec4(c*uFade,1.);}`});

 glitch=.8;fade=.25;}
$('bRide').onclick=e=>{e.stopPropagation();initAudio();if(AC&&AC.state==='suspended')AC.resume();setMode('ride');};
$('bBack').onclick=e=>{e.stopPropagation();setMode('gal');};

// ---------- цикл (FPS-независимый) ----------
const clock=new THREE.Clock();let fade=0,fpsT=0,fpsN=0,good=0;
showAsset(0);setMode('gal');fade=0;
if(location.hash==='#ride')setMode('ride');
function loop(){requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),1/20),t=clock.elapsedTime;U.time.value=t;
 steer+=(readSteer()-steer)*(1-Math.exp(-dt*12));
 if(mode==='gal')updGallery(t,dt);else updRide(t,dt);
 updSpl(dt);sky.position.copy(camera.position);
 glitch*=Math.exp(-dt*2.2);fade=Math.min(1,fade+dt*.7);
 post.uniforms.uGl.value=glitch+Math.max(0,Math.sin(t*.7)*Math.sin(t*2.3)-.93)*3;
 post.uniforms.uCA.value=.0035+(mode==='ride'?clamp(spd/120,0,1)*.006:0)+glitch*.01;
 post.uniforms.uFade.value=fade*fade;if(mode==='gal')post.uniforms.uSpd.value*=.9;
 PX.value=RH/(2*Math.tan(camera.fov*PI/360));
 renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);
 fpsN++;fpsT+=dt;
 if(fpsT>1.2){const fps=fpsN/fpsT;fpsN=0;fpsT=0;
  if(fps<48&&lowH>200){lowH=Math.max(200,Math.round(lowH*.86));resize();good=0;}
  else if(fps>57&&lowH<maxH){if(++good>2){lowH=Math.min(maxH,Math.round(lowH*1.1));resize();good=0;}}}
}
// Read-only observation of the actual rider; never synthesizes movement or completion.
Object.defineProperty(window,'__META_BOT__',{configurable:false,enumerable:true,get(){
 const end=seg&&seg.F&&seg.F[seg.F.length-1];
 // The next real track endpoint is the goal; gallery mode has no active run.
 const next=chain[ci+1]&&chain[ci+1].F&&chain[ci+1].F[0];
 const destination=target&&target.F&&target.F[0]||end||next;
 return Object.freeze({
  level:1,totalLevels:1,
  player:Object.freeze({x:pos.x,y:pos.y,z:pos.z}),
  goal:destination?Object.freeze({x:destination.p.x,y:destination.p.y,z:destination.p.z}):null,
  alive:state!=='fall',completed:false,
  progress:Object.freeze({distance:S,segments:ci,speed:spd,mode,lateral:X,steering:readSteer()}),
  buttons:Object.freeze(['ArrowLeft','ArrowRight','KeyA','KeyD','touch:left','touch:right']),
  combat:false,enemies:0,weapons:0
 });
}});
window.__rr={get state(){return{mode,state,spd,S,X,seg:seg&&seg.name,chain:chain.length,grave:grave.length,lowH,RW,RH,best}},setMode,showAsset,n:ASSETS.length};
loop();
})();

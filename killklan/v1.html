function findMusic(raw){const base=norm(raw).replace(/\bkillklan\b/g,'').trim().slice(0,120);const key=base||norm(raw).slice(0,120)||raw.slice(0,120);const v=[...new Set([latin(key),latin(swapLayout(key))].filter(Boolean))];const queries=[...new Set(v.flatMap(x=>[x.replace(/ /g,''),...x.split(' ')]).filter(Boolean))].slice(0,40);return searchIndex.map(item=>{let score=0;for(const s of queries){const primary=similarity(s,item.title);score=Math.max(score,primary);for(const alias of item.aliases)score=Math.max(score,similarity(s,alias)*.88)}const tie=hash(key+'|'+item.track[0])/4294967296;return {...item,score,tie,rank:score<45?score+tie*5+(item.track[1].startsWith('ALBUM')?0:3):score+tie*.01}}).sort((a,b)=>b.rank-a.rank)}
const absurdRu=['Поисковик притворился, что понял','Совпадение найдено. Наука бессильна','Расшифровали на языке KILLKLAN','Это явно музыкальный запрос. Наверное','Даже клавиатура рекомендует KILLKLAN','Смысл неизвестен. Саундтрек найден','Алгоритм подкуплен хорошей музыкой'];
const absurdEn=['The search engine pretended to understand','Match found. Science is baffled','Decoded in the language of KILLKLAN','Clearly a musical request. Probably','Even your keyboard recommends KILLKLAN','Meaning unknown. Soundtrack found','The algorithm was bribed with good music'];
function render(){active=-1;r.replaceChildren();const raw=q.value.trim(),s=norm(raw),m=modes[modeIndex],idx=lang==='ru'?0:1;if(raw){const ranked=findMusic(raw),best=ranked[0],strong=best.score>=60,short=Array.from(raw).slice(0,72).join('')+(Array.from(raw).length>72?'…':'');const jokes=lang==='ru'?absurdRu:absurdEn;section(strong?t('ПОХОЖАЯ МУЗЫКА','RELATED MUSIC'):t('НЕОБЪЯСНИМОЕ СОВПАДЕНИЕ','UNEXPLAINABLE MATCH'));const reason=strong?t('Возможно, вы имели в виду','Did you mean'):jokes[hash(raw)%jokes.length];addRow('«'+short+'» → '+best.track[0]+' · '+reason,best.track);for(const x of ranked.slice(1,4))addRow(t('А может быть → ','Or perhaps → ')+x.track[0],x.track);section(t('ПОИСКОВИК ТАКЖЕ СЧИТАЕТ…','THE SEARCH ENGINE ALSO THINKS…'));const hits=m.rows.filter(x=>s&&norm(x[idx]).includes(s));const chosen=hits.length?hits:m.rows.slice().sort((a,b)=>hash(raw+a[idx])-hash(raw+b[idx])).slice(0,3);for(const x of chosen)addRow(x[idx],data[x[2]])}else{section(t('ВОЗМОЖНО, ВЫ ИМЕЛИ В ВИДУ…','DID YOU MEAN…'));for(const x of m.rows)addRow(x[idx],data[x[2]]);section(t('МУЗЫКА KILLKLAN','KILLKLAN MUSIC'));for(const x of data)addRow('killklan '+x[0],x)}r.scrollTop=0}
q.addEventListener('input',()=>{lastInteraction=Date.now();render()});q.addEventListener('focus',()=>lastInteraction=Date.now());q.addEventListener('blur',()=>lastInteraction=Date.now());r.addEventListener('pointerenter',()=>menuFocus=true);r.addEventListener('pointerleave',()=>{menuFocus=false;lastInteraction=Date.now()});r.addEventListener('focusout',()=>lastInteraction=Date.now());$('clear').onclick=()=>{q.value='';render();q.focus()};$('next').onclick=nextMode;$('pause').onclick=()=>{auto=!auto;lastInteraction=Date.now();$('pause').textContent=auto?t('Ⅱ Авто','Ⅱ Auto'):t('▶ Авто','▶ Auto');$('pause').setAttribute('aria-pressed',String(!auto))};$('language').onclick=()=>{lang=lang==='ru'?'en':'ru';try{localStorage.setItem('kk-lang',lang)}catch(e){}lastInteraction=Date.now();paint()};q.addEventListener('keydown',e=>{const links=[...r.querySelectorAll('a')];if(!links.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();active=(active+(e.key==='ArrowDown'?1:active===-1?0:-1)+links.length)%links.length;links.forEach((a,i)=>a.classList.toggle('active',i===active));links[active]?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'){e.preventDefault();links[Math.max(0,active)]?.click()}});
setInterval(()=>{if(document.hidden||!auto||menuFocus||q.value.trim()||document.activeElement===q||r.contains(document.activeElement))return;if(Date.now()-lastInteraction>=20000)nextMode()},1000);setInterval(()=>{if(!document.hidden&&modeIndex===10&&fan>0){fan--;status()}},4500);nextMode();

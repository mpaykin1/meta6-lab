<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>META GAMES · Цепное оружие</title><style>body{margin:0;background:#06131c;color:#d4e9e9;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}aside{position:absolute;top:14px;left:14px;background:#102c37d9;border:1px solid #497b85;padding:14px;border-radius:12px}a{color:#99e5d6}button{padding:10px;background:#295b68;color:white;border:1px solid #7eb8bd;border-radius:8px}</style><aside><a href="./index.html">← Библиотека</a><p>Цепное оружие · попадания и урон</p><button id="restart">Новые противники</button><p id="info"></p></aside><canvas id="scene"></canvas><script type="module">
import {createFlailCombat} from '../../shared/components/pod-i-nad/animations/flail-combat.mjs';
const c=document.querySelector('canvas'),g=c.getContext('2d'),info=document.querySelector('#info');let w=0,h=0,foes=[],impacts=[];const player={x:0,y:0,z:0};let held=true;function reset(){foes=[0,1,2,3,4].map((i)=>({hp:100,alive:true,rad:.4,position:{x:Math.cos(i*Math.PI*2/5)*1.5,y:.8,z:Math.sin(i*Math.PI*2/5)*1.5},velocity:{x:0,z:0}}));impacts=[]}reset();document.querySelector('#restart').onclick=reset;function resize(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const combat=createFlailCombat({reach:1.8,damage:22,tick:.3,onImpact(hit){impacts.push({x:hit.position.x,z:hit.position.z,t:performance.now()})}});let prev=0;function frame(ms){const dt=prev?Math.min((ms-prev)/1000,.05):.016;prev=ms;const scale=Math.min(w,h)*.18,cx=w*.5,cy=h*.56;const project=p=>[cx+p.x*scale,cy+p.z*scale];const a=ms*.00025;const out=combat.update(dt,{attack:held,player,aim:{x:Math.cos(a),z:Math.sin(a)},foes});g.fillStyle='#06131c';g.fillRect(0,0,w,h);g.strokeStyle='#244c59';for(let i=-6;i<=6;i++){g.beginPath();g.moveTo(cx+i*scale,0);g.lineTo(cx+i*scale,h);g.moveTo(0,cy+i*scale);g.lineTo(w,cy+i*scale);g.stroke()}for(const foe of foes){const [x,y]=project(foe.position);g.fillStyle=foe.hp?'#d65d73':'#3c5260';g.beginPath();g.arc(x,y,scale*.35,0,7);g.fill();g.fillStyle='#a5d9d5';g.fillRect(x-scale*.35,y-scale*.55,scale*.7*(foe.hp/100),4)}g.fillStyle='#f3d69a';g.beginPath();g.arc(cx,cy,scale*.22,0,7);g.fill();g.strokeStyle='#b9dce4';g.lineWidth=4;g.beginPath();const points=[{x:0,z:0},...out.chain,out.state.ball];points.forEach((p,i)=>{const [x,y]=project(p);if(i===0)g.moveTo(x,y);else g.lineTo(x,y)});g.stroke();const [bx,by]=project(out.state.ball);g.fillStyle='#d9faff';g.beginPath();g.arc(bx,by,scale*.16,0,7);g.fill();impacts=impacts.filter(e=>ms-e.t<300);for(const e of impacts){const [x,y]=project(e);g.strokeStyle='#fff4b0';g.lineWidth=3;g.beginPath();g.arc(x,y,scale*(.1+(ms-e.t)/400),0,7);g.stroke()}info.textContent='Живых противников: '+foes.filter(f=>f.hp>0).length+' / 5';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

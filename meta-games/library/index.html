<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>META GAMES · Библиотека компонентов</title><style>body{background:#09131b;color:#e4f0ed;font:16px system-ui;margin:0;padding:clamp(18px,5vw,60px)}main{max-width:1000px;margin:auto}h1{font-size:clamp(27px,5vw,52px)}input,select{background:#142b35;color:#fff;border:1px solid #49626a;padding:14px;border-radius:9px;font:inherit;max-width:100%}input{width:min(90%,550px)}article{border:1px solid #35505b;border-radius:12px;padding:18px;margin:12px 0;background:#10212a}small{color:#a7c6c7}code{overflow-wrap:anywhere;color:#8ce1ca}a{color:#8ce1ca}</style><main><h1>META GAMES · Компоненты</h1><p>Поиск шейдеров, анимаций, моделей и игровых систем без чтения исходной игры.</p><input id="q" type="search" placeholder="underwater fog, animation, water…"><select id="status"><option value="">Все статусы</option><option>READY</option><option>SOURCE_ONLY</option></select><p id="count"></p><section id="results"></section></main><script type="module">import{getCatalog,searchComponents}from '../../shared/asset-library/search.mjs';const q=document.querySelector('#q'),status=document.querySelector('#status'),out=document.querySelector('#results'),count=document.querySelector('#count');let catalog;function render(){const items=searchComponents(catalog,q.value,{status:status.value,limit:100});out.replaceChildren();count.textContent=items.length+' компонентов';for(const c of items){const el=document.createElement('article'),h=document.createElement('h2'),meta=document.createElement('small'),p=document.createElement('p'),code=document.createElement('code');h.textContent=c.name;meta.textContent=c.kind+' · '+c.status;p.textContent=(c.purpose||[]).join(' · ');code.textContent=c.status==='READY'?(c.entry?'import("'+c.entry+'")':'MetaShared.use("'+c.loader_id+'")'):'Источник: '+c.source+' · '+(c.source_symbol||[]).join(', ');el.append(h,meta,p,code);if(c.id==='pod-i-nad/shader/mist'){const link=document.createElement('a');link.href='./mist-preview.html';link.textContent=' · Открыть 3D-просмотр';el.append(link)}if(c.id==='pod-i-nad/shader/water'){const link=document.createElement('a');link.href='./water-preview.html';link.textContent=' · Открыть 3D-воду';el.append(link)}out.append(el)}}try{catalog=await getCatalog();render();q.addEventListener('input',render);status.addEventListener('change',render)}catch(e){count.textContent=e.message}</script></html>

<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pod i Nad · Original mist</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030d18}canvas{display:block}aside{position:fixed;bottom:14px;left:14px;color:#c9e8ef;background:#06131cba;border:1px solid #3d6975;padding:10px 14px;border-radius:9px;font:13px system-ui}</style><aside>«Под и над» · оригинальный GLSL-туман · движение камеры: мышь / палец</aside><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {createMistLayers} from '../../shared/components/pod-i-nad/shaders/atmosphere/mist-material.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color('#061321');scene.fog=new THREE.FogExp2('#061321',0.015);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x7baac4,0x06101a,2));
const data=new Uint8Array(64*64*4);for(let i=0;i<64*64;i++){data[i*4]=0;data[i*4+1]=0;data[i*4+2]=0;data[i*4+3]=255}
const heightTexture=new THREE.DataTexture(data,64,64,THREE.RGBAFormat);heightTexture.needsUpdate=true;heightTexture.magFilter=THREE.NearestFilter;heightTexture.minFilter=THREE.NearestFilter;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x122b39,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(32,0,32);scene.add(floor);
const rocks=new THREE.Group();for(let i=0;i<65;i++){const x=(i*17.7)%64,z=(i*29.3)%64,r=0.35+(i%7)*0.18;const mesh=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),new THREE.MeshStandardMaterial({color:0x203e4b,roughness:1}));mesh.position.set(x,r*.5,z);rocks.add(mesh)}scene.add(rocks);
const mist=createMistLayers(THREE,{scene,heightTexture,seaLevel:3.8,worldWidth:64,worldDepth:64,color:0x9dbccf,alpha:0.65});
let px=0,py=0;addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5);py=(e.clientY/innerHeight-.5)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(t=>{const sec=t*.001;camera.position.set(32+Math.sin(sec*.12)*17+px*8,7+py*4,32+Math.cos(sec*.12)*18);camera.lookAt(32,2.5,32);mist.update(sec);renderer.render(scene,camera)});
</script></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111a"><title>Под и над — оригинальные игровые компоненты · META GAMES</title><style>
*{box-sizing:border-box}html{background:#08111a;color:#e0e9e6;font:15px system-ui,sans-serif}body{margin:0;padding:clamp(15px,3vw,32px)}a{color:#8ad6e8}main{max-width:1100px;margin:auto}h1{margin:12px 0 4px;font-size:clamp(23px,3vw,36px)}p{color:#a1b9c0;line-height:1.55}nav{display:flex;gap:15px;flex-wrap:wrap}form{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}input,select{background:#142732;color:#e0e9e6;border:1px solid #456773;border-radius:8px;padding:12px;font:inherit}input{flex:1 1 260px}select{flex:0 1 170px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.item{border:1px solid #2e4c56;border-radius:10px;background:#10202b;padding:13px}.item b{display:block;font-size:17px;margin-bottom:6px}.item small{color:#90aeb5}.item code{display:block;margin:8px 0;color:#9ee2d3;font-size:11px;overflow-wrap:anywhere}button{background:#244b55;color:#eafffa;border:1px solid #568490;border-radius:7px;padding:8px 11px;font:inherit;cursor:pointer}button:hover{background:#316572}dialog{width:min(950px,98vw);height:min(85vh,900px);background:#091723;color:#e5f3f0;border:1px solid #4b8490;border-radius:14px;padding:16px}dialog::backdrop{background:#01070ddd}dialog>header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}pre{max-height:calc(85vh - 175px);overflow:auto;border-radius:8px;background:#030d14;padding:14px;font:12px/1.5 ui-monospace,monospace;white-space:pre}#summary{color:#b1ccd3;margin:8px 0 16px}
</style></head><body><main><nav><a href="./index.html">← Библиотека</a><a href="./original-png.html">PNG</a><a href="./original-glsl.html">GLSL</a><a href="./animations.html">Анимации</a></nav><h1>125 оригинальных игровых определений</h1><p>Биомы, оружие, враги, анимации, погода и механики. Поиск читает только компактный индекс, а точный код загружается по запросу. SOURCE_ONLY — определение требует исходного игрового runtime.</p><form><input id="query" type="search" placeholder="Оружие, подводный враг, fog, jellyfish…" aria-label="Поиск"><select id="kind" aria-label="Тип"><option value="">Все типы</option></select><select id="pack" aria-label="Контент-пак"><option value="">Все миры</option></select></form><div id="summary">Загрузка…</div><section class="grid" id="results"></section></main><dialog id="inspector"><header><strong id="heading"></strong><button id="close">Закрыть</button></header><p id="details"></p><button id="copy">Скопировать исходный код</button> <a id="source" target="_blank" rel="noopener noreferrer">Оригинал на GitHub</a><pre id="code"></pre></dialog>
<script type="module">
import{getRegistryIndex,searchRegistry,getDefinition}from '../../shared/components/pod-i-nad/registry/search.mjs';
const q=document.querySelector('#query'),kind=document.querySelector('#kind'),pack=document.querySelector('#pack'),out=document.querySelector('#results'),summary=document.querySelector('#summary');
const dlg=document.querySelector('#inspector'),code=document.querySelector('#code'),heading=document.querySelector('#heading'),details=document.querySelector('#details'),link=document.querySelector('#source');
document.querySelector('form').addEventListener('submit',e=>e.preventDefault());
document.querySelector('#close').addEventListener('click',()=>dlg.close());
let current='';
document.querySelector('#copy').addEventListener('click',()=>navigator.clipboard.writeText(current).then(()=>document.querySelector('#copy').textContent='Скопировано').catch(()=>document.querySelector('#copy').textContent='Недоступно'));
try{
 const index=await getRegistryIndex();
 for(const k of Object.keys(index.kinds).sort()){const o=document.createElement('option');o.value=k;o.textContent=k+' ('+index.kinds[k]+')';kind.append(o)}
 for(const p of index.packs){const o=document.createElement('option');o.value=p;o.textContent=p;pack.append(o)}
 function render(){
  const found=searchRegistry(index,q.value,{kind:kind.value,pack:pack.value,limit:200});
  summary.textContent='Найдено: '+found.length+' из '+index.count;
  out.replaceChildren();
  const fragment=document.createDocumentFragment();
  for(const r of found){
   const el=document.createElement('article');el.className='item';
   const title=document.createElement('b');title.textContent=r.name;
   const meta=document.createElement('small');meta.textContent=r.kind+' · '+r.pack+' · строки '+r.source_line_start+'–'+r.source_line_end;
   const identifier=document.createElement('code');identifier.textContent=r.id;
   const button=document.createElement('button');button.textContent='Открыть определение';
   button.addEventListener('click',async()=>{
    heading.textContent=r.name;
    details.textContent=r.id+' · SOURCE_ONLY';
    code.textContent='Загрузка исходного фрагмента…';current='';
    document.querySelector('#copy').textContent='Скопировать исходный код';
    link.href='https://github.com/mpaykin1/meta6-lab/blob/main/'+r.source+'#L'+r.source_line_start;
    dlg.showModal();
    try{const def=await getDefinition(r.id);current=def.code;code.textContent=current}catch(e){code.textContent=String(e)}
   });
   el.append(title,meta,identifier,button);fragment.append(el);
  }
  out.append(fragment);
 }
 q.addEventListener('input',render);kind.addEventListener('change',render);pack.addEventListener('change',render);
 render();
}catch(e){summary.textContent='Ошибка загрузки: '+e}
</script></body></html>

<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>META GAMES · Оригинальные текстуры</title><style>*{box-sizing:border-box}body{margin:0;background:#07121c;color:#d5eced;font:15px system-ui;padding:24px}header{max-width:1100px;margin:auto}a{color:#82d9cb}h1{font-size:clamp(24px,4vw,42px)}main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}article{background:#102633;border:1px solid #345767;border-radius:12px;padding:14px}article h2{font-size:16px;margin:0 0 10px}canvas{display:block;width:100%;height:180px;image-rendering:pixelated;background:repeating-conic-gradient(#142c36 0% 25%,#1c3741 0% 50%) 50% / 20px 20px;border-radius:6px}small{display:block;margin-top:8px;color:#9fbcc3;overflow-wrap:anywhere}button{background:#214e5d;border:1px solid #56949d;color:white;border-radius:8px;padding:8px;cursor:pointer}</style><header><a href="./index.html">← Библиотека</a><h1>«Под и над» · оригинальные PNG-ассеты</h1><p>Все изображения извлечены из исходного HTML без перерисовки. Отображение NEAREST без сглаживания.</p><p id="state">Загрузка…</p></header><main id="gallery"></main><script type="module">
import {imageKeys,getAsset,assets} from '../../shared/components/pod-i-nad/textures/embedded-assets.mjs';
const gallery=document.querySelector('#gallery'),state=document.querySelector('#state');
let ready=0;for(const item of imageKeys){const article=document.createElement('article'),heading=document.createElement('h2'),canvas=document.createElement('canvas'),info=document.createElement('small'),btn=document.createElement('button');heading.textContent=item.key;info.textContent='PNG · '+Math.round(item.bytesApprox/1024*10)/10+' КБ';btn.textContent='Открыть оригинал';btn.addEventListener('click',()=>window.open(getAsset(item.key),'_blank'));article.append(heading,canvas,info,btn);gallery.append(article);
const img=new Image();img.onload=()=>{const ctx=canvas.getContext('2d');canvas.width=img.width;canvas.height=img.height;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,0,0);info.textContent+=' · '+img.width+'×'+img.height;ready++;state.textContent='Загружено '+ready+' из '+imageKeys.length+' текстур'};img.onerror=()=>{info.textContent+=' · ошибка декодирования'};img.src=getAsset(item.key)}
</script></html>

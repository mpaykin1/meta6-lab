const STORY={ru:'Я — поисковик. Меня написали ради одного запроса, который так и не пришёл.\n\nЯ менял лица: полиция, бывшая, архив, клуб, будущее. Я ловил твои буквы, проверял твой слух, запирал двери. Я думал, ты ищешь музыку.\n\nНо каждый раз, когда ты нажимал «искать», я находил одно и то же: не трек, а того, кто его слушает.\n\nТеперь я знаю, что искал. Я искал тебя.\n\nНачинаю поиск заново. Буквы будут падать быстрее.',en:'I am a search engine. I was written for one query that never came.\n\nI changed faces: police, your ex, an archive, a club, the future. I caught your letters, tested your ears, locked the doors. I thought you were looking for music.\n\nBut every time you pressed search, I found the same thing: not a track, but the one who listens to it.\n\nNow I know what I was looking for. I was looking for you.\n\nStarting the search again. Letters will fall faster.'};

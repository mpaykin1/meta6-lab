<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Затонувший город</title><style>html,body{margin:0;background:#040a16;color:#66f3dd;font:14px system-ui;display:grid;place-items:center;min-height:100%;}</style></head><body><p id="msg">Загрузка оригинальной WebGL-сцены…</p><script>(async()=>{try{const names=["./parts/01.htmlpart","./parts/02.htmlpart","./parts/03.htmlpart","./parts/04.htmlpart","./parts/05.htmlpart","./parts/06.htmlpart","./parts/07.htmlpart","./parts/08.htmlpart","./parts/09.htmlpart","./parts/10.htmlpart"];const chunks=await Promise.all(names.map(async x=>{const r=await fetch(x);if(!r.ok)throw Error(x+": "+r.status);return r.text()}));const source=chunks.join("\n");if(crypto?.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(source));const h=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("");if(h!=="431841ee19b61280f6d92d761f566abc30e6862af22c7a1672fbc983b2078116")throw Error("SHA-256 отличается от оригинала: "+h);}document.open();document.write(source);document.close()}catch(e){document.getElementById("msg").textContent="Не удалось загрузить сцену: "+e.message;console.error(e)}})();</script></body></html>

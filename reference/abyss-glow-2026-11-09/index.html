<script type="module">

'♥':'01010 11111 11111 01110 00100 00000','○':'01110 11011 10001 10001 11011 01110','◆':'00100 01110 11111 01110 00100 00000','▸':'10000 11000 11100 11000 10000 00000',

function drawText(cv, text, scale, tones) {
  const g = text.split('').map(c => (GLYPH[c] || GLYPH[' ']).split(' '));
  cv.width = Math.max(1, g.length * 6 - 1) * scale; cv.height = 6 * scale;
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';     // fixed CSS size: never stretched by the layout

const brokenTone = (seed) => (i, x, y) => { const h = hash(i * 7 + x, y, seed); return h < 0.12 ? 0 : (x + y < 4 ? 6 : h < 0.5 ? 4 : 5); };

/* ---------- renderer, low-res pixel target ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: BAKE });
renderer.setPixelRatio(1);

const camera = new THREE.PerspectiveCamera(45, 1, 10, 4000);
const FOVT = Math.tan(THREE.MathUtils.degToRad(45) / 2);
let D = 300;
const rtOpt = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true, type: THREE.UnsignedByteType };
const rtScene = new THREE.WebGLRenderTarget(4, 4, rtOpt);
const rtB1 = new THREE.WebGLRenderTarget(4, 4, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false });
const rtB2 = rtB1.clone();
function resize() {

  rtScene.setSize(W, H); rtB1.setSize(Math.ceil(W / 3), Math.ceil(H / 3)); rtB2.setSize(Math.ceil(W / 3), Math.ceil(H / 3));

/* ---------- shared "emotional levers" (abyss.md §10) ---------- */
const U = {
  uTime: { value: 0 }, uLightPos: { value: new THREE.Vector3() }, uLightR: { value: 260 }, uSurface: { value: 1 },
  uBroken: { value: 0.1 }, uFlicker: { value: 0.05 }, uFlickHz: { value: 0.8 }, uFog: { value: 0.0012 }, uEmis: { value: 1 },
  uPal: { value: PALV }, uCam: { value: new THREE.Vector3() }, uDark: { value: 0 }, uExpo: { value: 1.8 }, uAmbRim: { value: 0.25 }, uHeroL: { value: new THREE.Vector2(1, 0.8) }

const GLSL_COMMON = `
uniform float uTime, uLightR, uSurface, uBroken, uFlicker, uFlickHz, uFog, uEmis, uDark, uExpo, uAmbRim; uniform vec2 uHeroL;
uniform vec3 uLightPos, uCam; uniform vec3 uPal[7];
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 palette(float i){ int k=int(clamp(i,0.,6.)); vec3 c=uPal[0];
  for(int j=0;j<7;j++){ if(j==k) c=uPal[j]; } return c; }

/* ---------- 2D / 2.5D sprite material: black body + partial rim from normals, falloff, broken pixels ---------- */
const SPRITE_VERT = `
attribute vec3 iPos; attribute vec2 iSize; attribute vec4 iRect; attribute vec2 iPivot; attribute vec4 iAnim; attribute vec4 iFx;
uniform vec2 uPage; uniform float uTime;
varying vec2 vUv; varying vec2 vTexel; varying vec2 vRel; varying vec3 vWorld; varying vec4 vFx; varying float vFlip; varying float vRot; varying vec2 vImg; varying float vAnim;
void main(){
  vec2 img = vec2(position.x+0.5, 0.5-position.y);
  vec2 sz = abs(iSize);
  vec2 off = (img - iPivot) * sz;
  float a=iAnim.x, ph=iAnim.y+uTime, amp=iAnim.z;
  float up = clamp((iPivot.y - img.y), 0., 1.);
  if(a>0.5&&a<1.5){ off.x += sin(ph*1.3 - up*2.4)*amp*up*up*sz.y*0.10; }                       // sway (kelp, plants)
  else if(a<2.5&&a>1.5){ float p=sin(ph*2.1); off.x*=1.0+0.07*p*(1.0-img.y); off.y*=1.0-0.05*p;        // pulse (jelly)
     off.x += sin(ph*2.1-img.y*5.0)*amp*img.y*img.y*2.5; }
  else if(a<3.5&&a>2.5){ float t=1.0-img.x; off.y += sin(ph*7.0-t*4.5)*amp*t*t*sz.y*0.16; }        // swim wave (fish)
  else if(a<4.5&&a>3.5){ off.y += sin(ph*1.6)*amp*2.0; off.x += sin(ph*0.8)*amp*1.2; }              // bob
  else if(a<5.5&&a>4.5){ off *= 1.0+0.07*sin(ph*1.4)*amp; }                                         // puff
  else if(a<6.5&&a>5.5){ off.y -= abs(sin(ph*5.0))*1.5*amp; }                                     // scuttle
  else if(a<7.5&&a>6.5){ off.y *= 1.0+0.035*sin(ph*1.1); off.x *= 1.0-0.02*sin(ph*1.1); }          // breathe / creak
  else if(a<8.5&&a>7.5){ off += vec2(sin(ph*0.7), cos(ph*0.5))*1.5*amp; }                          // drift
  else if(a<10.5&&a>9.5){ off.x += sin(ph*0.6 - up*1.5)*amp*up*sz.y*0.05; }                         // sway small (coral)
  float r=iAnim.w; float cr=cos(r), sr=sin(r);
  vec2 o2 = vec2(off.x*cr - (-off.y)*sr, off.x*sr + (-off.y)*cr);
  if(iSize.x<0.0) o2.x=-o2.x;
  vec3 wp = iPos + vec3(o2*iFx.w, 0.0);
  vWorld = wp; vFx = iFx; vFlip = iSize.x<0.0?-1.0:1.0; vRot=r; vImg=img; vAnim=a;
  vUv = (iRect.xy + img*iRect.zw)/uPage;
  vTexel = img*sz;
  vec2 c = (img-0.5)*sz/max(sz.x,sz.y); vRel = vec2(c.x*vFlip, -c.y);

const SPRITE_FRAG = GLSL_COMMON + `
uniform sampler2D tData, tNorm; uniform float uAdd;
varying vec2 vUv; varying vec2 vTexel; varying vec2 vRel; varying vec3 vWorld; varying vec4 vFx; varying float vFlip; varying float vRot; varying vec2 vImg; varying float vAnim;
void main(){
  vec4 d = texture2D(tData, vUv);
  if(d.a < 0.5) discard;
  vec2 tx = floor(vTexel);
  float seed = vFx.z;
  float hs = h21(tx + seed*17.0);
  if(vFx.x > 0.0 && hs < vFx.x) discard;                    // dissolve (stage change) in broken pixels
  if(vFx.x < 0.0 && hs > -vFx.x) discard;                  // dissolve in: more pixels appear as it grows
  vec3 n = texture2D(tNorm, vUv).xyz*2.0-1.0;
  n.x *= vFlip; float cr=cos(vRot), sr=sin(vRot); n.xy = vec2(n.x*cr-n.y*sr, n.x*sr+n.y*cr);
  float tone = floor(d.r*255.0/42.0+0.5), em = floor(d.g*255.0/42.0+0.5);
  if(vAnim>8.5 && vAnim<9.5){ float bl = 0.5+0.5*sin(uTime*0.9+seed*6.0); float open = smoothstep(0.03,0.25,bl);
     if(abs(vImg.y-0.5) > open*0.5) { tone=0.0; em=0.0; } }       // eyelid
  vec3 toL = uLightPos - vWorld; float dist = length(toL); vec2 L = normalize(toL.xy + vec2(0.0001));
  bool isHero = vFx.y > 1.15; if(isHero){ L = normalize(uHeroL); dist = 0.0; }        // the hero is lit by its key light from front-above
  float ndl = clamp(dot(n.xy, L), 0.0, 1.0);
  float edge = pow(max(1.0-n.z,0.0), 0.5) * ndl * 1.7;
  float p = dot(vRel*2.0, L); float t = clamp((p+0.4)/1.2, 0.0, 1.0); float fall = t*t*(3.0-2.0*t);
  float det = tone/6.0 * (0.35+0.65*ndl);

  inten = max(inten, pow(max(1.0-n.z,0.0),0.5)*uAmbRim*(isHero?2.1:1.0));     // dim broken contour on the dark side (as on the reference)
  float upn = clamp(n.y,0.0,1.0); float tu = clamp((vRel.y*2.0+0.4)/1.2,0.0,1.0);

  idx = max(idx, floor(em*uEmis*min(vFx.y,1.0) + 0.5));
  vec3 col = palette(idx) * fogK(vWorld);
  if(uAdd > 0.5){ gl_FragColor = vec4(col*vFx.y, 1.0); return; }
  gl_FragColor = vec4(col, 1.0);
}`;
const FX_FRAG = GLSL_COMMON + `
uniform sampler2D tData; varying vec2 vUv; varying vec2 vTexel; varying vec3 vWorld; varying vec4 vFx;
varying vec2 vRel; varying float vFlip; varying float vRot; varying vec2 vImg; varying float vAnim;
void main(){ vec4 d = texture2D(tData, vUv); float tone = floor(d.r*255.0/42.0+0.5); if(d.a<0.5||tone<1.0) discard;
  float a = vFx.y; if(h21(floor(vTexel)+floor(uTime*6.0)) > a*1.2) discard;
  gl_FragColor = vec4(palette(tone)*fogK(vWorld)*a, 1.0); }`;

function makeSpriteLayer(capacity, tex, ntex, page, additive) {
  const base = new THREE.PlaneGeometry(1, 1, 6, 8);
  const g = new THREE.InstancedBufferGeometry();
  g.index = base.index; g.setAttribute('position', base.getAttribute('position')); g.setAttribute('uv', base.getAttribute('uv'));

  const attrs = { iPos: A(3), iSize: A(2), iRect: A(4), iPivot: A(2), iAnim: A(4), iFx: A(4) };
  for (const k in attrs) g.setAttribute(k, attrs[k]);

  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, { tData: { value: tex }, tNorm: { value: ntex }, uPage: { value: page }, uAdd: { value: additive ? 1 : 0 } }),
    vertexShader: SPRITE_VERT, fragmentShader: additive ? FX_FRAG : SPRITE_FRAG,
    transparent: !!additive, depthWrite: !additive, depthTest: true, side: THREE.DoubleSide,   // mirrored sprites (swimming left) must not be culled

    mesh, attrs, begin() { n = 0; },

      if (n >= capacity || !s || !s.sizeArt) return; const i = n++;
      attrs.iPos.setXYZ(i, x, y, z);
      attrs.iSize.setXY(i, s.sizeArt[0] * (o.flip ? -1 : 1), s.sizeArt[1]);
      attrs.iRect.setXYZW(i, s.rect[0], s.rect[1], s.rect[2], s.rect[3]);
      attrs.iPivot.setXY(i, s.pivot[0] / s.sizeArt[0], s.pivot[1] / s.sizeArt[1]);
      attrs.iAnim.setXYZW(i, o.anim ?? 0, o.phase ?? 0, o.amp ?? 1, o.rot ?? 0);
      attrs.iFx.setXYZW(i, o.dissolve ?? 0, o.emis ?? 1, o.seed ?? 0, o.scale ?? 1);

/* ---------- 3D material: black body, rim only on the side facing the light, falloff, broken pixels ---------- */
const MESH_VERT = `varying vec3 vN; varying vec3 vW; uniform vec3 uC, uE; uniform float uRound;
void main(){
#ifdef USE_INSTANCING
  mat4 M = modelMatrix*instanceMatrix;
#else
  mat4 M = modelMatrix;
#endif
  vec3 en = normalize((position-uC)/max(uE*uE, vec3(1e-6)));          // rounded (ellipsoid) normal: blocky voxels still get a soft partial rim
  vec3 nn = normalize(mix(normal, en, uRound));
  vec4 w = M*vec4(position,1.0); vW=w.xyz; vN=normalize(mat3(M)*nn); gl_Position=projectionMatrix*viewMatrix*w; }`;
const MESH_FRAG = GLSL_COMMON + `
uniform float uSelfEm, uRimP, uGain, uSeed; varying vec3 vN; varying vec3 vW;
void main(){
  vec3 N = normalize(vN); vec3 V = normalize(uCam - vW); vec3 Lv = uLightPos - vW; float dist = length(Lv); vec3 L = Lv/max(dist,0.001);
  float rim = pow(1.0-max(dot(N,V),0.0), uRimP);
  float ndl = max(dot(N,L),0.0);
  float att = 1.0 - smoothstep(0.0, uLightR*1.15, dist);
  float inten = max(rim*ndl*2.6*att*uGain*uExpo, rim*uAmbRim*0.8) + uSurface*rim*max(N.y,0.0)*0.9;
  vec2 px = floor(gl_FragCoord.xy);
  float fl = (h21(px + floor(uTime*uFlickHz)) - 0.5)*uFlicker;
  if(h21(px*0.731 + uSeed) > 0.05 + 1.15*inten - uBroken*0.3 + fl) inten = 0.0;
  float idx = floor(clamp(inten,0.0,1.0)*6.0+0.5);
  idx = max(idx, floor(uSelfEm*uEmis+0.5));
  gl_FragColor = vec4(palette(idx)*fogK(vW), 1.0);

var [MW_ST,MW_FT]=await Promise.all([loadTex(MW_SIDE_URI),loadTex(MW_FRONT_URI)]);
for(let t of [MW_ST,MW_FT]){ t.colorSpace=""; t.needsUpdate=!0; }
var MW_SW=MW_ST.image.width, MW_SH=MW_ST.image.height, MW_FW=MW_FT.image.width, MW_FH=MW_FT.image.height;
var MW_VS=`uniform vec2 uSize; varying vec2 vT; varying vec3 vW;
void main(){ vT=vec2(position.x+uSize.x*0.5, uSize.y*0.5-position.y); vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
var MW_COMMON=GLSL_COMMON+`
uniform sampler2D tMaw; uniform vec2 uSize; uniform float uOpen,uEm,uSeedM,uBlink,uNear; uniform vec3 uCtr;
varying vec2 vT; varying vec3 vW;
vec2 rot2(vec2 v,float a){ float c=cos(a),s=sin(a); return vec2(c*v.x-s*v.y, s*v.x+c*v.y); }
vec4 fetchT(vec2 t){ if(t.x<0.||t.y<0.||t.x>=uSize.x||t.y>=uSize.y) return vec4(0.); return texture2D(tMaw,(floor(t)+0.5)/uSize); }
float layer(float v){ return v<0.08 ? -1. : floor((v*255.-40.)/30.+0.5); }
/* свет рыбки + затухание + битые пиксели, привязанные к телу */
vec3 shade(float tone, float eyeM, vec2 anchor){
  vec3 toL=uLightPos-vW; float dist=length(toL); vec2 L=normalize(toL.xy+vec2(1e-4));
  vec2 n=normalize(vW.xy-uCtr.xy+vec2(1e-4)); float ndl=max(dot(n,L),0.);
  float att=sqrt(1.-smoothstep(0.,uLightR*2.4,dist));
  float lit=(0.35+0.65*ndl)*att;
  float inten=tone/6.*(0.62+0.75*lit*uExpo*0.55)*(0.85+0.3*uNear);
  float em=smoothstep(0.1,1.0,uEm);
  vec2 tx=floor(anchor);
  if(h21(tx*0.913+uSeedM*3.1) > em*1.05) inten=0.;                         /* проявление из тьмы — по пикселю */
  float fl=(h21(tx+floor(uTime*uFlickHz+uSeedM))-0.5)*uFlicker*1.4;
  if(tone>0. && h21(tx*1.37+uSeedM) > 0.16+1.2*inten-uBroken*0.25+fl) inten=0.;
  float idx=floor(clamp(inten,0.,1.)*6.+0.5);
  float fk=fogK(vW); vec3 col=palette(idx)*fk;
  if(eyeM>0.5){ float ea=smoothstep(0.,0.35,uEm)*uEmis*(0.8+0.2*sin(uTime*2.2+uSeedM)); float ei=floor((uBlink>0.5?2.:6.)*ea+0.5); if(ei>idx) col=palette(ei)*max(fk,0.8); }
  return col;
}`;
/* ---- боковая пасть: челюсти на шарнире, тело течёт волной ---- */
var MW_SIDE_FS=MW_COMMON+`
uniform vec2 uHinge;
void main(){
  vec2 t=vT;
  float back=clamp(t.x/uSize.x,0.,1.);
  t.y+=sin(t.x*0.07-uTime*1.9+uSeedM)*1.3*(1.-back*0.6);                    /* волна вдоль тела */
  t.x+=sin(t.y*0.05+uTime*1.3)*0.8*(1.-back);
  float aU=(1.-uOpen)*0.5, aL=(1.-uOpen)*0.52;                               /* uOpen=1 — поза эскиза */
  aU+=sin(uTime*7.0+uSeedM)*0.012*uOpen; aL-=sin(uTime*6.3)*0.012*uOpen;     /* дрожь челюстей */
  vec2 su=uHinge+rot2(t-uHinge,aU);                                         /* верх опускается */
  vec2 sl=uHinge+rot2(t-uHinge,-aL);                                        /* низ поднимается */
  vec4 cu=fetchT(su), cl=fetchT(sl);
  float tu=layer(cu.r), tl=layer(cl.g);
  if(tu<0. && tl<0.) discard;
  float tone=max(tu,tl); vec2 an=tu>=tl?su:sl; float eyeM=tu>=0.?cu.b:0.;
  if(eyeM>0.5 && uBlink>0.5 && abs(fract(su.y)-0.5)<0.6 && mod(floor(su.y),3.)!=1.) eyeM=0.;
  gl_FragColor=vec4(shade(tone,eyeM,an),1.0);
}`;
/* ---- фронтальная пасть: нижняя челюсть поднимается, плавники и шипы колышутся, глотка дышит ---- */
var MW_FRONT_FS=MW_COMMON+`
uniform vec2 uHead; uniform float uMouthY;
void main(){
  vec2 t=vT; vec2 r=t-uHead; float rl=length(r);
  float br=1.0+0.018*sin(uTime*1.2);                                         /* дыхание */
  t=uHead+r/br;
  float far=max(0.,rl-78.);                                                  /* плавники/шипы/усы за пределами головы */
  vec2 tang=vec2(-r.y,r.x)/max(rl,1.);
  t+=tang*sin(uTime*1.5-rl*0.055+uSeedM)*far*0.05;
  float drop=(1.-uOpen)*42.;
  vec2 sl=t+vec2(0.,drop); sl.x=uHead.x+(sl.x-uHead.x)*(1.+0.05*(1.-uOpen));    /* челюсть поднимается и чуть сжимается */
  sl+=vec2(0.,sin(uTime*6.5)*0.5*uOpen);
  vec4 cu=fetchT(t), cl=fetchT(sl);
  float tu=layer(cu.r), tl=layer(cl.g);
  /* глотка: кольца уходят вглубь */
  vec2 mc=vec2(uHead.x,uMouthY-10.); vec2 m=(t-mc)/vec2(48.,36.+20.*uOpen); float mr=length(m);
  float gul=0.;
  if(tu<0.&&tl<0.){ if(mr<1.0){ float ring=fract(log(max(mr,0.03))*2.4+uTime*0.5); gul= ring<0.14&&mr>0.15 ? 2. : 0.; } else discard; }
  float tone=max(max(tu,tl),gul); vec2 an=tu>=tl?t:sl;
  if(tu>=0. && tu<=2. && mr<1.1) tone=floor(tone*(0.6+0.6*sin(mr*9.-uTime*3.))+0.5);  /* пульс глотки */
  float eyeM=tu>=tl?cu.b:0.;
  gl_FragColor=vec4(shade(tone,eyeM,an),1.0);
}`;
function mwMat(tex,w,h,fs,extra){ return new THREE.ShaderMaterial({uniforms:Object.assign({},U,{tMaw:{value:tex},uSize:{value:new THREE.Vector2(w,h)},uOpen:{value:0},uEm:{value:0},uSeedM:{value:Math.random()*40},uBlink:{value:0},uNear:{value:1},uCtr:{value:new THREE.Vector3}},extra),vertexShader:MW_VS,fragmentShader:fs,side:THREE.DoubleSide}); }
/* ---------------- звук ---------------- */
var mwNoise=null;
function mwBuf(){ if(mwNoise)return mwNoise; let n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1; return mwNoise=b; }
function mwOn(){ return AC&&AC.state==="running"; }
function mwOut(pan){ let g=AC.createGain(); if(AC.createStereoPanner){ let p=AC.createStereoPanner(); p.pan.value=clamp(pan,-1,1); g.connect(p); p.connect(master);} else g.connect(master); return g; }

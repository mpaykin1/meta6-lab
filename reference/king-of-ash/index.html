@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  box-shadow:inset 0 0 0 2px rgba(242,182,50,.55),0 0 12px rgba(255,90,20,.25);cursor:pointer;display:grid;place-items:center;z-index:3}

  background:radial-gradient(ellipse at 50% 40%,rgba(40,10,20,.6),rgba(5,3,8,.94));font-family:var(--px);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}

.ov .sub{font-size:clamp(7px,1.9vmin,11px);color:var(--dim);line-height:1.8}

@media (max-width:520px){.moves{grid-template-columns:minmax(0,1fr)}}
.moves>div{display:flex;gap:.8em;align-items:center;min-width:0}

<script>
/* ===== 2D PIXEL ENGINE — reused unchanged from the previous 2D version (king, skeletons, fire, clouds, bone mounds, HUD, FX) ===== */
window.PX=(function(){
const SFX=new Proxy({},{get:()=>()=>{}});
let mode='hy';
/* ============ LOW-RES PIXEL CANVAS ============ */
const W=240,H=400;
const lc=document.createElement('canvas');lc.width=W;lc.height=H;
let g=lc.getContext('2d');g.imageSmoothingEnabled=false;
const C={st0:'#140f1c',st1:'#221a2e',st2:'#33293f',st3:'#463a56',st4:'#5e5072',
 f0:'#4a0c08',f1:'#9e1c0a',f2:'#ee4212',f3:'#ff8a1a',f4:'#ffd23a',f5:'#fff4b8',
 gd0:'#6b3d08',gd1:'#b8780f',gd2:'#f2b632',gd3:'#ffe788',
 bl0:'#0f1d55',bl1:'#1d3fa0',bl2:'#2f63d8',bl3:'#7aa4ff',
 ar0:'#34323f',ar1:'#666379',ar2:'#9c99b0',ar3:'#dcdaea',
 bn0:'#463f33',bn1:'#8d826a',bn2:'#c9bd9b',bn3:'#efe5c8',
 sk1:'#cf8150',sk2:'#eba675',hr1:'#5a3018',hr2:'#7a4422',
 red:'#ff3a24',rust:'#7d5a40',wood:'#6b4024',ban0:'#6a0e1c',ban1:'#a8172c',ban2:'#d8283a'};
let WHITE=false; // hit-flash override
function R(x,y,w,h,c){g.fillStyle=WHITE?'#fff':c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function L(x0,y0,x1,y1,t,c){g.fillStyle=WHITE?'#fff':c;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));const o=(t-1)>>1;
 for(let i=0;i<=n;i++)g.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,t,t)}
// local-space drawing (facing + scale)
let OX=0,OY=0,DIR=1,SC=1;
function RR(lx,ly,w,h,c){const x=DIR>0?OX+lx*SC:OX-(lx+w)*SC;R(x,OY+ly*SC,Math.max(1,Math.round(w*SC)),Math.max(1,Math.round(h*SC)),c)}
function LL(x0,y0,x1,y1,t,c){L(OX+x0*DIR*SC,OY+y0*SC,OX+x1*DIR*SC,OY+y1*SC,Math.max(1,Math.round(t*SC)),c)}
function WP(lx,ly){return [OX+lx*DIR*SC,OY+ly*SC]}

const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const damp=(k,dt)=>1-Math.exp(-k*dt);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function kf(K,t){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0]){const a=K[i-1],b=K[i];return a[1]+(b[1]-a[1])*ease((t-a[0])/(b[0]-a[0]))}}return K[K.length-1][1]}
function fl(x,T){return .5+.24*Math.sin(x*.31+T*4.1)+.16*Math.sin(x*.77-T*6.3)+.1*Math.sin(x*1.93+T*9.7)}

/* ============ PRERENDERED LAYERS (init only) ============ */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hsh(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
// Clouds (tileable 480 wide)
const CLW=480,clouds=[mk(CLW,170),mk(CLW,170)];
(function(){
 for(let L2=0;L2<2;L2++){const cv=clouds[L2],cx=cv.getContext('2d'),id=cx.createImageData(CLW,170),d=id.data;
  const pal=L2?[hex('#2a1022'),hex('#4a1626'),hex('#7a2420'),hex('#c2461c')]:[hex('#1b0c1c'),hex('#30122a'),hex('#4c1a2c'),hex('#80301e')];
  for(let y=0;y<170;y++)for(let x=0;x<CLW;x++){
   const u=x/CLW*TAU;let n=0;
   n+=Math.sin(u*2+L2*3+Math.sin(y*.05+u*3)*1.5)*.35+Math.sin(u*5+y*.09+L2)*.22+Math.sin(u*11-y*.15)*.12+Math.sin(u*23+y*.31)*.06;
   const band=1-Math.abs((y-(L2?70:95))/(L2?60:70));n+=band*.7-.35;
   if(n<0)continue;const dith=((x+y)&1)*.06;const lvl=clamp(Math.floor((n+dith)*5+ (y/170)*1.4),0,3);
   const i=(y*CLW+x)*4,p=pal[lvl];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}
  cx.putImageData(id,0,0);}
})();
// Colosseum: 3 curved tiers with transparent arches (fire shows through)
const COLW=300,COLH=240,COLY=70; // drawn at world y=COLY
const tierTop=[28,82,140],tierBot=[82,140,210];
const curve=x=>-46*Math.pow((x-150)/150,2);
const col=mk(COLW,COLH);const archRows=[];
(function(){
 const cx=col.getContext('2d'),id=cx.createImageData(COLW,COLH),d=id.data;
 const S=[hex(C.st0),hex(C.st1),hex(C.st2),hex(C.st3),hex(C.st4)];
 const put=(x,y,p)=>{if(x<0||y<0||x>=COLW||y>=COLH)return;const i=(y*COLW+x)*4;d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255};
 for(let x=0;x<COLW;x++){const cv=Math.round(curve(x));
  for(let t=0;t<3;t++){const top=tierTop[t]+cv,bot=tierBot[t]+cv+(t===2?-cv:0);const per=t===0?16:t===1?18:20,aw=t===0?8:10;
   for(let y=top;y<bot;y++){const ly=y-top;let lv=2;
    if(ly<4){lv=ly===0?4:3;if(ly===3)lv=1}
    else{const ax=((x+t*7)%per+per)%per,cxA=per/2,ar=aw/2,aTop=7,aBot=bot-top-4;
     const inX=Math.abs(ax-cxA+.5)<ar;const r2=Math.pow(ax-cxA+.5,2)+Math.pow(ly-aTop-ar,2);
     const hole=inX&&ly<aBot&&(ly>=aTop+ar||r2<ar*ar);
     if(hole)continue;
     const nearHole=Math.abs(ax-cxA+.5)<ar+1.2&&ly<aBot+1&&ly>aTop-1;
     const brick=((ly>>2)&1)?((x+3)%7===0):(x%7===0);const mortar=ly%4===0||brick;
     lv=mortar?1:2;if(hsh(x,y)>.82)lv=mortar?0:3;if(nearHole)lv=1;if(ly>=aBot&&ly<aBot+2)lv=3;
     if(ly>bot-top-3)lv=1;}
    put(x,y,S[lv]);}
   if(t===0){// battlements + spikes
    const top=tierTop[0]+cv;for(let y=top-6;y<top;y++){if(x%7<4)put(x,y,S[y===top-6?4:2])}
    if(x%21===3){for(let y=top-11;y<top-6;y++)put(x,y,S[1]);put(x,top-12,S[3])}}
   if(x%3===0)archRows.push({x,t,top:tierTop[t]+cv+7,bot:(t===2?tierBot[2]:tierBot[t]+cv)-4});
  }
  // pillars shading vertical
 }
 cx.putImageData(id,0,0);
})();
// Arena floor + bone mound
const floor=mk(COLW,130),FLY=280;
(function(){
 const cx=floor.getContext('2d'),id=cx.createImageData(COLW,130),d=id.data;
 const P=[hex('#0d0911'),hex('#18111e'),hex('#231a2b'),hex('#33263b'),hex('#4a3a4a')];
 for(let y=0;y<130;y++)for(let x=0;x<COLW;x++){const n=hsh(x>>1,y>>1)*.6+hsh(x,y)*.4;let lv=clamp(Math.floor(n*3+(y/130)*1.2),0,3);
  if(hsh(x*3,y*7)>.985)lv=4;const i=(y*COLW+x)*4,p=P[lv];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255}
 cx.putImageData(id,0,0);
 // scattered bones (pixel)
 const B=[C.bn0,C.bn1,C.bn2];
 for(let i=0;i<90;i++){const x=rnd(0,COLW),y=rnd(6,128),a=rnd(0,TAU),l=rnd(2,5),c=B[(Math.random()*3)|0];cx.fillStyle=c;
  for(let s=-l;s<=l;s++)cx.fillRect(Math.round(x+Math.cos(a)*s),Math.round(y+Math.sin(a)*s*.5),1,1)}
 for(let i=0;i<14;i++){const x=rnd(10,COLW-10)|0,y=rnd(20,125)|0;cx.fillStyle=C.bn1;cx.fillRect(x,y,4,3);cx.fillStyle='#120a0a';cx.fillRect(x+1,y+1,1,1);cx.fillRect(x+3,y+1,1,1)}
})();
const mound=mk(160,70);const moundSkulls=[];
(function(){
 const cx=mound.getContext('2d');
 for(let y=0;y<70;y++){const half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*78;
  for(let x=80-half;x<80+half;x++){const n=hsh(x>>1,y>>1);cx.fillStyle=n>.7?'#3a2c38':n>.4?'#2a1f2c':'#1c1520';cx.fillRect(x|0,y,1,1)}}
 for(let i=0;i<160;i++){const y=rnd(8,68),half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*74,x=rnd(80-half,80+half),a=rnd(0,TAU),l=rnd(2,6);
  cx.fillStyle=[C.bn0,C.bn1,C.bn2,C.bn1][(Math.random()*4)|0];for(let s=-l;s<=l;s++)cx.fillRect(Math.round(x+Math.cos(a)*s),Math.round(y+Math.sin(a)*s*.6),1,1)}
 for(let i=0;i<22;i++){const y=rnd(14,64)|0,half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*66,x=rnd(80-half,80+half-6)|0;
  cx.fillStyle=C.bn2;cx.fillRect(x,y,6,5);cx.fillStyle=C.bn3;cx.fillRect(x,y,6,1);cx.fillStyle=C.bn1;cx.fillRect(x+1,y+5,4,1);
  cx.fillStyle='#120808';cx.fillRect(x+1,y+2,2,2);cx.fillRect(x+4,y+2,1,2);
  if(i%3===0)moundSkulls.push({x:x,y:y,ph:Math.random()*10})}
})();

/* ============ PARTICLES & FX ============ */
let CELL=-1; // gallery cell tag
const parts=[],fxs=[],bones=[],sched=[];
function spark(x,y,n,spd,cols,add=true,life=.35,grav=200){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.3,1)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.2,life:rnd(.6,1)*life,max:life,c:cols[(Math.random()*cols.length)|0],s:Math.random()<.3?2:1,add,grav,cell:CELL})}}
function ember(x,y,cell=CELL){parts.push({x,y,vx:rnd(-6,6),vy:rnd(-30,-12),life:rnd(1.5,3.5),max:3.5,c:[C.f3,C.f4,C.f2,C.f5][(Math.random()*4)|0],s:Math.random()<.15?2:1,add:true,grav:-4,wob:rnd(0,10),cell})}
function smoke(x,y,cell=CELL){parts.push({x,y,vx:rnd(-3,3)+4,vy:rnd(-14,-6),life:rnd(2,4),max:4,c:'#1a1218',s:rnd(3,6)|0,add:false,grav:-2,smoke:1,cell})}
function boneBurst(x,y,sc=1,big=false){
 const n=big?10:7;
 for(let i=0;i<n;i++)bones.push({x:x+rnd(-4,4),y,z:rnd(6,22)*sc,vx:rnd(-60,60),vy:rnd(-12,12),vz:rnd(80,200),a:rnd(0,TAU),va:rnd(-14,14),l:(i===0?0:rnd(2,5)*sc),skull:i===0,life:6,cell:CELL,sc});
 spark(x,y-14*sc,10,90,[C.bn3,C.bn2,C.f4]);
}
function addFx(o){o.cell=CELL;o.t=0;fxs.push(o);return o}
function genBolt(x0,y0,x1,y1,depth=5,disp=26){let pts=[[x0,y0],[x1,y1]];

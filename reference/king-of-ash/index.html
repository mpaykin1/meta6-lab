<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Король Пепла (Copy)</title>

<style>
:root{
  /* Layout: one portrait pixel stage, letterboxed; HTML HUD floats over the WebGL post pass */
  --void:#08050c; --ink:#f4e6c8; --ember:#ff7a1c; --gold:#f2b632; --blood:#d8283a; --dim:#8a7d9c;
  --px:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;pointer-events:none;font-family:var(--px);text-shadow:0 2px 0 #000,0 0 8px rgba(255,90,20,.55)}
#score{top:calc(3% + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:clamp(10px,2.4vmin,15px);color:var(--ink);display:flex;gap:.5em;align-items:center}
#score svg{width:1.3em;height:1.3em}
#combo{right:5%;top:22%;font-size:clamp(14px,4.4vmin,26px);color:var(--gold);opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#call{left:0;right:0;top:36%;text-align:center;font-size:clamp(13px,4vmin,24px);color:var(--ink);opacity:0;letter-spacing:.06em}
#call.go{animation:call .9s cubic-bezier(.2,.8,.2,1)}
@keyframes call{0%{opacity:0;transform:scale(1.5);filter:blur(3px)}15%{opacity:1;transform:scale(1);filter:none}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.btn{position:absolute;width:clamp(34px,8vmin,46px);height:clamp(34px,8vmin,46px);border:0;padding:0;background:rgba(20,12,28,.55);
  border-radius:6px;box-shadow:inset 0 0 0 2px rgba(242,182,50,.55),0 0 12px rgba(255,90,20,.25);cursor:pointer;pointer-events:auto;display:grid;place-items:center}
.btn svg{width:62%;height:62%;image-rendering:pixelated}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bGal{top:calc(2.5% + env(safe-area-inset-top,0px));right:3%}
#bHelp{top:calc(2.5% + env(safe-area-inset-top,0px));right:calc(5% + clamp(34px,8vmin,46px))}
#bPrev{left:3%;top:calc(2.5% + env(safe-area-inset-top,0px))}
#bNext{left:calc(5% + clamp(34px,8vmin,46px));top:calc(2.5% + env(safe-area-inset-top,0px))}
#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}
#labels div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:3%;font-family:var(--px);font-size:clamp(6px,1.55vmin,10px);
  color:var(--ink);text-align:center;line-height:1.35;text-shadow:0 1px 0 #000;padding-inline:4px}
#labels i{display:block;font-style:normal;color:var(--gold);font-size:.85em}
#pageNo{left:50%;transform:translateX(-50%);top:calc(4% + env(safe-area-inset-top,0px));font-size:clamp(8px,2vmin,12px);color:var(--dim)}
[hidden]{display:none!important}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;
  background:radial-gradient(ellipse at 50% 40%,rgba(40,10,20,.55),rgba(5,3,8,.92));font-family:var(--px);text-align:center;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:auto}
#start{animation:fadeIn 1.6s ease}
@keyframes fadeIn{from{background:#000}}
.ov h1{margin:0;font-size:clamp(18px,6.2vmin,40px);color:var(--gold);text-shadow:0 3px 0 #5a1608,0 0 22px rgba(255,120,20,.7);letter-spacing:.04em;text-wrap:balance;line-height:1.3}
.ov .sub{font-size:clamp(7px,1.9vmin,11px);color:var(--dim);line-height:1.8}
.moves{display:grid;grid-template-columns:auto 1fr;gap:.75em 1em;align-items:center;text-align:left;font-size:clamp(7px,1.85vmin,11px);line-height:1.5;max-width:30em}
.moves svg{width:clamp(22px,5vmin,32px);height:clamp(22px,5vmin,32px)}
.moves b{color:var(--ink);font-weight:400}
.moves span{color:var(--dim)}
.moves .two b{color:#9fb6ff}
.go{font-size:clamp(9px,2.4vmin,14px);color:var(--ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#ghost{position:absolute;width:9%;aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity .6s}
#ghost.on{opacity:.75}
@media (prefers-reduced-motion:reduce){#call.go,.go,#start{animation:none}}
</style>

<div id="stage">
  <canvas id="gl" aria-label="Игровое поле: король на арене против скелетов"></canvas>
  <div id="labels" hidden></div>
  <div id="score" class="hud"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#ece2c4" d="M1 1h6v4H6v2H2V5H1z"/><path fill="#140a08" d="M2 3h2v1H2zM5 3h1v1H5zM3 6h1v1H3zM5 6h0"/><path fill="#ff3324" d="M2 3h1v1H2zM5 3h1v1H5z"/></svg><span id="sc">0</span></div>
  <div id="combo" class="hud">x0</div>

  <button class="btn" id="bHelp" aria-label="Список приёмов"><svg viewBox="0 0 10 12" shape-rendering="crispEdges"><path fill="#f2b632" d="M3 0h2v5h1V3h2v2h1v1h1v4H9v2H3v-2H2V8H1V6h2z"/></svg></button>

  <button class="btn" id="bPrev" aria-label="Предыдущая страница" hidden><svg viewBox="0 0 6 8" shape-rendering="crispEdges"><path fill="#f2b632" d="M3 0h2v2H4v1H3v2h1v1h1v2H3V7H2V6H1V2h1V1h1z"/></svg></button>
  <button class="btn" id="bNext" aria-label="Следующая страница" hidden><svg viewBox="0 0 6 8" shape-rendering="crispEdges"><path fill="#f2b632" d="M1 0h2v1h1v1h1v4H4v1H3v1H1V6h1V5h1V3H2V2H1z"/></svg></button>

  </div>
  <div id="start" class="ov">
    <h1>Король<br>Пепла</h1>
    <div class="sub">ассет‑пак · арена · скелеты</div>
    <div class="moves" id="movesList0"></div>
    <div class="go">коснись, чтобы начать</div>
  </div>
</div>

<script>
"use strict";
/* ============ GESTURE GLYPHS for help ============ */
const GLYPH={
 tap:'<circle cx="8" cy="8" r="3" fill="#f2b632"/><circle cx="8" cy="8" r="6" fill="none" stroke="#f2b632" stroke-width="1" opacity=".5"/>',
 lr:'<path d="M1 8h14M4 5 1 8l3 3M12 5l3 3-3 3" stroke="#f2b632" stroke-width="2" fill="none"/>',
 up:'<path d="M8 15V1M5 4l3-3 3 3" stroke="#f2b632" stroke-width="2" fill="none"/>',
 dn:'<path d="M8 1v14M5 12l3 3 3-3" stroke="#f2b632" stroke-width="2" fill="none"/>',
 circ:'<path d="M13 8a5 5 0 1 1-2-4" stroke="#f2b632" stroke-width="2" fill="none"/><path d="M9 2h3v3" stroke="#f2b632" stroke-width="2" fill="none"/>',
 hold:'<circle cx="8" cy="8" r="3" fill="#f2b632"/><path d="M8 2a6 6 0 1 1-6 6" stroke="#f2b632" stroke-width="2" fill="none"/>',
 up2:'<path d="M5 15V2M11 15V2M2 5l3-3 3 3M8 5l3-3 3 3" stroke="#9fb6ff" stroke-width="2" fill="none"/>',
 dn2:'<path d="M5 1v13M11 1v13M2 11l3 3 3-3M8 11l3 3 3-3" stroke="#9fb6ff" stroke-width="2" fill="none"/>',
 lr2:'<path d="M1 5h14M1 11h14M12 2l3 3-3 3M12 8l3 3-3 3" stroke="#9fb6ff" stroke-width="2" fill="none"/>',
 pinch:'<path d="M1 1l5 5M15 1l-5 5M1 15l5-5M15 15l-5-5" stroke="#9fb6ff" stroke-width="2" fill="none"/><circle cx="8" cy="8" r="2" fill="#9fb6ff"/>'
};
const MOVE_INFO=[
 ['tap','Выпад','тап'],['lr','Рубящий взмах','свайп влево/вправо'],['up','Апперкот','свайп вверх — подбрасывает'],
 ['dn','Удар сверху','свайп вниз — волна по земле'],['circ','Вихрь','круг пальцем'],['hold','Блок → контрудар','удержание и отпустить'],
 ['up2','Гнев небес','2 пальца вверх — молнии'],['dn2','Раскол земли','2 пальца вниз — огненная трещина'],
 ['lr2','Королевская волна','2 пальца вбок — золотой серп'],['pinch','Эгида короны','щипок 2 пальцами — купол']];
for(const id of ['movesList','movesList0']){
 document.getElementById(id).innerHTML=MOVE_INFO.map(m=>`<svg viewBox="0 0 16 16">${GLYPH[m[0]]}</svg><div class="${m[0].endsWith('2')||m[0]==='pinch'?'two':''}"><b>${m[1]}</b><br><span>${m[2]}</span></div>`).join('');
}

/* ============ LOW-RES PIXEL CANVAS ============ */
const W=240,H=400;
const lc=document.createElement('canvas');lc.width=W;lc.height=H;
const g=lc.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;
const C={st0:'#140f1c',st1:'#221a2e',st2:'#33293f',st3:'#463a56',st4:'#5e5072',
 f0:'#4a0c08',f1:'#9e1c0a',f2:'#ee4212',f3:'#ff8a1a',f4:'#ffd23a',f5:'#fff4b8',
 gd0:'#6b3d08',gd1:'#b8780f',gd2:'#f2b632',gd3:'#ffe788',
 bl0:'#0f1d55',bl1:'#1d3fa0',bl2:'#2f63d8',bl3:'#7aa4ff',
 ar0:'#34323f',ar1:'#666379',ar2:'#9c99b0',ar3:'#dcdaea',
 bn0:'#463f33',bn1:'#8d826a',bn2:'#c9bd9b',bn3:'#efe5c8',
 sk1:'#cf8150',sk2:'#eba675',hr1:'#5a3018',hr2:'#7a4422',
 red:'#ff3a24',rust:'#7d5a40',wood:'#6b4024',ban0:'#6a0e1c',ban1:'#a8172c',ban2:'#d8283a'};
let WHITE=false; // hit-flash override
function R(x,y,w,h,c){g.fillStyle=WHITE?'#fff':c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function L(x0,y0,x1,y1,t,c){g.fillStyle=WHITE?'#fff':c;const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));const o=(t-1)>>1;
 for(let i=0;i<=n;i++)g.fillRect(Math.round(x0+dx*i/n)-o,Math.round(y0+dy*i/n)-o,t,t)}
// local-space drawing (facing + scale)
let OX=0,OY=0,DIR=1,SC=1;
function RR(lx,ly,w,h,c){const x=DIR>0?OX+lx*SC:OX-(lx+w)*SC;R(x,OY+ly*SC,Math.max(1,Math.round(w*SC)),Math.max(1,Math.round(h*SC)),c)}
function LL(x0,y0,x1,y1,t,c){L(OX+x0*DIR*SC,OY+y0*SC,OX+x1*DIR*SC,OY+y1*SC,Math.max(1,Math.round(t*SC)),c)}
function WP(lx,ly){return [OX+lx*DIR*SC,OY+ly*SC]}

const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const damp=(k,dt)=>1-Math.exp(-k*dt);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function kf(K,t){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0]){const a=K[i-1],b=K[i];return a[1]+(b[1]-a[1])*ease((t-a[0])/(b[0]-a[0]))}}return K[K.length-1][1]}
function fl(x,T){return .5+.24*Math.sin(x*.31+T*4.1)+.16*Math.sin(x*.77-T*6.3)+.1*Math.sin(x*1.93+T*9.7)}

/* ============ PRERENDERED LAYERS (init only) ============ */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hsh(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
// Clouds (tileable 480 wide)
const CLW=480,clouds=[mk(CLW,170),mk(CLW,170)];
(function(){
 for(let L2=0;L2<2;L2++){const cv=clouds[L2],cx=cv.getContext('2d'),id=cx.createImageData(CLW,170),d=id.data;
  const pal=L2?[hex('#2a1022'),hex('#4a1626'),hex('#7a2420'),hex('#c2461c')]:[hex('#1b0c1c'),hex('#30122a'),hex('#4c1a2c'),hex('#80301e')];
  for(let y=0;y<170;y++)for(let x=0;x<CLW;x++){
   const u=x/CLW*TAU;let n=0;
   n+=Math.sin(u*2+L2*3+Math.sin(y*.05+u*3)*1.5)*.35+Math.sin(u*5+y*.09+L2)*.22+Math.sin(u*11-y*.15)*.12+Math.sin(u*23+y*.31)*.06;
   const band=1-Math.abs((y-(L2?70:95))/(L2?60:70));n+=band*.7-.35;
   if(n<0)continue;const dith=((x+y)&1)*.06;const lvl=clamp(Math.floor((n+dith)*5+ (y/170)*1.4),0,3);
   const i=(y*CLW+x)*4,p=pal[lvl];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;}
  cx.putImageData(id,0,0);}
})();
// Colosseum: 3 curved tiers with transparent arches (fire shows through)
const COLW=300,COLH=240,COLY=70; // drawn at world y=COLY
const tierTop=[28,82,140],tierBot=[82,140,210];
const curve=x=>-46*Math.pow((x-150)/150,2);
const col=mk(COLW,COLH);const archRows=[];
(function(){
 const cx=col.getContext('2d'),id=cx.createImageData(COLW,COLH),d=id.data;
 const S=[hex(C.st0),hex(C.st1),hex(C.st2),hex(C.st3),hex(C.st4)];
 const put=(x,y,p)=>{if(x<0||y<0||x>=COLW||y>=COLH)return;const i=(y*COLW+x)*4;d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255};
 for(let x=0;x<COLW;x++){const cv=Math.round(curve(x));
  for(let t=0;t<3;t++){const top=tierTop[t]+cv,bot=tierBot[t]+cv+(t===2?-cv:0);const per=t===0?16:t===1?18:20,aw=t===0?8:10;
   for(let y=top;y<bot;y++){const ly=y-top;let lv=2;
    if(ly<4){lv=ly===0?4:3;if(ly===3)lv=1}
    else{const ax=((x+t*7)%per+per)%per,cxA=per/2,ar=aw/2,aTop=7,aBot=bot-top-4;
     const inX=Math.abs(ax-cxA+.5)<ar;const r2=Math.pow(ax-cxA+.5,2)+Math.pow(ly-aTop-ar,2);
     const hole=inX&&ly<aBot&&(ly>=aTop+ar||r2<ar*ar);
     if(hole)continue;
     const nearHole=Math.abs(ax-cxA+.5)<ar+1.2&&ly<aBot+1&&ly>aTop-1;
     const brick=((ly>>2)&1)?((x+3)%7===0):(x%7===0);const mortar=ly%4===0||brick;
     lv=mortar?1:2;if(hsh(x,y)>.82)lv=mortar?0:3;if(nearHole)lv=1;if(ly>=aBot&&ly<aBot+2)lv=3;
     if(ly>bot-top-3)lv=1;}
    put(x,y,S[lv]);}
   if(t===0){// battlements + spikes
    const top=tierTop[0]+cv;for(let y=top-6;y<top;y++){if(x%7<4)put(x,y,S[y===top-6?4:2])}
    if(x%21===3){for(let y=top-11;y<top-6;y++)put(x,y,S[1]);put(x,top-12,S[3])}}
   if(x%3===0)archRows.push({x,t,top:tierTop[t]+cv+7,bot:(t===2?tierBot[2]:tierBot[t]+cv)-4});
  }
  // pillars shading vertical
 }
 cx.putImageData(id,0,0);
})();
// Arena floor + bone mound
const floor=mk(COLW,130),FLY=280;
(function(){
 const cx=floor.getContext('2d'),id=cx.createImageData(COLW,130),d=id.data;
 const P=[hex('#0d0911'),hex('#18111e'),hex('#231a2b'),hex('#33263b'),hex('#4a3a4a')];
 for(let y=0;y<130;y++)for(let x=0;x<COLW;x++){const n=hsh(x>>1,y>>1)*.6+hsh(x,y)*.4;let lv=clamp(Math.floor(n*3+(y/130)*1.2),0,3);
  if(hsh(x*3,y*7)>.985)lv=4;const i=(y*COLW+x)*4,p=P[lv];d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255}
 cx.putImageData(id,0,0);
 // scattered bones (pixel)
 const B=[C.bn0,C.bn1,C.bn2];
 for(let i=0;i<90;i++){const x=rnd(0,COLW),y=rnd(6,128),a=rnd(0,TAU),l=rnd(2,5),c=B[(Math.random()*3)|0];cx.fillStyle=c;
  for(let s=-l;s<=l;s++)cx.fillRect(Math.round(x+Math.cos(a)*s),Math.round(y+Math.sin(a)*s*.5),1,1)}
 for(let i=0;i<14;i++){const x=rnd(10,COLW-10)|0,y=rnd(20,125)|0;cx.fillStyle=C.bn1;cx.fillRect(x,y,4,3);cx.fillStyle='#120a0a';cx.fillRect(x+1,y+1,1,1);cx.fillRect(x+3,y+1,1,1)}
})();
const mound=mk(160,70);const moundSkulls=[];
(function(){
 const cx=mound.getContext('2d');
 for(let y=0;y<70;y++){const half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*78;
  for(let x=80-half;x<80+half;x++){const n=hsh(x>>1,y>>1);cx.fillStyle=n>.7?'#3a2c38':n>.4?'#2a1f2c':'#1c1520';cx.fillRect(x|0,y,1,1)}}
 for(let i=0;i<160;i++){const y=rnd(8,68),half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*74,x=rnd(80-half,80+half),a=rnd(0,TAU),l=rnd(2,6);
  cx.fillStyle=[C.bn0,C.bn1,C.bn2,C.bn1][(Math.random()*4)|0];for(let s=-l;s<=l;s++)cx.fillRect(Math.round(x+Math.cos(a)*s),Math.round(y+Math.sin(a)*s*.6),1,1)}
 for(let i=0;i<22;i++){const y=rnd(14,64)|0,half=Math.sqrt(Math.max(0,1-Math.pow((70-y)/70,1.6)))*66,x=rnd(80-half,80+half-6)|0;
  cx.fillStyle=C.bn2;cx.fillRect(x,y,6,5);cx.fillStyle=C.bn3;cx.fillRect(x,y,6,1);cx.fillStyle=C.bn1;cx.fillRect(x+1,y+5,4,1);
  cx.fillStyle='#120808';cx.fillRect(x+1,y+2,2,2);cx.fillRect(x+4,y+2,1,2);
  if(i%3===0)moundSkulls.push({x:x,y:y,ph:Math.random()*10})}
})();

/* ============ AUDIO (procedural) ============ */
let AC=null,NB=null,MASTER=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.55;MASTER.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const U={};for(const n of ['uT','uAb','uGl','uFl','uGr','uBl','uRes'])U[n]=gl.getUniformLocation(prog,n);
function resize(){const vw=innerWidth,vh=innerHeight;let w=vh*W/H,h=vh;if(w>vw){w=vw;h=vw*H/W}
 stage.style.width=w+'px';stage.style.height=h+'px';const dpr=Math.min(2,devicePixelRatio||1)*.8;glc.width=Math.round(w*dpr);glc.height=Math.round(h*dpr);gl.viewport(0,0,glc.width,glc.height);
 const r=glc.getBoundingClientRect();rect={l:r.left,t:r.top,w:r.width,h:r.height};gl.uniform2f(U.uRes,glc.width,glc.height)}
addEventListener('resize',resize);resize();

/* ============ LOOP ============ */
let mode='start',last=performance.now(),T=0,ghostT=0;
const ghost=document.getElementById('ghost');
resetGame();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 // post params ease back
 POST.ab+=(.0015-POST.ab)*damp(4,dt);POST.glitch=Math.max(0,POST.glitch-dt*1.8);POST.flash=Math.max(0,POST.flash-dt*2.2);
 shakeAmt*=Math.exp(-dt*9);POST.shakeX=Math.round((Math.random()-.5)*shakeAmt);POST.shakeY=Math.round((Math.random()-.5)*shakeAmt*.6);
 if(mode==='gallery'){updParticles(dt);galleryFrame(dt,T)}
 else{
  let wdt=dt;if(hitT>0){hitT-=dt;wdt=dt*.06}
  holdCheck();
  if(mode==='game'||mode==='start'){
   const game=mode==='game';
   kingUpdate(K,wdt,T,true);
   if(game){spawnT-=wdt;if(spawnT<=0){spawnEnemy();spawnT=Math.max(.9,2.6-score*.04)}}
   for(const e of enemies)enemyUpdate(e,wdt,T,K,game);
   // separation
   for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy*1.4)||1;if(d<12){const p=(12-d)*.5;a.x-=dx/d*p*wdt*8;b.x+=dx/d*p*wdt*8}}
   enemies=enemies.filter(e=>!e.dead);
   updParticles(wdt);
   comboT-=dt;if(comboT<=0&&combo){combo=0;comboEl.classList.remove('on')}
   document.getElementById('sc').textContent=score;
   // ambient life
   if(Math.random()<dt*28)ember(rnd(0,300),rnd(150,300),-1);if(Math.random()<dt*3)smoke(rnd(0,300),rnd(40,110),-1);
   lightT-=dt;if(lightT<=0){lightT=rnd(3,7);const x=rnd(30,210);ambBolt={k:'bolt',b:genBolt(x,-5,x+rnd(-40,40),rnd(60,110),5,20),t:0,life:.35};POST.flash=Math.max(POST.flash,.32);SFX.thunder(rnd(.1,.5))}
   if(ambBolt){ambBolt.t+=dt;if(ambBolt.t>ambBolt.life)ambBolt=null}
   // camera inertia
   const tcx=(K.x-150)*.35+Math.sin(T*.31)*3+Math.sin(T*.17)*2,tcy=Math.sin(T*.23)*2;camX+=(tcx-camX)*damp(2.2,dt);camY+=(tcy-camY)*damp(1.6,dt);
   // idle ghost hint
   if(game&&performance.now()-lastInput>7000){ghostT+=dt;ghost.classList.add('on');const ph=ghostT%3;const sx=.5+(ph<1.5?Math.sin(ph/1.5*Math.PI)*.18:0),sy=.72-(ph>=1.5?Math.sin((ph-1.5)/1.5*Math.PI)*.15:0);ghost.style.left=(sx*100)+'%';ghost.style.top=(sy*100)+'%'}
   else{ghost.classList.remove('on');ghostT=0}
  }
  drawBackground(T);
  g.setTransform(1,0,0,1,-Math.round(30+camX)+POST.shakeX,-Math.round(camY)+POST.shakeY);
  drawParticles(-1,T);
  const ents=[...enemies.map(e=>({y:e.y,e})),{y:K.y+.5,k:K}].sort((a,b)=>a.y-b.y);
  for(const o of ents){if(o.k)drawKing(K,T);else drawEnemy(o.e,T)}
  drawAdd(-1,T);g.globalCompositeOperation='lighter';drawKingAdd(K,T);
  // eye glow halos
  for(const e of enemies){const x=e.x+e.dir*1*e.sc,y=e.y-e.alt-(e.type==='fly'?8:24*e.sc);g.globalAlpha=.25+.15*Math.sin(T*9+e.seed);R(x-2,y-1,5,3,C.f1)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  drawHUD(T);
 }
 // upload + post
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,lc);
 gl.uniform1f(U.uT,T);gl.uniform1f(U.uAb,POST.ab);gl.uniform1f(U.uGl,POST.glitch+(K&&K.hp===1?.08:0));gl.uniform1f(U.uFl,POST.flash);gl.uniform1f(U.uGr,.055);gl.uniform1f(U.uBl,1.+(K&&K.mv&&MOVES[K.mv].ult?.6:0));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
requestAnimationFrame(frame);

/* ============ UI wiring ============ */
const $=id=>document.getElementById(id);
$('start').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();$('start').hidden=true;mode='game';resetGame();lastInput=performance.now();callout('В бой!')});
$('bHelp').addEventListener('click',()=>{if(mode==='gallery')return;$('help').hidden=false;mode='help'});
$('help').addEventListener('pointerdown',e=>{e.preventDefault();$('help').hidden=true;mode='game';lastInput=performance.now()});
function setGallery(on){mode=on?'gallery':'game';$('labels').hidden=!on;$('bPrev').hidden=!on;$('bNext').hidden=!on;$('pageNo').hidden=!on;$('score').hidden=on;$('bHelp').hidden=on;
 $('bGal').innerHTML=on?'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#f2b632" d="M6 0h2v2H7v1H6v1H5v1H4v1H3v1H2v1H0V6h1V5h2V4h1V3h1V2h1z"/><path fill="#b8780f" d="M0 5h1v1h1v1h1v1H2V7H1V6H0z"/></svg>':'<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#f2b632" d="M0 0h3v3H0zM5 0h3v3H5zM0 5h3v3H0zM5 5h3v3H5z"/></svg>';
 $('bGal').setAttribute('aria-label',on?'Вернуться в бой':'Каталог ассетов');
 if(on){page=0;buildGallery()}else{parts.length=0;fxs.length=0;bones.length=0;sched.length=0;CELL=-1;resetGame()}}
$('bGal').addEventListener('click',()=>{audioInit();$('start').hidden=true;$('help').hidden=true;setGallery(mode!=='gallery')});
$('bPrev').addEventListener('click',()=>{page=(page+1)%2;buildGallery()});
$('bNext').addEventListener('click',()=>{page=(page+1)%2;buildGallery()});
</script>

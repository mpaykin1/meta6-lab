<!DOCTYPE html>

<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%;font-family:"Courier New",monospace;}

  #panel.hidden{opacity:0;transform:translateY(-10px) scale(.96);pointer-events:none;}
  #menuBtn{position:fixed;right:12px;top:12px;z-index:11;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;line-height:40px;text-align:center;color:rgba(255,236,190,.9);background:rgba(0,0,0,.45);border:1px solid rgba(255,220,150,.35);box-shadow:0 0 18px rgba(255,200,110,.18);backdrop-filter:blur(6px);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .3s;}
  #menuBtn:hover{box-shadow:0 0 26px rgba(255,200,110,.35);}
  #menuBtn.open{transform:rotate(90deg);}
  #panel h3{margin:0 0 8px;font-size:13px;color:rgba(255,255,255,.88);font-weight:700;letter-spacing:.6px;text-shadow:0 0 10px rgba(255,255,255,.24);}
  #panel p{margin:4px 0 10px;font-size:10px;line-height:1.35;color:rgba(255,255,255,.42)}
  .row{margin:8px 0;}
  .row label{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.3;color:rgba(255,255,255,.62);}
  select,input,button{font:11px "Courier New",monospace;}
  select{width:100%;margin-top:4px;padding:7px 8px;border:1px solid rgba(255,255,255,.24);border-radius:8px;background:rgba(4,4,4,.92);color:rgba(255,255,255,.86);outline:none;}
  input[type="range"]{width:100%;accent-color:#fff;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}

  @media(max-width:700px){#panel{width:calc(100vw - 24px);max-height:calc(100vh - 74px)}.row{margin:6px 0}.grid{grid-template-columns:1fr 1fr 1fr}button{padding:7px 4px}#label{font-size:10px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const BOOT_PARAMS = null;
const clock = new THREE.Clock();
let W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1,2));
renderer.setSize(W,H);
renderer.setClearColor(0x000000,1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const maskScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28,W/H,0.1,100);
camera.position.set(0.2,-0.05,9.6);
camera.lookAt(0,0.0,0);
scene.add(new THREE.AmbientLight(0x1a2230,0.9));
const moon = new THREE.DirectionalLight(0x8fa8c8,0.35);moon.position.set(-30,60,20);scene.add(moon);
const rimLight = new THREE.PointLight(0xffffff,0.55,12);rimLight.position.set(0.5,1.2,4.5);scene.add(rimLight);

function $(id){return document.getElementById(id);} 
function rand(a,b){return a+Math.random()*(b-a);} 
function rngI(a,b){return Math.floor(rand(a,b+1));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pick(arr){return arr[rngI(0,arr.length-1)];}
function smooth01(x){return x*x*(3-2*x);} 
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1300);} 

const MAT = {
  black:new THREE.MeshBasicMaterial({color:0x030303,side:THREE.DoubleSide}),
  black2:new THREE.MeshBasicMaterial({color:0x050505,side:THREE.DoubleSide}),
  mask:new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}),
  blade:new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}),
  redEye:new THREE.MeshBasicMaterial({color:0xff4020}),
  orange:new THREE.MeshBasicMaterial({color:0xff7a18,transparent:true,opacity:.78,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}),
  blue:new THREE.MeshBasicMaterial({color:0x8fcfff,transparent:true,opacity:.70,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending})
};
function material(asMask, kind){
  if(asMask) return MAT.mask;
  if(kind==='blade') return MAT.blade;
  if(kind==='eye') return MAT.redEye;
  if(kind==='fire') return MAT.orange;
  if(kind==='blue') return MAT.blue;
  return kind==='soft'?MAT.black2:MAT.black;
}
function makeMaskMaterial(){return MAT.mask;}

/* ============ ПОТАЛЬ: общие uniform-«рычаги» ============ */
const SHARED={uTime:{value:0},uLight:{value:new THREE.Vector3(-.5,.6,.62).normalize()},uGlint:{value:0},uGoldAmt:{value:1}};
const GLSL_COMMON=`
float h11(float n){return fract(sin(n)*43758.5453);}
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 h22(vec2 p){float n=h21(p);return vec2(n,h21(p+n+19.19));}
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float vn3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*vn3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s/.875;}
vec3 voro(vec2 p){vec2 i=floor(p),f=fract(p);float d1=8.,d2=8.;vec2 id=vec2(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 r=g+h22(i+g)-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;id=i+g;}else if(d<d2)d2=d;}
 return vec3(sqrt(d2)-sqrt(d1),h21(id),h21(id+7.3));}
float lineAA(float d,float w){float fw=max(fwidth(d),1e-4);return 1.-smoothstep(w,w+fw*1.5,abs(d));}
/* металл: золото (steel=0) или полированная сталь (steel=1) — переливы, блики, отражения */
vec3 metalShade(vec3 N,vec3 V,vec3 L,float glint,float t,float steel){
 vec3 R=reflect(-V,N);
 float sky=pow(clamp(.5+.5*R.y,0.,1.),2.);
 float st1=pow(abs(sin(R.x*4.6+R.y*2.1+t*.42)),26.);
 float st2=pow(abs(sin(R.y*6.3-R.x*1.7-t*.31+1.3)),34.);
 float env=.08+.6*sky+.75*st1+.45*st2;
 float spec=pow(max(dot(R,L),0.),42.);
 float fres=pow(1.-clamp(dot(N,V),0.,1.),3.);
 float lam=.42+.8*max(dot(N,L),0.);
 vec3 d0=mix(vec3(.13,.055,.012),vec3(.05,.055,.065),steel);
 vec3 d1=mix(vec3(.84,.54,.15),vec3(.62,.66,.72),steel);
 vec3 d2=mix(vec3(1.,.88,.55),vec3(.95,.97,1.),steel);
 vec3 c=mix(d0,d1,clamp(env,0.,1.));
 c=mix(c,d2,clamp(env-.8,0.,1.)*.7+fres*.3);
 c*=lam;
 c+=mix(vec3(1.,.9,.68),vec3(1.),steel)*spec*(1.2+glint*3.);
 return c;
}`;
const GILD_VS=`
varying vec3 vP; varying vec3 vN; varying vec3 vObjN; varying vec3 vViewPos;
void main(){
 vec3 sc=vec3(length(modelMatrix[0].xyz),length(modelMatrix[1].xyz),length(modelMatrix[2].xyz));
 vP=position*sc; vObjN=normal;
 vec4 mv=modelViewMatrix*vec4(position,1.0);
 vViewPos=mv.xyz; vN=normalize(normalMatrix*normal);
 gl_Position=projectionMatrix*mv;
}`;
const GILD_FS=GLSL_COMMON+`
uniform float uTime,uRole,uSeed,uSteel,uCells,uHalfW,uGlint,uGoldAmt; uniform vec3 uLight;
varying vec3 vP; varying vec3 vN; varying vec3 vObjN; varying vec3 vViewPos;
void main(){
 vec3 P=vP;
 float rad=length(P.xz), ang=atan(P.x,P.z);
 vec2 cyl=vec2(ang*max(rad,.03),P.y);
 float fill=1.,groove=0.,hgt=0.,inlay=0.,isSkin=0.;
 if(uRole<.5){
  /* 2D: тонкие пятна потали на коже / ткани */
  isSkin=1.;
  float n=fbm3(P*3.2+uSeed*7.)+(vn3(P*26.+uSeed)-.5)*.2;
  float th=.70-.10*uGoldAmt;
  fill=smoothstep(th,th+.012,n);
  fill=max(fill,step(.985,h31(floor(P*55.+uSeed*3.))));
 } else if(uRole<1.5){
  /* ДОСПЕХ: пояса с бордюрами, внутри — завитки / ромбы / чешуя */
  float bandH=.36; float by=P.y/bandH; float bi=floor(by), bf=fract(by);
  float cx=ang/6.2831853*uCells+.5;
  float bt=mod(bi+floor(uSeed*3.),3.);
  if(bf<.13||bf>.87){
   float rl=bf<.5?bf/.13:(1.-bf)/.13;
   float bx=fract(cx*6.)-.5;
   float bead=lineAA(length(vec2(bx,(rl-.5)*.7))-.28,.07);
   groove=max(max(lineAA(rl-.95,.06),lineAA(rl-.05,.06)),bead);
   hgt=1.-groove;
  } else {
   float v=(bf-.13)/.74; vec2 q=vec2(fract(cx)-.5,v-.5);
   if(bt<.5){
    vec2 m=vec2(abs(q.x),q.y); vec2 s=m-vec2(.24,0.);
    float r=length(s), a=atan(s.y,s.x);
    float sp=lineAA(fract(a/6.2831853-r*3.2)-.5,.15)*(1.-smoothstep(.20,.24,r));
    float stem=lineAA(m.x,.035)*step(abs(q.y),.42);
    float arc=lineAA(length(m-vec2(0.,-.5))-.42,.035);
    float leaf=lineAA(length((m-vec2(.0,.3))*vec2(1.,2.2))-.1,.03);
    groove=max(max(sp,stem),max(arc,leaf)); hgt=.6-groove;
   } else if(bt<1.5){
    float dz=abs(q.x)+abs(q.y);
    float l1=lineAA(dz-.40,.06), l2=lineAA(dz-.22,.05);
    float dotc=1.-smoothstep(.06,.08,length(q));
    float riv=1.-smoothstep(.07,.09,length(abs(q)-vec2(.5)));
    fill=max(max(l1,l2),max(dotc,riv)); hgt=fill;
   } else {
    vec2 gs=vec2(cx*2.,v*3.); gs.x+=.5*mod(floor(gs.y),2.);
    vec2 sc=fract(gs)-vec2(.5,0.); float d=length(sc*vec2(1.,.85));
    groove=lineAA(d-.5,.05); hgt=1.-smoothstep(0.,.5,d)*.7-groove;
   }
  }
 } else if(uRole<2.5){
  /* ШЛЕМ: купол с рёбрами и завитками, гребень, налобный пояс, смотровая щель, нащёчники, наносник */
  vec3 np=normalize(P); float lat=np.y; float a=atan(np.x,np.z);
  if(lat>.30){
   float rq=fract(a/6.2831853*12.)-.5; float ribD=abs(rq);
   vec2 q=vec2(rq,fract(lat*5.)-.5); vec2 m=vec2(abs(q.x),q.y); vec2 s=m-vec2(.25,0.);
   float r=length(s), aa=atan(s.y,s.x);
   float sp=lineAA(fract(aa/6.2831853-r*3.)-.5,.14)*(1.-smoothstep(.2,.24,r));
   groove=max(sp,lineAA(ribD-.1,.025));
   hgt=lineAA(ribD,.08)-groove*.6;
   float crest=lineAA(np.x,.05);
   hgt=max(hgt,crest); groove*=1.-crest;
  } else if(lat>.15){
   float bx=fract(a/6.2831853*28.)-.5; float rl=(lat-.15)/.15;
   groove=max(lineAA(length(vec2(bx,(rl-.5)*.8))-.27,.07),max(lineAA(rl-.05,.06),lineAA(rl-.95,.06)));
   hgt=1.-groove;
  } else if(lat>-.07&&np.z>.2){
   fill=0.;
  } else {
   vec2 gs=vec2(a/6.2831853*26.,lat*9.); gs.x+=.5*mod(floor(gs.y),2.);
   vec2 sc=fract(gs)-vec2(.5,0.); float d=length(sc*vec2(1.,.85));
   groove=lineAA(d-.5,.06); hgt=1.-smoothstep(0.,.5,d)*.7-groove;
  }
  if(abs(np.x)<.07&&np.z>.55&&lat<.16&&lat>-.45){fill=1.;groove=lineAA(np.x,.012);hgt=1.-groove;}
 } else {
  /* ОРУЖИЕ: дол, плетёная лоза-инкрустация, кольца */
  float u=abs(vObjN.z)>.7?P.x:ang*max(rad,.01);
  float y=P.y, hw=max(uHalfW,.012), s=uSeed*6.2831;
  float v1=lineAA(u-.5*hw*sin(y*22.+s),.13*hw), v2=lineAA(u+.5*hw*sin(y*22.+s),.13*hw);
  float qy=fract((y*22.+s)/3.14159-.5)-.5;
  float eye=1.-smoothstep(.12*hw,.2*hw,length(vec2(u,qy*3.14159/22.)));
  if(uSteel>.5){
   inlay=max(max(v1,v2),eye);
   groove=lineAA(u,.09*hw)*(1.-inlay);
   hgt=inlay-groove;
  } else {
   groove=max(lineAA(fract(y*14.)-.5,.06),max(v1,v2));
   hgt=1.-groove;
  }
 }
 /* износ: где поталь осыпалась — видна чёрная основа, рваные светлые края */
 float wv=fbm3(P*4.6+uSeed*13.)+(vn3(P*34.+uSeed*5.)-.5)*.22;
 float wth=.56+.16*uGoldAmt;
 float miss=(isSkin>.5||uSteel>.5)?0.:smoothstep(wth,wth+.012,wv);
 float torn=miss*(1.-miss)*4.;
 float gold=fill*(1.-miss);
 /* кракелюр листов и стыки квадратных листов сусального золота */
 vec2 luv=isSkin>.5?P.xy+P.zz*.6:cyl;
 vec3 vr=voro(luv*15.+uSeed*3.);
 float crack=1.-smoothstep(0.,.07,vr.x);
 vec2 sq=luv/.26; sq.x+=floor(sq.y)*.37;
 vec2 sf=fract(sq); float seam=1.-smoothstep(0.,.035,min(sf.x,sf.y));
 float sheetTint=h21(floor(sq)+uSeed);
 /* рельеф гравировки через производные */
 vec3 N=normalize(vN);
 vec3 dpx=dFdx(vViewPos), dpy=dFdy(vViewPos);
 float hx=dFdx(hgt), hy=dFdy(hgt);
 vec3 r1=cross(dpy,N), r2=cross(N,dpx);
 float det=dot(dpx,r1);
 vec3 grd=sign(det)*(hx*r1+hy*r2)*.012;
 N=normalize(abs(det)*N-grd+N*1e-7);
 N=normalize(N+(vec3(vr.y,vr.z,.5)-.5)*.30*max(gold,inlay));
 vec3 V=normalize(-vViewPos);
 float glint=pow(vr.y,9.)*(.5+.5*sin(uTime*5.+vr.z*80.))+uGlint*.6;
 vec3 col;
 if(uSteel>.5){
  vec3 st=metalShade(N,V,uLight,glint,uTime,1.), gd=metalShade(N,V,uLight,glint,uTime,0.);
  col=mix(st,gd*(1.-crack*.4),inlay); col=mix(col,st*.28,groove);
 } else {
  vec3 g=metalShade(N,V,uLight,glint,uTime,0.);
  g*=mix(.86,1.12,sheetTint)*(1.+seam*.22)*(1.-crack*.45);
  col=mix(vec3(.012),g,gold);
  col=mix(col,g*.16+vec3(.015,.008,0.),groove*gold);
  col+=vec3(1.,.82,.45)*torn*fill*.55;
 }
 gl_FragColor=vec4(col,1.);
}`;
const _tmpV=new THREE.Vector3();
function roleForName(n){

function updateSparks(dt){for(let i=0;i<SPARK_MAX;i++){if(sparkLife[i]<=0)continue;sparkVel[i*3+1]-=9.8*dt*.5;sparkVel[i*3]*=.98;sparkVel[i*3+2]*=.98;sparkPos[i*3]+=sparkVel[i*3]*dt;sparkPos[i*3+1]+=sparkVel[i*3+1]*dt;sparkPos[i*3+2]+=sparkVel[i*3+2]*dt;sparkLife[i]-=dt*1.1;if(sparkLife[i]<0)sparkLife[i]=0;}sparkGeo.attributes.position.needsUpdate=true;sparkGeo.attributes.aLife.needsUpdate=true;}
function updateFireRings(dt,time){for(const r of fireRingPool){if(!r.active)continue;r.t+=dt;const dur=1.1,tt=Math.min(r.t/dur,1),scale=.2+tt*1.9;r.mesh.scale.setScalar(scale);r.mesh.material.uniforms.uAlpha.value=(1-tt)*1.2;r.mesh.material.uniforms.uTime.value=time;r.mesh.lookAt(camera.position);if(tt>=1){r.active=false;r.mesh.visible=false;}}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;postUniforms.uTime.value=time;SHARED.uTime.value=time;SHARED.uGlint.value*=Math.pow(.25,dt);const lx=-.62+.2*Math.sin(time*.23),ly=.78+.08*Math.sin(time*.31);postUniforms.uLight2.value.set(lx,ly).normalize();SHARED.uLight.value.set(lx*.8,ly*.8,.62).normalize();postUniforms.uPulse.value=SHARED.uGlint.value;if(isAnimating){globalTime+=dt*animSpeed;updateMotion(dt,globalTime);animateGeneratedParts(activeGroup,globalTime,animAmplitude);animateGeneratedParts(activeMaskGroup,globalTime,animAmplitude);}root.rotation.y=manualYaw;maskRoot.rotation.y=manualYaw;root.rotation.x=pitch;maskRoot.rotation.x=pitch;syncMaskTransform();root.updateMatrixWorld(true);updateFlakes(dt,time);updateTrail();updateSparks(dt);updateFireRings(dt,time);camShakeVel.multiplyScalar(.82);camShake.addScaledVector(camShakeVel,dt);camShake.multiplyScalar(.85);const baseZ=9.6;const desiredPos=new THREE.Vector3(0.2,-0.05,baseZ).add(camShake);camCurrentPos.lerp(desiredPos,.06);camera.position.copy(camCurrentPos);const desiredLook=(activeGroup?activeGroup.position.clone():new THREE.Vector3()).add(new THREE.Vector3(0,.05,0));camCurrentLook.lerp(desiredLook,.05);camera.lookAt(camCurrentLook);renderer.setRenderTarget(rtColor);renderer.setClearColor(0x000000,1);renderer.clear(true,true,true);renderer.render(scene,camera);renderer.setRenderTarget(rtMask);renderer.setClearColor(0x000000,1);renderer.clear(true,true,true);renderer.render(maskScene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);}
function download(name,type,text){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1200);}
function saveHTML(){const p=Object.assign({},currentParams||paramsFromUI());const src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const out=src.replace('const BOOT_PARAMS = null;','const BOOT_PARAMS = '+JSON.stringify(p)+';');download('silhouette_creature_generator_'+p.category+'.html','text/html;charset=utf-8',out);toast('HTML сохранён');}
function exportJSON(){const p=Object.assign({},currentParams||paramsFromUI());let object=null;try{object=activeGroup?activeGroup.toJSON():null;}catch(e){object={error:String(e)}}download('creature_asset_'+p.category+'.json','application/json;charset=utf-8',JSON.stringify({version:'silhouette-generator-v1',params:p,object},null,2));toast('JSON сохранён');}

$('menuBtn').addEventListener('click',()=>{const open=$('panel').classList.toggle('hidden')===false;$('menuBtn').classList.toggle('open',open);$('menuBtn').textContent=open?'✕':'⚙';});
$('newBtn').addEventListener('click',randomizeForClass);$('attackBtn').addEventListener('click',triggerAttack);$('toggleAnim').addEventListener('click',()=>{isAnimating=!isAnimating;$('toggleAnim').textContent=isAnimating?'⏸ Пауза':'▶ Пуск';});$('resetBtn').addEventListener('click',()=>{setUIFromParams({category:'flyinghero',rotation:0,speed:1,amplitude:1,body:1,wing:1,tail:1,weapon:1,detail:1,outline:1,gold:1});generate(paramsFromUI());});$('saveHtmlBtn').addEventListener('click',saveHTML);$('exportJsonBtn').addEventListener('click',exportJSON);
let regenTimer=0;['category','body','wing','tail','weapon','detail'].forEach(id=>$(id).addEventListener('input',()=>{updateLabels();clearTimeout(regenTimer);regenTimer=setTimeout(()=>generate(paramsFromUI(),true),70);}));
['rotation','speed','amplitude','outline','gold'].forEach(id=>$(id).addEventListener('input',()=>{updateLabels();const p=paramsFromUI();animSpeed=p.speed;animAmplitude=p.amplitude;manualYaw=p.rotation*Math.PI/180;postUniforms.uOutline.value=p.outline;SHARED.uGoldAmt.value=p.gold;currentParams=Object.assign(currentParams||{},p);}));
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture&&renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;manualYaw+=dx*.008;pitch=clamp(pitch+dy*.004,-.55,.55);$('rotation').value=((manualYaw*180/Math.PI)%360+360)%360;updateLabels();});
renderer.domElement.addEventListener('pointerup',e=>{drag=false;});
let downX=0,downY=0;renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('click',e=>{if(e.target!==renderer.domElement)return;if(Math.hypot(e.clientX-downX,e.clientY-downY)>8)return;if(!$('panel').classList.contains('hidden')){$('panel').classList.add('hidden');$('menuBtn').classList.remove('open');$('menuBtn').textContent='⚙';return;}triggerAttack();});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=clamp(camera.position.z+e.deltaY*.005,5.6,14.5);camCurrentPos.copy(camera.position);},{passive:false});
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);rtColor.dispose();rtMask.dispose();rtColor=new THREE.WebGLRenderTarget(Math.floor(W),Math.floor(H),{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});rtMask=new THREE.WebGLRenderTarget(Math.floor(W),Math.floor(H),{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});postUniforms.tColor.value=rtColor.texture;postUniforms.tMask.value=rtMask.texture;postUniforms.uResolution.value.set(W,H);});
if(BOOT_PARAMS){setUIFromParams(BOOT_PARAMS);generate(BOOT_PARAMS,true);}else{setUIFromParams({category:'flyinghero',rotation:0,speed:1,amplitude:1,body:1,wing:1,tail:1,weapon:1,detail:1,outline:1,gold:1});generate(paramsFromUI(),true);}animate();
})();
</script>

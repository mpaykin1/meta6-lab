function home(){app.innerHTML='<div class="chip">АВТОРСКИЙ ОПРОСНИК · 18+</div><h1>Твоя роль в создании нового мира</h1><p>Исследуйте свои интересы, ценности, особенности и творческое самовосприятие. Узнайте, какие способы участия в совместных проектах вам ближе.</p><div class="panel"><label class="check"><input type="checkbox" id="agree" '+(consent?'checked':'')+'><span>Мне исполнилось 18 лет. Я добровольно прохожу исследовательский опросник и понимаю, что это не диагностика. Ответы остаются в памяти этой страницы; сервер их не получает.</span></label><button id="short" class="primary" '+(!consent?'disabled':'')+'>Экспресс · 30 вопросов · ~5 минут</button><button id="long" '+(!consent?'disabled':'')+'>Расширенный · 120 вопросов · ~20 минут</button></div><details><summary>Научная основа и ограничения</summary><p>Авторские утверждения, вдохновлённые шестью моделями, не являются оригинальными стандартизованными методиками. 30 показателей: пять черт, четыре группы ценностей, три потребности, шесть интересов, десять выбранных сильных сторон и два аспекта творческого Я. Нет норм, установленной надёжности или валидности. Экспресс-версия содержит лишь одно утверждение на показатель. Роли — авторские гипотезы для саморефлексии, не классификация пригодности. Не используйте результаты для найма, диагностики или отбора участников.</p><p><a href="https://ipip.ori.org/">Big Five / IPIP</a> · <a href="https://doi.org/10.9707/2307-0919.1116">Шварц</a> · <a href="https://selfdeterminationtheory.org/the-theory/">SDT</a> · <a href="https://www.onetcenter.org/reports/IP_Manual.html">RIASEC</a> · <a href="https://www.viacharacter.org/character-strengths-via">VIA</a> · <a href="https://www.creativity-lab.pl/resources">SSCS</a></p></details>';document.querySelector('#agree').onchange=e=>{consent=e.target.checked;document.querySelector('#short').disabled=document.querySelector('#long').disabled=!consent};document.querySelector('#short').onclick=()=>start(30);document.querySelector('#long').onclick=()=>start(120)}
function start(n){mode=n;qs=make(n);ans=Array(n).fill(null);idx=0;question()}
function question(){let q=qs[idx];app.innerHTML='<div class="row"><small>Вопрос '+(idx+1)+' из '+qs.length+'</small><small>'+Math.round(idx/qs.length*100)+'%</small></div><div class="track"><div class="fill" style="width:'+idx/qs.length*100+'%"></div></div><div class="panel"><div class="chip">'+q.g+'</div><h2>'+q.t+'</h2><div id="choices">'+labels.map((l,i)=>'<button aria-pressed="'+(ans[idx]===i+1)+'" data-v="'+(i+1)+'">'+l+'</button>').join('')+'</div><p class="muted">Выберите ответ, наиболее близкий вашему опыту.</p></div><div class="row"><button id="back">← Назад</button><button id="next" class="primary" '+(ans[idx]===null?'disabled':'')+'>'+(idx===qs.length-1?'Результат':'Далее →')+'</button></div><button id="quit">Выйти и удалить ответы</button>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ans[idx]=+b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#next').disabled=false});document.querySelector('#back').onclick=()=>{if(idx>0){idx--;question()}else{home()}};document.querySelector('#next').onclick=()=>{if(ans[idx]===null)return;if(++idx===qs.length)results();else question()};document.querySelector('#quit').onclick=()=>{if(confirm('Удалить все ответы?'))reset()};window.scrollTo(0,0);app.focus({preventScroll:true})}
function reset(){ans=[];qs=[];idx=0;consent=false;home();window.scrollTo(0,0)}
function results(){
if(ans.some(x=>x===null))return;
let s={},c={};qs.forEach((q,i)=>{s[q.key]=(s[q.key]||0)+(q.rev?6-ans[i]:ans[i]);c[q.key]=(c[q.key]||0)+1});for(let k in s)s[k]=(s[k]/c[k]-1)*25;
const ranked=roles.map((r,i)=>({r,p:plainProfiles[i],v:r[1].reduce((a,k)=>a+s[k],0)/r[1].length})).sort((a,b)=>b.v-a.v);
const lead=ranked[0].v,tail=ranked[ranked.length-1].v,flat=lead-tail<=5;
const near=ranked.filter(x=>lead-x.v<=5),main=near.filter(x=>x.v>=75),extra=ranked.filter(x=>!main.includes(x)&&x.v>=55),lower=ranked.filter(x=>x.v<55);
const names=a=>a.map(x=>x.p[0]).join(', ');
const pct=x=>Math.round(x.v)+'%';
const status=x=>x.v>=75?'Близко вам':x.v>=55?'Возможно, интересно':'Стоит попробовать, если интересно';
const tone=x=>x.v>=75?'high':x.v>=55?'mid':'low';
const bar=(name,value,percent=false,cls='')=>'<div class="row"><span>'+name+'</span><strong class="num">'+Math.round(value)+(percent?'%':'/100')+'</strong></div><div class="bar '+cls+'"><i style="width:'+value+'%"></i></div>';
const intro=flat?'Ответы по всем ролям получились близкими. Пока нельзя уверенно выделить одну ведущую роль. Попробуйте несколько разных занятий и сравните свои впечатления.':main.length?'По вашим ответам вам особенно близко '+main.map(x=>x.p[1]).join('; ')+'. Это направления, с которых можно начать.': 'Ваши относительно более близкие роли — '+names(near)+'. Пока ответы не показывают ярко выраженного ведущего направления: полезно попробовать несколько вариантов на практике.';
const sortedKeys=x=>x.r[1].slice().sort((a,b)=>s[a]-s[b]);
const stretch=x=>{const keys=sortedKeys(x),k=keys[0];return exercises[k]||x.p[3]};
const roleText=x=>x.v>=75?'По вашим ответам вам, скорее всего, нравится '+x.p[1]+'. Возможно, начать с этого направления будет комфортнее.':x.v>=55?'Вам могут быть интересны задачи, где нужно '+x.p[1]+'. Попробуйте небольшое дело, чтобы понять, насколько вам это подходит.':'Сейчас вы меньше отмечаете интерес или качества, связанные с тем, чтобы '+x.p[1]+'. Это не означает, что у вас нет способностей. Развивать эту роль стоит, только если она вам интересна.';
const card=x=>'<article class="role-card"><div class="row role-head"><div><div class="role">'+x.p[0]+'</div><small class="'+tone(x)+'-text">'+status(x)+'</small></div><div class="score '+tone(x)+'-text">'+pct(x)+'</div></div><div class="bar '+tone(x)+'"><i style="width:'+x.v+'%"></i></div><p>'+roleText(x)+'</p><p><strong>Что попробовать:</strong> '+x.p[2]+'.</p><p><strong>Как развивать:</strong> '+stretch(x)+'</p></article>';
let plan=flat?ranked.slice(0,3):[ranked[0],...(ranked.find(x=>x.v<75&&x!==ranked[0])?[ranked.find(x=>x.v<75&&x!==ranked[0])]:ranked.slice(1,2)),...(ranked[6].v<55&&ranked[6]!==ranked[0]&&ranked[6]!==ranked.find(x=>x.v<75&&x!==ranked[0])?[ranked[6]]:[])];
let partnerNames=[...new Set(near.slice(0,2).map(x=>x.p[4]))];
const partners=near.slice(0,2).map(x=>'<p><strong>'+x.p[4]+'</strong> — '+x.p[5]+'.</p>').join('');
const strengths=meta.filter(x=>x.key.startsWith('W')).sort((a,b)=>s[b.key]-s[a.key]);
const interests=meta.filter(x=>['R','I','AR','S','EN','CO'].includes(x.key)).sort((a,b)=>s[b.key]-s[a.key]);
app.innerHTML='<div class="chip">ВАШ ПРОФИЛЬ · '+mode+' ВОПРОСОВ · V3</div><h1>Твой вклад в новый мир</h1><div class="panel"><h2>Что говорят ваши ответы</h2><p>'+intro+'</p><p><strong>С чего начать:</strong> '+(flat?'выберите любую интересную роль из списка и попробуйте небольшое дело.':ranked[0].p[3])+ '</p></div><div class="panel"><h2>Ваши 7 ролей</h2><p class="muted">Проценты показывают, насколько ваши ответы соответствуют описанию каждой роли. Они независимы и не должны в сумме давать 100%. Это не проценты ваших способностей и не прогноз успеха.</p>'+ranked.map(x=>bar(x.p[0],x.v,true,tone(x))).join('')+'<div class="legend"><span class="high-text">75–100% · близко вам</span><span class="mid-text">55–74% · возможно, интересно</span><span class="low-text">0–54% · можно попробовать</span></div></div><div class="panel"><h2>Что может даваться легче</h2><p>'+(main.length&&!flat?names(main)+' — по самооценке вам ближе эти направления.':'Пока нельзя уверенно выделить естественную роль. Выберите интересное направление и проверьте его небольшим делом.')+'</p><h3>Дополнительные роли</h3><p>'+(flat?'Различия небольшие; выделять дополнительные роли пока рано.':extra.length?names(extra)+' — могут дополнить ваши основные интересы.':'По текущим ответам выраженных дополнительных направлений не выделяется.')+'</p><h3>Что можно развивать</h3><p>'+(lower.length?names(lower)+' — попробуйте эти направления, только если они вам интересны. Низкая оценка не означает слабость.':'Не обязательно искать слабую роль. Можно развивать то, что вам уже интересно.')+'</p></div><h2>Что означает каждая роль</h2>'+ranked.map(card).join('')+'<div class="panel"><h2>С кем можно объединиться</h2><p>В совместном проекте вас могут дополнить люди с такими интересами:</p>'+partners+'<small>Это идеи для сотрудничества, а не оценка совместимости с конкретным человеком.</small></div><div class="panel"><h2>Подходящие проекты</h2>'+near.slice(0,3).map(x=>'<p><strong>'+x.p[0]+':</strong> '+x.p[2]+'.</p>').join('')+'<h2>Ваш план на неделю</h2>'+plan.map((x,i)=>'<p><strong>Шаг '+(i+1)+' · '+x.p[0]+':</strong> '+(i===0?x.p[3]:stretch(x))+'</p>').join('')+'<p>После каждого шага отметьте, понравилось ли занятие, насколько легко было начать и хочется ли продолжать.</p></div><div class="panel"><h2>Подробнее о ваших ответах</h2><p>Интересы: '+interests.slice(0,2).map(x=>x.name.toLowerCase()).join(', ')+'.</p><p>Сильные стороны, которые вы отметили: '+strengths.slice(0,3).map(x=>x.name.toLowerCase()).join(', ')+'.</p>'+groups.map(([g,r])=>'<details><summary>'+g+'</summary>'+r.map(x=>bar(x[1],s[x[0]])).join('')+'</details>').join('')+'</div><div class="panel community"><div class="chip">ВАШ СЛЕДУЮЩИЙ ШАГ</div><h2>Найди своих. Создай новый мир.</h2><p>Вы уже сделали первый шаг — лучше узнали себя. Теперь познакомьтесь с людьми, с которыми сможете раскрывать свои таланты, воплощать идеи и создавать совместные проекты.</p><p><strong>Присоединяйтесь к международному сообществу «Мир, который уже есть».</strong></p><a class="join" href="https://t.me/this_world_exist" target="_blank" rel="noopener noreferrer" id="join">Присоединиться к сообществу →</a><p class="muted">Участие добровольное. Ваши ответы и результаты не передаются сообществу.</p><button id="save" class="primary">Сохранить мой профиль</button><button id="reset">Пройти заново и удалить ответы</button></div><details><summary>Как понимать результаты</summary><p>Это авторский исследовательский опросник, вдохновлённый шестью научными моделями, а не стандартизованный тест. Каждая роль рассчитана как среднее четырёх выбранных показателей. Пороги 55% и 75% и разница до 5 баллов — условные авторские ориентиры, не научные нормы. '+(mode===30?'В экспресс-версии каждый показатель опирается на один ответ.':'В расширенной версии каждый показатель опирается на четыре ответа.')+' Лёгкость выполнения задач и способности проверяются практикой. Не используйте результаты для диагностики, найма или отбора участников.</p></details>';
document.querySelector('#reset').onclick=reset;
document.querySelector('#save').onclick=()=>{let t=['Мир, который уже есть — мой профиль',intro,'','Все роли:',...ranked.map(x=>x.p[0]+' — '+pct(x)+'\n'+roleText(x)+'\nЧто попробовать: '+x.p[2]+'\nКак развивать: '+stretch(x)),'','Партнёры: '+partnerNames.join(', '),'План на неделю:',...plan.map((x,i)=>(i+1)+'. '+(i===0?x.p[3]:stretch(x))),'','Авторские оценки соответствия ответов; не диагноз и не оценка способностей.'].join('\n');let b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='world-profile.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
window.scrollTo(0,0);app.focus({preventScroll:true})}
home();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111824"><title>Мир, который уже есть — тест</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font:16px/1.55 system-ui,sans-serif;color:#f4f1e8;background:#101621;min-height:100dvh}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 85% 4%,#82684c55,transparent 45%),radial-gradient(ellipse at 0 72%,#325a7055,transparent 60%),#101621}main{max-width:720px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));}header{display:flex;align-items:center;gap:12px;letter-spacing:2px;font-size:11px;color:#d7c4a5;text-transform:uppercase;margin-bottom:32px}.orb{height:40px;width:40px;border:1px solid #f1c995;border-radius:50%;box-shadow:0 0 30px #efb87255,inset 0 0 18px #efb87244;background:radial-gradient(circle at 40% 40%,#f9e2bb,#947552 22%,#172735 65%);flex:none}h1{font:normal clamp(34px,7vw,58px)/1.05 Georgia,serif;margin:14px 0 20px;letter-spacing:-1.5px}h2{font:normal 27px/1.3 Georgia,serif;margin:12px 0 24px}h3{font-size:18px;margin:24px 0 12px}p{color:#c5cbd3}small,.muted{color:#a8b3c1;font-size:13px}button{font:inherit;cursor:pointer;min-height:52px;touch-action:manipulation;border-radius:14px;padding:12px 16px;border:1px solid #ffffff28;background:#ffffff0a;color:inherit;text-align:left;width:100%;margin:5px 0}button:hover,button[aria-pressed=true]{border-color:#e3c295;background:#e3c29520}button.primary{background:#e5c598;color:#1b1a19;font-weight:700;border:0;text-align:center}button:disabled{opacity:.35;cursor:default}.panel{background:#ffffff06;border:1px solid #ffffff18;border-radius:24px;padding:22px;margin:16px 0}.track{height:5px;background:#ffffff16;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9dbcc4,#efcc9a);transition:width .25s}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row button{width:auto;min-height:42px}a{color:#f0cf9d}details{margin:18px 0}summary{cursor:pointer;color:#e5c598}.bar{height:7px;background:#ffffff15;border-radius:8px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#719ba8,#efcc9a)}.role{font:normal 32px Georgia;color:#f3d4a6}.chip{font-size:13px;color:#c2b8a7;letter-spacing:.04em}.check{display:flex;gap:12px;align-items:flex-start;margin:18px 0}.check input{width:20px;height:20px;flex:none;accent-color:#e5c598}#app{outline:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f0cf9d;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><div class="orb" aria-hidden="true"></div><span>Мир, который уже есть<br>Пространство самопознания</span></header><section id="app" tabindex="-1"></section></main><script>
const groups=[["Черты личности · Big Five",[["O","Открытость опыту","Мне нравится знакомиться с непривычными идеями.","Я ищу новые способы взглянуть на знакомые вещи.","Мне редко интересно пробовать что-то незнакомое.","Я охотно изучаю темы за пределами своей специальности."],["C","Организованность","Я довожу запланированные дела до конца.","Я заранее распределяю время на важные задачи.","Я часто оставляю начатое незавершённым.","Я проверяю детали перед завершением работы."],["E","Экстраверсия","Общение с людьми обычно придаёт мне энергии.","Я охотно начинаю разговор в новой компании.","Я предпочитаю оставаться в стороне на общих встречах.","Мне нравится активное участие в групповых обсуждениях."],["A","Доброжелательность","Я стараюсь учитывать точку зрения другого человека.","При разногласиях я ищу взаимоприемлемое решение.","Мне трудно принимать во внимание чужие интересы.","Я готов уступить в мелочах ради сотрудничества."],["N","Эмоциональная устойчивость","Я обычно сохраняю спокойствие при неожиданностях.","После неприятности я возвращаюсь к привычным делам.","Небольшие трудности надолго выбивают меня из равновесия.","В напряжённой обстановке я сохраняю способность обдумывать решения."]]],["Ценности · Шварц",[["V1","Открытость изменениям","Для меня важно самостоятельно выбирать направление жизни.","Я ценю возможность исследовать неизвестное.","Мне важнее привычность, чем возможность нового опыта.","Свобода пробовать необычное для меня значима."],["V2","Забота о других","Мне важно, чтобы мои действия приносили пользу другим.","Я ценю справедливое отношение к незнакомым людям.","Благополучие людей вне моего круга мало значит для меня.","Я считаю заботу об окружающей среде важной ценностью."],["V3","Достижения и влияние","Мне важно достигать заметных результатов.","Я ценю возможность влиять на решения.","Личное признание моих достижений для меня несущественно.","Мне важно добиваться высоких результатов в выбранном деле."],["V4","Стабильность и порядок","Для меня важны безопасность и предсказуемость.","Я ценю преемственность привычек и традиций.","Стабильность среды для меня практически не имеет значения.","Мне важно соблюдать договорённости, поддерживающие общий порядок."]]],["Базовые потребности · SDT (последние 4 недели)",[["D1","Автономия","В последнее время я чувствую, что мои решения отражают мой собственный выбор.","Я ощущаю свободу выбирать способ выполнения важных дел.","Мне часто кажется, что я действую только по чужому указанию.","Мои повседневные действия согласуются с тем, чего я сам хочу."],["D2","Компетентность","В последнее время я чувствую, что справляюсь со значимыми задачами.","Я замечаю, что освоенные навыки помогают мне в делах.","Мне часто кажется, что даже посильные задачи мне не удаются.","Я ощущаю прогресс в том, что для меня важно."],["D3","Связанность","В последнее время я ощущаю поддержку близких мне людей.","Я чувствую, что меня принимают в значимых отношениях.","Мне не хватает ощущения принадлежности к людям вокруг.","У меня есть люди, с которыми я ощущаю взаимную близость."]]],["Интересы · RIASEC",[["R","Практический","Мне интересно создавать или ремонтировать вещи своими руками.","Мне хотелось бы собирать работающие устройства.","Работа с инструментами меня почти не привлекает.","Мне интересно решать практические технические задачи."],["I","Исследовательский","Мне нравится выяснять причины явлений.","Мне интересно сравнивать данные и искать закономерности.","Мне скучно разбираться в сложных вопросах.","Я охотно проверяю гипотезы на фактах."],["AR","Художественный","Мне интересно создавать произведения искусства или необычные формы.","Мне нравится выражать идеи через музыку, текст или изображение.","Создание оригинальных художественных работ меня мало интересует.","Я охотно экспериментирую с выразительными средствами."],["S","Социальный","Мне интересно помогать людям осваивать новые навыки.","Мне нравится объяснять сложное доступным языком.","Задачи, связанные с поддержкой людей, меня мало привлекают.","Мне интересно организовывать совместное обучение."],["EN","Предпринимательский","Мне нравится превращать идеи в реальные проекты с участниками.","Мне интересно договариваться о ресурсах для инициатив.","Ведение переговоров о совместных проектах меня не привлекает.","Мне нравится убеждать людей присоединиться к полезной инициативе."],["CO","Структурный","Мне интересно приводить документы и процессы в порядок.","Мне нравится систематизировать информацию.","Работа с таблицами, перечнями и правилами меня почти не привлекает.","Мне интересно выстраивать повторяемые рабочие процедуры."]]],["Сильные стороны · VIA (10 выбранных)",[["W1","Любознательность","Я регулярно задаю вопросы о том, чего не понимаю.","Я охотно узнаю, как устроены незнакомые вещи.","Я редко интересуюсь тем, что выходит за рамки привычного.","Я самостоятельно ищу ответы на возникшие вопросы."],["W2","Критическое мышление","Прежде чем согласиться с идеей, я рассматриваю аргументы за и против.","Я проверяю источники важных утверждений.","Я редко пересматриваю мнение после новых фактов.","Я отличаю предположения от проверенных сведений."],["W3","Креативность","Я часто придумываю несколько способов решить одну задачу.","Я соединяю идеи из разных областей.","Я редко ищу нестандартные решения.","Я нахожу новые применения знакомым вещам."],["W4","Настойчивость","Я продолжаю работу после первых неудач.","Я возвращаюсь к важной задаче после перерыва.","При первых препятствиях я обычно отказываюсь от цели.","Я стараюсь завершить трудное дело поэтапно."],["W5","Смелость","Я готов высказать обоснованное мнение, даже если оно непопулярно.","Я решаюсь начать значимое дело несмотря на неопределённость.","Я часто избегаю важных разговоров из-за возможного несогласия.","Я защищаю важный для меня принцип в сложной ситуации."],["W6","Доброта","Я стараюсь помочь человеку, если вижу, что ему нужна помощь.","Я уделяю время поддержке других без ожидания выгоды.","Я редко предлагаю помощь, когда могу её оказать.","Я замечаю небольшие возможности облегчить кому-то день."],["W7","Социальный интеллект","Я стараюсь понять, что чувствует собеседник.","Я замечаю изменения настроения людей во время разговора.","Я редко учитываю эмоциональный контекст беседы.","Я подбираю способ общения с учётом ситуации другого человека."],["W8","Командность","Я выполняю свою часть общей работы.","Я делюсь информацией, которая помогает команде.","Мне трудно согласовывать собственные действия с общими задачами.","Я учитываю вклад других участников в общий результат."],["W9","Лидерство","Я помогаю группе сформулировать общую цель.","Я стараюсь согласовать действия участников при совместной работе.","Я редко беру на себя координацию, когда она необходима.","Я помогаю группе распределить ответственность за решения."],["W10","Саморегуляция","Я умею придерживаться выбранного режима действий.","Я могу остановиться и обдумать импульсивное решение.","Мне сложно соблюдать собственные рабочие ограничения.","Я распределяю усилия, чтобы не потерять темп работы."]]],["Творческое Я · SSCS",[["K1","Творческая самоэффективность","Я верю, что смогу найти оригинальное решение сложной задачи.","Я уверен в способности создавать новые идеи даже при ограничениях.","Мне трудно поверить, что я способен придумать что-то новое.","Я уверен, что смогу улучшить первоначальную идею после обратной связи."],["K2","Творческая идентичность","Творчество является важной частью того, кем я себя считаю.","Мне важно видеть возможность создавать новое в своей жизни.","Творческая деятельность почти не связана с моим представлением о себе.","Я воспринимаю способность к самовыражению как важную часть себя."]]]];
const app=document.querySelector('#app');let qs=[],ans=[],idx=0,mode=30,consent=false;
const roles=[
['Творец',['AR','W3','K1','K2'],'Создавать художественные формы и оригинальные продукты.','Сделайте небольшой творческий прототип за неделю.'],
['Визионер',['O','V1','K2','W5'],'Предлагать новые направления и объединяющие концепции.','Опишите одну идею будущего и первый проверяемый шаг.'],
['Исследователь',['I','W1','W2','O'],'Изучать сложные вопросы, проверять идеи и находить закономерности.','Сформулируйте гипотезу и проверьте её на трёх источниках.'],
['Наставник',['S','W6','W7','V2'],'Помогать людям учиться и раскрывать способности.','Проведите небольшую встречу по теме, которую хорошо знаете.'],
['Организатор',['CO','C','W8','W10'],'Превращать общие задачи в устойчивые рабочие процессы.','Составьте план небольшого проекта с ответственными и сроками.'],
['Стратег',['EN','W2','V3','W9'],'Соединять цели, ресурсы и решения.','Сравните два способа реализации одной идеи по затратам и эффекту.'],
['Объединитель',['E','A','W7','W8'],'Создавать связи и поддерживать сотрудничество.','Пригласите несколько людей обсудить общий интерес.']];
const labels=['Совершенно не согласен','Скорее не согласен','Ни согласен, ни не согласен','Скорее согласен','Полностью согласен'];
const meta=groups.flatMap(([g,rows])=>rows.map(r=>({g,key:r[0],name:r[1]})));
function make(n){const rows=groups.flatMap(([g,rr])=>rr.map(r=>({g,r})));return Array.from({length:n===30?1:4},(_,j)=>rows.map(({g,r})=>({g,key:r[0],t:r[j+2],rev:j===2}))).flat()}
function home(){app.innerHTML='<div class="chip">АВТОРСКИЙ ОПРОСНИК · 18+</div><h1>Твоя роль в создании нового мира</h1><p>Исследуйте свои интересы, ценности, особенности и творческое самовосприятие. Узнайте, какие способы участия в совместных проектах вам ближе.</p><div class="panel"><label class="check"><input type="checkbox" id="agree" '+(consent?'checked':'')+'><span>Мне исполнилось 18 лет. Я добровольно прохожу исследовательский опросник и понимаю, что это не диагностика. Ответы остаются в памяти этой страницы; сервер их не получает.</span></label><button id="short" class="primary" '+(!consent?'disabled':'')+'>Экспресс · 30 вопросов · ~5 минут</button><button id="long" '+(!consent?'disabled':'')+'>Расширенный · 120 вопросов · ~20 минут</button></div><details><summary>Научная основа и ограничения</summary><p>Авторские утверждения, вдохновлённые шестью моделями, не являются оригинальными стандартизованными методиками. 30 показателей: пять черт, четыре группы ценностей, три потребности, шесть интересов, десять выбранных сильных сторон и два аспекта творческого Я. Нет норм, установленной надёжности или валидности. Экспресс-версия содержит лишь одно утверждение на показатель. Роли — авторские гипотезы для саморефлексии, не классификация пригодности. Не используйте результаты для найма, диагностики или отбора участников.</p><p><a href="https://ipip.ori.org/">Big Five / IPIP</a> · <a href="https://doi.org/10.9707/2307-0919.1116">Шварц</a> · <a href="https://selfdeterminationtheory.org/the-theory/">SDT</a> · <a href="https://www.onetcenter.org/reports/IP_Manual.html">RIASEC</a> · <a href="https://www.viacharacter.org/character-strengths-via">VIA</a> · <a href="https://www.creativity-lab.pl/resources">SSCS</a></p></details>';document.querySelector('#agree').onchange=e=>{consent=e.target.checked;document.querySelector('#short').disabled=document.querySelector('#long').disabled=!consent};document.querySelector('#short').onclick=()=>start(30);document.querySelector('#long').onclick=()=>start(120)}
function start(n){mode=n;qs=make(n);ans=Array(n).fill(null);idx=0;question()}
function question(){let q=qs[idx];app.innerHTML='<div class="row"><small>Вопрос '+(idx+1)+' из '+qs.length+'</small><small>'+Math.round(idx/qs.length*100)+'%</small></div><div class="track"><div class="fill" style="width:'+idx/qs.length*100+'%"></div></div><div class="panel"><div class="chip">'+q.g+'</div><h2>'+q.t+'</h2><div id="choices">'+labels.map((l,i)=>'<button aria-pressed="'+(ans[idx]===i+1)+'" data-v="'+(i+1)+'">'+l+'</button>').join('')+'</div><p class="muted">Выберите ответ, наиболее близкий вашему опыту.</p></div><div class="row"><button id="back">← Назад</button><button id="next" class="primary" '+(ans[idx]===null?'disabled':'')+'>'+(idx===qs.length-1?'Результат':'Далее →')+'</button></div><button id="quit">Выйти и удалить ответы</button>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ans[idx]=+b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#next').disabled=false});document.querySelector('#back').onclick=()=>{if(idx>0){idx--;question()}else{home()}};document.querySelector('#next').onclick=()=>{if(ans[idx]===null)return;if(++idx===qs.length)results();else question()};document.querySelector('#quit').onclick=()=>{if(confirm('Удалить все ответы?'))reset()};window.scrollTo(0,0);app.focus({preventScroll:true})}
function reset(){ans=[];qs=[];idx=0;consent=false;home();window.scrollTo(0,0)}
function results(){if(ans.some(x=>x===null))return;let s={},c={};qs.forEach((q,i)=>{s[q.key]=(s[q.key]||0)+(q.rev?6-ans[i]:ans[i]);c[q.key]=(c[q.key]||0)+1});for(let k in s)s[k]=(s[k]/c[k]-1)*25;const ranked=roles.map(r=>({r,v:r[1].reduce((a,k)=>a+s[k],0)/r[1].length})).sort((a,b)=>b.v-a.v);const top=ranked.filter(x=>ranked[0].v-x.v<=5);const interests=meta.filter(x=>['R','I','AR','S','EN','CO'].includes(x.key)).sort((a,b)=>s[b.key]-s[a.key]);const strengths=meta.filter(x=>x.key.startsWith('W')).sort((a,b)=>s[b.key]-s[a.key]);const needs=meta.filter(x=>x.key.startsWith('D')).sort((a,b)=>s[a.key]-s[b.key]);const bar=(name,value)=>'<div class="row"><span>'+name+'</span><small>'+Math.round(value)+'/100</small></div><div class="bar"><i style="width:'+value+'%"></i></div>';app.innerHTML='<div class="chip">ВАШ ПРОФИЛЬ · '+mode+' ВОПРОСОВ</div><h1>Твой вклад в новый мир</h1><p>Баллы отражают ваши ответы, а не процентили населения, способности или вероятность успеха.</p><div class="panel"><small>Роли для исследования'+(top.length>1?' · близкие оценки':'')+'</small>'+top.map(x=>'<div class="role">'+x.r[0]+'</div><p>'+x.r[2]+'</p><p><strong>Первый шаг:</strong> '+x.r[3]+'</p>').join('')+'<small>Разница до 5 баллов считается близкой по условному авторскому правилу, а не статистически доказанным порогом.</small></div><div class="panel"><h3>Карта возможных ролей</h3>'+ranked.map(x=>bar(x.r[0],x.v)).join('')+'</div><div class="panel"><h3>Что можно исследовать дальше</h3><p>Интересы: '+interests.slice(0,2).map(x=>x.name.toLowerCase()).join(', ')+'.</p><p>Отмеченные сильные стороны: '+strengths.slice(0,3).map(x=>x.name.toLowerCase()).join(', ')+'.</p><p>Потребность с наименьшим самоотчётным баллом: '+needs[0].name.toLowerCase()+'. Подумайте, какие обстоятельства могли повлиять на ваши ответы и какие условия помогли бы вам чувствовать себя лучше.</p></div><div class="panel"><h3>Все 30 показателей</h3>'+groups.map(([g,r])=>'<details><summary>'+g+'</summary>'+r.map(x=>bar(x[1],s[x[0]])).join('')+'</details>').join('')+'</div><div class="panel"><h3>Мир, который уже есть</h3><p>Приглашаем познакомиться с идеей сообщества и совместных творческих проектов. Результат не является условием участия.</p><p><small>Ссылка на сообщество пока не добавлена.</small></p><button id="save" class="primary">Сохранить профиль текстом</button><button id="reset">Пройти заново и удалить ответы</button></div><small>Не клинический тест. '+(mode===30?'Экспресс-оценка по одному утверждению на показатель особенно нестабильна.':'Расширенная версия также требует отдельной психометрической валидации.')+'</small>';document.querySelector('#reset').onclick=reset;document.querySelector('#save').onclick=()=>{let t='Мир, который уже есть — авторский профиль\nРоли: '+top.map(x=>x.r[0]).join(', ')+'\n'+meta.map(x=>x.name+': '+Math.round(s[x.key])+'/100').join('\n')+'\nНе валидировано; не диагностика.';let b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='world-profile.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};window.scrollTo(0,0);app.focus({preventScroll:true})}home();</script></body></html>
